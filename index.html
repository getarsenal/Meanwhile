/* THE ARRIVAL. A disk lying on a floor, the app's mark cut out of it, that spins up and lifts into
   the sphere. Pure canvas — no image to load, so it works offline and on the first paint. */
function globeDrawIntro(ctx,W0,H0,R,t){
  const cx=W0/2, cy=H0/2;
  const ease=1-Math.pow(1-t,3);
  const spin=ease*Math.PI*7;
  const lie=Math.pow(1-ease,1.4);                 // 1 = flat on the floor, 0 = facing you
  const ry=cy+lie*H0*0.16;
  const sq=0.12+0.88*(1-lie);                     // the ellipse standing up
  ctx.save();
  ctx.translate(cx,ry); ctx.scale(1,Math.max(0.06,sq));
  // the floor it sits on
  if(lie>0.02){
    const fl=ctx.createRadialGradient(0,0,R*0.2,0,0,R*2.2);
    fl.addColorStop(0,`rgba(94,106,210,${0.20*lie})`); fl.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=fl; ctx.beginPath(); ctx.arc(0,0,R*2.2,0,7); ctx.fill();
  }
  ctx.rotate(spin);
  const rr=R*(0.55+0.45*ease);
  const rim=ctx.createLinearGradient(-rr,-rr,rr,rr);
  rim.addColorStop(0,"#6d72c4"); rim.addColorStop(0.5,"#9aa6ff"); rim.addColorStop(1,"#4ea3a0");
  ctx.strokeStyle=rim; ctx.lineWidth=Math.max(1.5,rr*0.055);
  ctx.beginPath(); ctx.arc(0,0,rr,0,7); ctx.stroke();
  ctx.strokeStyle=globeRGBA("#9aa6ff",0.45); ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0,0,rr*0.78,0,7); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,rr*0.34,0,7); ctx.stroke();
  // the cut-out: spokes through the plate, so the light reads through it
  for(let i=0;i<12;i++){ const a=i*Math.PI/6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*rr*0.36,Math.sin(a)*rr*0.36);
    ctx.lineTo(Math.cos(a)*rr*0.76,Math.sin(a)*rr*0.76);
    ctx.strokeStyle=globeRGBA("#9aa6ff",0.16+0.5*Math.abs(Math.sin(a*2+spin)));
    ctx.lineWidth=Math.max(1,rr*0.02); ctx.stroke();
  }
  const core=ctx.createRadialGradient(0,0,0,0,0,rr*0.34);
  core.addColorStop(0,`rgba(230,235,255,${0.5+0.4*ease})`); core.addColorStop(1,"rgba(109,114,196,0)");
  ctx.fillStyle=core; ctx.beginPath(); ctx.arc(0,0,rr*0.34,0,7); ctx.fill();
  ctx.restore();
  // the sphere resolving out of it
  if(ease>0.55){
    const k=(ease-0.55)/0.45;
    ctx.strokeStyle=globeRGBA("#9aa6ff",0.30*k);
    ctx.lineWidth=1;
    for(let m=0;m<6;m++){ const a=m*Math.PI/6+spin*0.1;
      ctx.beginPath(); ctx.ellipse(cx,cy,R*Math.abs(Math.cos(a)),R,0,0,7); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.stroke();
  }
}

  if(!fromUser){ const sl=document.getElementById("glTime"); if(sl) sl.value=globeTime||span.max; }

function globePlayToggle(){

  let t=span.min, step=(span.max-span.min)/90;          // about six seconds end to end

/* ================= TODAY'S OBJECTIVES =================

   something real. The job description is the waypoint — it's the only statement of what you were
   actually hired to do, and the value is in correlating it against what your notes are telling you.

function objMaterial(o){

  if(projs.length) L.push("PROJECTS:\n"+projs.slice(0,12).map(p=>`- ${id("project",p)} ${p.name} — ${p.status||"?"}${p.ownerId?", owner "+entLabel("person",p.ownerId):", no owner recorded"}`).join("\n"));

  if(sys.length) L.push("SYSTEMS: "+sys.slice(0,15).map(s=>`${id("system",s)} ${s.name}`).join(", "));
  const notes=wOf("captures",o.id).sort((a,b)=>b.at-a.at).slice(0,15);
  if(notes.length) L.push("RECENT NOTES (newest first):\n"+notes.map(c=>`- ${id("capture",c)} ${fmtDate(ymdOf(c.at))}: ${String(c.text||"").replace(/\s+/g," ").slice(0,300)}`).join("\n"));

  // the model guess at urgency. "Open for 34 days" is what makes an objective urgent today.
  const aged=[];

const OBJ_WHEN={now:{label:"Do first",col:"var(--bad)",rank:0},today:{label:"Today",col:"var(--warn)",rank:1},week:{label:"This week",col:"var(--muted)",rank:2}};
function objectivesPrompt(o){
  const jd=jdText(o), day=hireDay(o);

${jd?`--- THE JOB DESCRIPTION THEY WERE HIRED AGAINST ---\n${jd.slice(0,3500)}\n--- END ---`:"(No job description on file — work from the notes alone and leave every \"jd\" field empty.)"}

${mePrompt(o)}
--- WHAT THEIR NOTES CONTAIN ---
${objMaterial(o)||"(almost nothing yet)"}
--- END ---

EVERY objective must be schedulable. A person should be able to read it and know when to do it and
roughly how long it takes:
- "when": "now" (do it before anything else — someone is blocked or a deadline is on top of you),
  "today" (it belongs in today), or "week" (this week, but not necessarily today). Use "now"
  sparingly — at most one.
- "mins": a realistic estimate in minutes, one of 10, 20, 30, 60. A message is 10. A conversation
  is 30. Digging into something is 60.
- Order them the way you would actually do them.

- It is a thing a person can actually start today: talk to someone, find something out, unblock something, write something down. Not "continue to monitor".
- It is open-ended and about the JOB, not about tidying this app. Never suggest recording, filing, tagging or documenting something just to fill in the map.
- It is urgent or high-leverage *right now*, given how far into the job they are.
- The best ones connect the job description to what the notes actually show — something they were hired to do, that their notes suggest is at risk, unowned, blocked or unknown.

Rules that matter more than being helpful:
- Use ONLY what is above. Never invent a person, system, project, deadline, meeting or fact.
- "cites" must be ids copied EXACTLY from the material above, in the form type:id — e.g. problem:k3f9a2. Every objective needs at least one cite, OR a "jd" quote, ideally both.
- "jd" must be a SHORT VERBATIM quote from the job description — copied character for character, at most 120 characters. If nothing in the JD applies, use "".
- "why" is one sentence in plain words: what in their notes makes this urgent, and how it ties to what they were hired for.
- Do not repeat something already on their list unless it is now overdue and worth restating.

Return ONLY this JSON:
{"objectives":[{"do":"","why":"","jd":"","when":"now|today|week","mins":10,"cites":["type:id"]}]}`;

/* Keep only the objectives whose evidence is real: ids that resolve, and a JD quote that actually
   appears in the job description. A hallucinated citation is worse than no citation, because it
   reads as proof. */
function buildObjectives(o,d){
  const jdNorm=norm(jdText(o));
  const out=[];
  ((d&&d.objectives)||[]).forEach(x=>{
    if(!x||!x.do||!String(x.do).trim()) return;
    const cites=[];
    (x.cites||[]).forEach(c=>{
      const m=/^\s*([a-z]+)\s*:\s*(.+?)\s*$/i.exec(String(c)||"");
      if(!m) return;
      const t=m[1].toLowerCase(), id=m[2];
      if(!ENT[t]) return;
      if(!entGet(t,id)) return;                       // points at nothing — drop it
      if(!cites.some(y=>y.t===t&&y.id===id)) cites.push({t,id});
    });
    let jd=String(x.jd||"").trim().slice(0,160);
    if(jd && (!jdNorm || !jdNorm.includes(norm(jd)))) jd="";   // not actually in the JD — drop the quote
    if(!cites.length && !jd) return;                  // no real evidence at all — drop the objective
    const when = OBJ_WHEN[String(x.when||"").toLowerCase()] ? String(x.when).toLowerCase() : "today";
    const mins = [10,20,30,60].includes(+x.mins) ? +x.mins : 30;
    out.push({id:uid(), do:String(x.do).trim().slice(0,220), why:String(x.why||"").trim().slice(0,300),
      jd, cites, when, mins, done:false});
  });
  return out.slice(0,5);
}
/* With no AI configured this still has to say something useful, so the same shape is computed

function objectivesFallback(o){
  const out=[];

  if(o.nextActionLabel){
    const d=o.nextActionDate?daysUntil(o.nextActionDate):null;
    push(o.nextActionLabel, o.nextActionDate?`You set this yourself, due ${fmtDate(o.nextActionDate)}${d!=null&&d<0?` — ${Math.abs(d)} days ago`:""}.`:"You set this yourself.",
      [], d!=null&&d<=0?"now":"today", 30);
  }
  wOf("problems",o.id).filter(p=>/investigating|discovered/i.test(p.status||"")).sort((a,b)=>a.at-b.at).slice(0,2)
    .forEach(p=>push(`Move "${p.title||p.name}" forward`,`Still ${String(p.status||"open").toLowerCase()} after ${ageDays(p.at)} days.`,[{t:"problem",id:p.id}],ageDays(p.at)>30?"now":"today",30));
  wOf("questions",o.id).filter(q=>q.status==="Open").sort((a,b)=>a.at-b.at).slice(0,2)
    .forEach(q=>push(`Get an answer: ${q.q}`, q.why?String(q.why).slice(0,140):`Open for ${ageDays(q.at)} days.`,[{t:"question",id:q.id}],"today",20));
  wOf("projects",o.id).filter(p=>!p.ownerId&&/active/i.test(p.status||"")).slice(0,1)
    .forEach(p=>push(`Find out who owns ${p.name}`,"It's active in your notes but nobody is recorded as owning it.",[{t:"project",id:p.id}],"week",10));
  return out.slice(0,5);
}
async function runObjectives(auto){

    const items=objectivesFallback(o);
    if(auto&&!items.length) return;          // nothing to say yet — leave the invitation in place
    saveObjectives(o,items,"computed");
    render(); say(items.length?"Built from your notes — connect an AI for sharper ones":"Not enough in your notes yet");
    return;
  }
  if(box) box.innerHTML=`<div class="obj-load">Reading the job description against your notes…</div>`;
  try{
    const out=await aiCall(objectivesPrompt(o),null,{maxTokens:1800});
    const items=buildObjectives(o,aiParse(out));
    if(!items.length){ const fb=objectivesFallback(o); saveObjectives(o,fb,"computed"); render();
      say(fb.length?"Nothing new stood out — here's what's open":"Capture a few notes first"); return; }

  }catch(e){

    // computed list, which is always available, and only say so if the user asked for this.

      return; }
    if(box) box.innerHTML=`<div class="obj-load" style="color:var(--bad)">⚠ ${esc(e.message)}</div>`;
  }
}

/* ======================= THE OVERVIEW AS A HOME PAGE =======================

/* Quote of the day. Same on every device because the index comes from the date, not from random().

/* Your map, drawn as it grew. Weekly buckets of everything that has a timestamp, cumulative, so
   the line only ever climbs — the point is "look how much you know now", not a stock chart. */
function mapGrowth(o,weeks){
  weeks=weeks||10;
  const stamps=[];
  (o.people||[]).forEach(p=>{ if(p.at) stamps.push(p.at); });
  ["projects","problems","systems","processes","decisions","questions","departments","teams","orgs","infos","bites","captures"]
    .forEach(k=>{ (W()[k]||[]).forEach(r=>{ if(r&&r.opId===o.id&&r.at) stamps.push(r.at); }); });
  const now=new Date(); now.setHours(23,59,59,999);
  const end=now.getTime(), WK=7*86400000;

    const cut=end-i*WK;

  }
  const before=stamps.filter(t=>t<=end-weeks*WK).length;
  const total=stamps.length;
  const added=total-(buckets.length>1?buckets[buckets.length-2].n:before);
  return {buckets, total, added, before, weeks};
}
/* Hand-rolled SVG, same as every other chart in here. preserveAspectRatio:none stretches the box
   to the card width; non-scaling-stroke keeps the line an even thickness while it does. */
function growthCard(o){
  const g=mapGrowth(o,10);
  if(g.total<3) return "";                        // a two-point line is a decoration, not information
  const W_=300,H=88,pad=4;
  const max=Math.max(1,g.buckets[g.buckets.length-1].n);
  const x=i=>pad+(W_-pad*2)*(g.buckets.length<2?1:i/(g.buckets.length-1));
  const y=n=>H-pad-(H-pad*2)*(n/max);
  const pts=g.buckets.map((b,i)=>[x(i),y(b.n)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L${x(g.buckets.length-1).toFixed(1)} ${H-pad} L${x(0).toFixed(1)} ${H-pad} Z`;
  const last=pts[pts.length-1];
  const c=workCounts(o);
  const legend=[[c.people,"people"],[c.notes,"notes"],[c.projects,"projects"],[c.systems,"systems"],
    [W().links.filter(l=>l&&l.opId===o.id&&l.rel!=="MENTIONS").length,"connections"]]
    .filter(p=>p[0]).map(p=>`<span><b>${p[0]}</b> ${esc(p[1])}</span>`).join("");
  return `<div class="ai-box wov-grow">
    <div class="wov-gtop">
      <div class="wov-gn">${g.total}</div>
      <div class="wov-gl">things you know<br>about this place</div>
      ${g.added?`<div class="wov-gd" style="color:var(--good)">+${g.added} this week</div>`:`<div class="wov-gd" style="color:var(--faint)">steady this week</div>`}
    </div>
    <svg class="wov-spark" viewBox="0 0 ${W_} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="wovGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" style="stop-color:var(--accent);stop-opacity:.45"/>
        <stop offset="100%" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
      <path d="${area}" style="fill:url(#wovGrad)"/>
      <path d="${line}" style="fill:none;stroke:var(--accent2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke"/>
      <line x1="${last[0].toFixed(1)}" y1="${last[1].toFixed(1)}" x2="${last[0].toFixed(1)}" y2="${H-pad}" style="stroke:var(--accent3);stroke-width:1.5;stroke-dasharray:3 3;vector-effect:non-scaling-stroke"/>
    </svg>
    <div class="wov-gaxis"><span>${esc(fmtDate(ymdOf(g.buckets[0].cut)))}</span><span>today</span></div>
    ${legend?`<div class="wov-glegend">${legend}</div>`:""}
  </div>`;
}

/* People you're drifting from. Ranked, not just sorted by date: someone you've spoken to five
   times and haven't in a month matters more than a name that came up once. */
function reconnectPeople(o,limit){
  const now=Date.now(), MIN=14*86400000;
  return (o.people||[]).filter(p=>personHere(p)&&!isMe(o,p)).map(p=>{
    const i=personInteractions(p).filter(x=>x.at);
    const last=i.length?i[0].at:(p.at||0);
    return {p, last, n:i.length, gap:now-last};
  }).filter(x=>x.last&&x.gap>=MIN&&x.n)
    .map(x=>Object.assign(x,{score:(x.gap/86400000)*Math.log(1+x.n)}))
    .sort((a,b)=>b.score-a.score).slice(0,limit||8);
}
function reconnectCard(o){
  const list=reconnectPeople(o,8);
  if(list.length<2) return "";
  return `<div class="section-head"><h3>Worth a catch-up</h3><div class="line"></div><span class="tag">${list.length}</span></div>
    <div class="card panel">
      <div class="sect-note" style="margin:0 2px 11px">People who helped you early on and haven't come up in your notes lately.</div>
      <div class="wov-faces">${list.map(x=>`<div class="wov-face" data-ent="person|${esc(x.p.id)}">
        ${entIcoHTML("person",x.p)}
        <div class="fn">${esc((x.p.name||"?").split(/\s+/)[0])}</div>
        <div class="fd">${Math.round(x.gap/86400000)}d ago</div></div>`).join("")}</div>
    </div>`;
}

/* Where your knowledge actually is. A department you've written nothing about is not a department
   you understand, and that is the useful thing this can tell you that a count can't. */
function deptCoverage(o){
  const depts=wOf("departments",o.id);
  if(!depts.length) return [];
  const ppl=(o.people||[]).filter(personHere);
  return depts.map(d=>{
    const members=ppl.filter(p=>p.deptId===d.id);
    const ids=new Set(members.map(p=>p.id));
    const notes=wOf("captures",o.id).filter(c=>(c.entities||[]).some(e=>(e.t==="department"&&e.id===d.id)||(e.t==="person"&&ids.has(e.id)))).length;
    const work=["project","problem","system","process"].reduce((n,t)=>n+entAll(t,o.id).filter(r=>r.deptId===d.id).length,0);
    return {d, people:members.length, notes, work, score:members.length*2+notes+work};
  }).sort((a,b)=>b.score-a.score);
}
function coverageCard(o){
  const rows=deptCoverage(o);
  if(rows.length<2) return "";
  const max=Math.max(1,rows[0].score);
  const noDept=(o.people||[]).filter(p=>personHere(p)&&!p.deptId).length;
  const thin=rows.filter(r=>r.score<=Math.max(1,max*0.2)).length;
  return `<div class="section-head"><h3>What you know, by department</h3><div class="line"></div></div>
    <div class="card panel">
      <div class="wov-cov">${rows.slice(0,8).map(r=>{
        const col=deptColor(r.d.id), pct=Math.max(4,Math.round(r.score/max*100));
        const bits=[r.people?`${r.people} ${r.people===1?"person":"people"}`:"nobody yet", r.notes?`${r.notes} ${r.notes===1?"note":"notes"}`:""].filter(Boolean).join(" · ");
        return `<div class="wov-crow" data-ent="department|${esc(r.d.id)}">
          <div class="wov-cname" style="color:${cssCol(col)}">${esc(r.d.name||"Department")}</div>
          <div class="wov-cbar"><div class="wov-cfill" style="width:${pct}%;background:${cssCol(col)}"></div></div>
          <div class="wov-cn${r.score<=Math.max(1,max*0.2)?" wov-thin":""}">${esc(bits)}</div>
        </div>`;
      }).join("")}</div>
      ${(thin||noDept)?`<div class="sect-note" style="margin:12px 2px 0">${
        [thin?`${thin} ${thin===1?"department is":"departments are"} nearly blank in your notes`:"",
         noDept?`${noDept} ${noDept===1?"person isn't":"people aren't"} in a department yet`:""].filter(Boolean).join(" · ")
      }</div>`:""}
    </div>`;
}

/* One true thing, pulled back up. Everything you write down sinks; this rotates one small fact a
   day back to the surface, which is the only way a knowledge pile ever pays you back. */
function worthKnowing(o){
  const pool=[];
  entAll("bite",o.id).forEach(b=>{ if(b.fact) pool.push({t:"bite",r:b,text:b.fact,meta:[b.kind,b.source?"via "+b.source:"",(b.tags||[]).map(x=>"#"+x).join(" ")].filter(Boolean).join(" · ")}); });
  entAll("decision",o.id).forEach(d=>{ if(d.title) pool.push({t:"decision",r:d,text:d.title,meta:[d.madeBy?"decided by "+d.madeBy:"",d.date?fmtDate(d.date):"",d.reason?String(d.reason).slice(0,120):""].filter(Boolean).join(" · ")}); });
  entAll("info",o.id).forEach(x=>{ if(x.title&&x.summary) pool.push({t:"info",r:x,text:x.summary,meta:[x.title,x.kind].filter(Boolean).join(" · ")}); });
  if(!pool.length) return null;
  const d=new Date(), day=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);
  return pool[((day%pool.length)+pool.length)%pool.length];
}
function worthKnowingCard(o){
  const w=worthKnowing(o);
  if(!w) return "";
  return `<div class="wov-know" data-ent="${esc(w.t)}|${esc(w.r.id)}">
    <div class="kh">${I.spark} Worth remembering</div>
    <div class="kf">${esc(String(w.text).slice(0,280))}</div>
    ${w.meta?`<div class="km">${esc(w.meta)}</div>`:""}
  </div>`;
}

/* ======================= DIGGING IN =======================
   Every number on this page is the size of a list, and the list is the useful part. A count you
   cannot open is trivia. `digSpec` turns any tile, gauge or stat into the actual records behind
   it — searchable, sortable, and each row opens the thing itself. */
function lastTouched(type,rec){
  const ev=evidenceFor(type,rec.id)[0];
  return Math.max(+rec.at||0, +rec.statusAt||0, +rec.answeredAt||0, ev?+ev.at||0:0);
}
function digSpec(o,key,arg){
  const ppl=(o.people||[]).filter(personHere).filter(p=>!isMe(o,p));
  const known=p=>personInteractions(p).length>0;
  const R=(type,list)=>list.map(rec=>({type,rec}));
  const D={
    "people-known":  ()=>({title:"People you've actually talked to", note:"They appear in at least one of your notes.", rows:R("person",ppl.filter(known))}),
    "people-cold":   ()=>({title:"Recorded, but you've never written about them", note:"A name in the map with no note behind it — the quickest wins are usually here.", rows:R("person",ppl.filter(p=>!known(p)))}),
    "org-placed":    ()=>({title:"People whose reporting line you know", rows:R("person",ppl.filter(p=>personManager(p)))}),
    "org-unplaced":  ()=>({title:"People you haven't placed on the chart", note:"Open anyone and set their manager — they'll stack up under them on the org map.", rows:R("person",ppl.filter(p=>!personManager(p)))}),
    "depts-blank":   ()=>({title:"Departments you know nothing about", note:"Nobody recorded, nothing written down.", rows:R("department",deptCoverage(o).filter(r=>r.score===0).map(r=>r.d))}),
    "depts-inside":  ()=>({title:"Departments you've been inside", rows:R("department",deptCoverage(o).filter(r=>r.score>0).map(r=>r.d))}),
    "owners-unowned":()=>({title:"Nobody owns these", note:"You depend on them and haven't recorded who runs them.",
                            rows:R("system",wOf("systems",o.id).filter(x=>!x.ownerId)).concat(R("project",wOf("projects",o.id).filter(x=>!x.ownerId&&!/complete|cancelled/i.test(x.status||""))))}),
    "owners-known":  ()=>({title:"Things with a known owner",
                            rows:R("system",wOf("systems",o.id).filter(x=>x.ownerId)).concat(R("project",wOf("projects",o.id).filter(x=>x.ownerId)))}),
    "q-open":        ()=>({title:"Questions you haven't answered", rows:R("question",wOf("questions",o.id).filter(q=>q.status==="Open").sort((a,b)=>a.at-b.at))}),
    "q-closed":      ()=>({title:"Questions you've closed", rows:R("question",wOf("questions",o.id).filter(q=>q.status&&q.status!=="Open"))}),
    "problems-open": ()=>({title:"Problems still live", rows:R("problem",wOf("problems",o.id).filter(p=>!/solved|accepted/i.test(p.status||"")).sort((a,b)=>a.at-b.at))}),
    "stale-people":  ()=>({title:"People you're drifting from", note:"Ranked by how long it's been against how much you used to talk.", rows:R("person",reconnectPeople(o,50).map(x=>x.p))}),
    "week-added":    ()=>({title:"Added in the last 7 days", note:"Everything that went into the map this week.", rows:sinceRows(o,Date.now()-7*86400000)}),
    "all-known":     ()=>({title:"Everything you know about this place", rows:sinceRows(o,0)}),
    "quiet":         ()=>({title:"Threads you haven't touched lately", note:"Open work with no note against it recently.", rows:quietThreads(o,50).map(x=>({type:x.type,rec:x.rec}))}),
    "recap":         ()=>({title:"What you added "+(arg==="y"?"yesterday":"since you were last here"), rows:sinceRows(o,+arg||0,arg==="y")})
  };
  const f=D[key]; return f?f():null;
}
// every timestamped record in one list, newest first — the backbone of the recap and the totals
function sinceRows(o,since,onlyYesterday){
  const out=[];
  const add=(type,list)=>(list||[]).forEach(r=>{ if(r&&r.at&&r.at>=since) out.push({type,rec:r}); });
  add("person",(o.people||[]));
  [["projects","project"],["problems","problem"],["systems","system"],["processes","process"],
   ["decisions","decision"],["questions","question"],["departments","department"],["teams","team"],
   ["orgs","org"],["infos","info"],["bites","bite"],["captures","capture"]]
    .forEach(([k,type])=>add(type,(W()[k]||[]).filter(r=>r&&r.opId===o.id)));
  let rows=out;
  if(onlyYesterday){
    const d=new Date(); d.setHours(0,0,0,0);
    const start=d.getTime()-86400000;
    rows=out.filter(x=>x.rec.at>=start&&x.rec.at<d.getTime());
  }
  return rows.sort((a,b)=>b.rec.at-a.rec.at);
}
/* The four week tiles open REPORTS, not lists: each row carries the evidence that put it there,
   because a name with no reason next to it is exactly the ambiguity these were meant to remove. */
function reportSpec(o,key){
  const row=(icoType,rec,title,meta,tail)=>`<div class="rep-row" ${rec?`data-ent="${esc(icoType)}|${esc(rec.id)}"`:""}>
      ${rec?entIcoHTML(icoType,rec):""}
      <div class="rep-b"><div class="rep-t">${esc(title)}</div>${meta?`<div class="rep-m">${meta}</div>`:""}</div>
      ${tail||""}</div>`;
  if(key==="met-week"){
    const list=engagedThisWeek(o);
    return {title:"People you met with this week", n:list.length,
      note:"Only notes that describe an actual conversation — not people a note merely talks about.",
      empty:"No note this week describes a conversation with anyone. Capture one after your next call and this fills itself.",
      html:list.map(x=>row("person",x.p,x.p.name,
        `<span class="rep-q">${esc(x.why)}</span><span class="rep-w">${esc(relDays(daysUntil(ymdOf(x.cap.at))))}${x.sure?" · recorded as a conversation":""}</span>`,
        `<button class="btn ghost sm" data-mpprep="${esc(x.p.id)}">Prep</button>`)).join("")};
  }
  if(key==="bites-week"){
    const list=bitesThisWeek(o);
    return {title:"Knowledge bites filed this week", n:list.length,
      note:"The small true things — a term, an unwritten rule, a number. Captures now extract these automatically.",
      empty:"None this week. Every note you capture from here will offer any it finds.",
      html:list.map(b=>row("bite",b,b.fact,
        `<span class="rep-w">${esc([b.kind,b.source?"via "+b.source:"",fmtDate(ymdOf(b.at))].filter(Boolean).join(" · "))}</span>`)).join("")};
  }
  if(key==="jd-gaps"){
    const g=jdGaps(o), all=jdCommitments(o);
    const covered=all.filter(x=>x.covered);
    return {title:"Open against the job", n:g.jd.length+g.openObj.length,
      note:jdText(o)?"Each line of your job description, checked against everything in your map."
                    :"No job description on file — add it in the role's Overview and this gets a lot sharper.",
      empty:"Nothing outstanding: every line of the JD has something behind it and your objectives are ticked.",
      html:
        (g.openObj.length?`<div class="rep-sec">Objectives you haven't ticked off</div>`+
          g.openObj.map(it=>row("question",null,it.do,`<span class="rep-q">${esc(it.why||"")}</span>`,
            `<span class="rep-w">${esc((OBJ_WHEN[it.when]||OBJ_WHEN.today).label)}</span>`)).join(""):"")+
        (g.jd.length?`<div class="rep-sec">Job description lines with nothing behind them</div>`+
          g.jd.map(x=>row("problem",null,x.line,`<span class="rep-q">Nothing in your map mentions ${esc(x.terms.slice(0,4).join(", "))}</span>`)).join(""):"")+
        (covered.length?`<div class="rep-sec">Covered — what your map has against each line</div>`+
          covered.map(x=>row("info",null,x.line,
            `<span class="rep-q">${x.hits.slice(0,4).map(h=>`<span class="cite" data-ent="${esc(h.type)}|${esc(h.rec.id)}">${esc(entName(h.type,h.rec)).slice(0,40)}</span>`).join(" ")}</span>`)).join(""):"")};
  }
  if(key==="connect"){
    const list=connectToday(o);
    return {title:"People to connect with today", n:list.length,
      note:"Every one of these comes from something you already wrote down. The reason is shown.",
      empty:"Nothing outstanding with anyone — nothing in your notes says you owe someone a reply.",
      html:list.map(x=>row("person",x.p,x.p.name,
        x.reasons.slice(0,3).map(r=>`<span class="rep-q"><b>${esc(r.kind)}:</b> ${esc(r.why)}</span>`).join(""),
        `<button class="btn ghost sm" data-mpprep="${esc(x.p.id)}">Prep</button>`)).join("")};
  }
  return null;
}
/* NOT `openReport` — that name already belongs to the 30/60/90 review further down, and a second

function openWeekReport(key){

    <button class="x-btn" data-act="cancel-editor" style="margin-left:auto">${I.x}</button></div>
  ${r.note?`<div class="sect-note">${esc(r.note)}</div>`:""}

}
let digKey="";
function openDig(key,arg){

    <button class="x-btn" data-act="cancel-editor" style="margin-left:auto">${I.x}</button></div>
  ${spec.note?`<div class="sect-note">${esc(spec.note)}</div>`:""}
  ${listFilter("dig",{count:rows.length,noun:"records",sorts:[{key:"recent",label:"Newest"},{key:"az",label:"A–Z"},{key:"oldest",label:"Oldest"}]})}

          tail:`<span style="font-size:10.5px;color:var(--faint);white-space:nowrap">${esc(relDays(daysUntil(ymdOf(x.rec.at))))}</span>`})).join("")}</div>`
    : `<div class="card panel"><div class="ent-empty">Nothing here — which is the good outcome for this one.</div></div>`}`);
}

/* ======================= THE FOUR NUMBERS THAT MATTER THIS WEEK =======================
   Not counts of what is in the map — four questions with a right answer, each opening a report
   you can act on rather than a list you have to interpret. */
const WEEK=7*86400000;

/* 1. WHO I ACTUALLY MET. A note that says "Andrew flagged the data issue" is about Andrew; a note
   that says "call with Andrew" is a conversation WITH him. Only the second one counts. The precise
   source is `capture.met`, which the capture agent now fills in; for notes taken before that (and
   for notes typed with no AI) a conservative phrase test stands in — and the report shows the
   sentence that earned each person their place, so the judgement is auditable rather than magic. */
const MET_RX=/\b(met|meeting|meet|call|called|spoke|speak|talked|talk|1:1|1-1|one[- ]on[- ]one|sync|synced|standup|stand-up|caught up|catch up|chatted|chat|interview|coffee|lunch|walked through|debrief|reviewed with|sat down)\b/i;
function metEvidence(cap,personId){
  const txt=String(cap.text||"");
  const parts=txt.split(/(?<=[.!?\n])\s+/);
  // even when the agent told us outright, show the note's own words — "recorded as a conversation"
  // explains how we know, but it is the sentence you wrote that lets you disagree with it
  if(Array.isArray(cap.met)&&cap.met.includes(personId))
    return {sure:true,why:(parts[0]||txt).trim().slice(0,160)||"this note records a conversation"};
  if(!(cap.entities||[]).some(e=>e.t==="person"&&e.id===personId)) return null;
  if(!MET_RX.test(txt)) return null;
  // the sentence the verb sits in, so you can see exactly why it counted
  const sent=parts.find(x=>MET_RX.test(x))||txt;
  return {sure:false,why:sent.trim().slice(0,160)};
}
function engagedThisWeek(o){
  const since=Date.now()-WEEK, out=[];
  const caps=wOf("captures",o.id).filter(c=>(c.at||0)>=since).sort((a,b)=>b.at-a.at);
  (o.people||[]).filter(p=>personHere(p)&&!isMe(o,p)).forEach(p=>{
    for(const c of caps){ const ev=metEvidence(c,p.id); if(ev){ out.push({p,cap:c,why:ev.why,sure:ev.sure}); return; } }
  });
  return out.sort((a,b)=>b.cap.at-a.cap.at);
}

/* 2. NEW KNOWLEDGE BITES. The atomic layer — one small true thing. These were never extracted from
   captures at all until now, which is why the count sat at zero however much you wrote. */
function bitesThisWeek(o){
  const since=Date.now()-WEEK;
  return entAll("bite",o.id).filter(b=>(b.at||0)>=since).sort((a,b)=>b.at-a.at);
}

/* 3. WHAT YOU WERE HIRED TO DO, AGAINST WHAT YOU'VE ACTUALLY TOUCHED. The job description is the
   only written statement of the job; each of its responsibilities is checked against the map by
   its own words. A responsibility with nothing behind it is a real gap, and the report shows what
   it matched on so you can disagree with it. */
const JD_STOP=new Set("the a an and or of to for with in on at by as is are be will you your our their this that from into across including etc via using ensure own lead drive manage support help work team teams role responsibilities responsibility".split(" "));
function jdTerms(line){
  return [...new Set(norm(line).split(" ").filter(w=>w.length>3&&!JD_STOP.has(w)))];
}
function jdCommitments(o){
  const jd=jdText(o);
  if(!jd) return [];
  const lines=jd.split(/\n+|(?<=[.;])\s+/).map(x=>x.replace(/^[\s•\-*–—\d.)]+/,"").trim())
    .filter(x=>x.length>=22&&/[a-z]/i.test(x)).slice(0,14);
  // everything in the map, as one searchable haystack per record
  const hay=[];
  ["projects","problems","systems","processes","decisions","questions","infos","bites","captures"]
    .forEach(k=>(W()[k]||[]).filter(r=>r&&r.opId===o.id).forEach(r=>{
      const type={projects:"project",problems:"problem",systems:"system",processes:"process",
        decisions:"decision",questions:"question",infos:"info",bites:"bite",captures:"capture"}[k];
      hay.push({type,rec:r,text:norm([entName(type,r),r.description,r.note,r.summary,r.reason,r.text,r.fact].filter(Boolean).join(" "))});
    }));
  return lines.map(line=>{
    const terms=jdTerms(line);
    if(!terms.length) return {line,terms,hits:[],covered:true};   // nothing to match on — don't cry gap
    const hits=hay.filter(h=>terms.some(t=>h.text.includes(t)))
      .sort((a,b)=>terms.filter(t=>b.text.includes(t)).length-terms.filter(t=>a.text.includes(t)).length)
      .slice(0,6);
    return {line,terms,hits,covered:hits.length>0};
  });
}
function jdGaps(o){
  const rec=objRecord(o);
  const openObj=((rec&&rec.items)||[]).filter(x=>!x.done);
  return {jd:jdCommitments(o).filter(x=>!x.covered), openObj};
}

/* 4. WHO TO CONNECT WITH TODAY — literally, from something already written down. Never a vibe:
   every name here carries the sentence or the record that put it there. */
const OWE_RX=/\b(follow up|follow-up|circle back|get back to|come back to|owe|send (?:them|him|her)?|will ask|need to ask|check with|confirm with|loop in|chase|ping|reach out|set up (?:a )?time|schedule)\b/i;
function connectToday(o){
  const out=new Map();
  const push=(p,why,kind,rec,type)=>{
    if(!p||!personHere(p)||isMe(o,p)) return;
    if(!out.has(p.id)) out.set(p.id,{p,reasons:[]});
    out.get(p.id).reasons.push({why,kind,rec,type});
  };
  // (a) something you wrote says you owe them something
  wOf("captures",o.id).sort((a,b)=>b.at-a.at).slice(0,60).forEach(c=>{
    const txt=String(c.text||""); if(!OWE_RX.test(txt)) return;
    const parts=txt.split(/(?<=[.!?\n])\s+/);
    (c.entities||[]).filter(e=>e.t==="person").forEach(e=>{
      const p=entGet("person",e.id); if(!p) return;
      const first=norm((p.name||"").split(/\s+/)[0]);
      const sent=parts.find(x=>OWE_RX.test(x)&&(first?norm(x).includes(first):true));
      if(sent) push(p,sent.trim().slice(0,150),"You said you'd follow up",c,"capture");
    });
  });
  // (b) an open question the graph says they're the one to answer
  wOf("questions",o.id).filter(q=>q.status==="Open").forEach(q=>{
    relatedOfType("question",q.id,"person").forEach(r=>{
      const p=entGet("person",r.id); if(p) push(p,q.q,"Open question for them",q,"question");
    });
  });
  // (c) your manager or a direct report with something open and a real silence
  const m=myPlace(o);
  if(m){ [m.mgr].concat(m.reports).filter(Boolean).forEach(p=>{
    const open=circleOpen(o,p);
    const last=(personInteractions(p)[0]||{}).at;
    const gap=last?ageDays(last):null;
    if(open.length&&(gap==null||gap>=7))
      push(p,`${open.length} open ${open.length===1?"item":"items"} and ${gap==null?"no note yet":gap+" days since you spoke"}`,
        p===m.mgr?"Your manager":"Reports to you",open[0].rec,open[0].type);
  }); }
  return [...out.values()].sort((a,b)=>b.reasons.length-a.reasons.length);
}
function weekTiles(o){
  const met=engagedThisWeek(o), bites=bitesThisWeek(o), gaps=jdGaps(o), conn=connectToday(o);
  const nGaps=gaps.jd.length+gaps.openObj.length;
  const T=[
    {n:met.length,   label:"People you met with", sub:"in the last 7 days", key:"met-week",  col:"#6d8bc4"},
    {n:bites.length, label:"New knowledge bites", sub:"filed this week",    key:"bites-week",col:"#5b9c97"},
    {n:nGaps,        label:"Open against the job", sub:jdText(o)?"from your JD and objectives":"add your JD to sharpen this", key:"jd-gaps", col:"#c6a45c", hot:nGaps>0},
    {n:conn.length,  label:"Connect with today",  sub:"you said you would", key:"connect",   col:"#cf7273", hot:conn.length>0}
  ];
  return `<div class="wk-grid">${T.map(x=>`
    <button class="wk${x.hot&&x.n?" hot":""}" data-dig="${esc(x.key)}">
      <span class="wk-n" style="color:${cssCol(x.col)}">${x.n}</span>
      <span class="wk-l">${esc(x.label)}</span>
      <span class="wk-s">${esc(x.sub)}</span>
    </button>`).join("")}</div>`;
}

/* ======================= WHAT A NEW STARTER ACTUALLY OPENS THIS FOR =======================
   Three questions, every morning, in this order: where did I leave off, what is outstanding with
   the people I answer to, and what have I quietly dropped. All three are computed. */
/* Read ONCE at boot. render() stamps devPrefs.lastSeen as you sit on the page, so reading it live
   would collapse the window to zero and the recap would always say "yesterday". */
const lastSeenAtBoot = +devPrefs.lastSeen||0;
function recapWindow(){
  const seen=lastSeenAtBoot, now=Date.now();
  // more than six hours away and there is a "since you were last here" worth showing; otherwise
  // the interesting window is yesterday, because you have already seen today
  if(seen && now-seen>6*3600000) return {since:seen, label:"since you were last here", arg:String(seen)};
  const d=new Date(); d.setHours(0,0,0,0);
  return {since:d.getTime()-86400000, until:d.getTime(), label:"yesterday", arg:"y"};
}
function recapCard(o){
  const w=recapWindow();
  const rows=w.arg==="y" ? sinceRows(o,0,true) : sinceRows(o,w.since);
  if(!rows.length) return "";
  const by=t=>rows.filter(x=>x.type===t);
  const notes=by("capture"), people=by("person");
  const other=rows.filter(x=>x.type!=="capture"&&x.type!=="person");
  const bits=[];
  if(notes.length) bits.push(`<b>${notes.length}</b> ${notes.length===1?"note":"notes"}`);
  if(people.length) bits.push(`<b>${people.length}</b> new ${people.length===1?"person":"people"}`);
  if(other.length) bits.push(`<b>${other.length}</b> other ${other.length===1?"record":"records"}`);
  return `<div class="recap">
    <div class="rc-head">${I.clock} Where you left off — ${esc(w.label)}
      <button class="rc-all" data-dig="recap|${esc(w.arg)}">See all ${rows.length} →</button></div>
    <div class="rc-line">${bits.join(" · ")}</div>
    ${notes.length?`<div class="rc-notes">${notes.slice(0,3).map(x=>`
      <button class="rc-note" data-ent="capture|${esc(x.rec.id)}">
        <span class="rn-t">${esc(capTitle(x.rec)).slice(0,90)}</span>
        <span class="rn-m">${esc((x.rec.entities||[]).map(e=>entLabel(e.t,e.id)).filter(Boolean).slice(0,4).join(" · "))||esc(fmtDate(ymdOf(x.rec.at)))}</span>
      </button>`).join("")}</div>`:""}
    ${people.length?`<div class="rc-people">${people.slice(0,6).map(x=>`
      <span class="rc-p" data-ent="person|${esc(x.rec.id)}">${entIcoHTML("person",x.rec)}${esc((x.rec.name||"?").split(/\s+/)[0])}</span>`).join("")}</div>`:""}
  </div>`;
}
/* The people you answer to and the people who answer to you. Anything open that touches them is
   the thing most likely to matter today, and the thing most likely to be quietly rotting. */
function circleOpen(o,person){
  const open=[];
  const touches=(type,rec)=>relatedTo(type,rec.id,true).some(r=>r.type==="person"&&r.id===person.id)
    || rec.ownerId===person.id
    || evidenceFor(type,rec.id).some(c=>(c.entities||[]).some(e=>e.t==="person"&&e.id===person.id));
  wOf("problems",o.id).filter(p=>!/solved|accepted/i.test(p.status||"")).forEach(p=>{ if(touches("problem",p)) open.push({type:"problem",rec:p}); });
  wOf("questions",o.id).filter(q=>q.status==="Open").forEach(q=>{ if(touches("question",q)) open.push({type:"question",rec:q}); });
  wOf("projects",o.id).filter(p=>/blocked/i.test(p.status||"")).forEach(p=>{ if(touches("project",p)) open.push({type:"project",rec:p}); });
  return open.sort((a,b)=>(a.rec.at||0)-(b.rec.at||0)).slice(0,4);
}
function circleCard(o){
  const m=myPlace(o); if(!m) return "";
  let list=[];
  if(m.mgr) list.push({p:m.mgr,rel:"your manager",boss:true});
  m.reports.forEach(p=>list.push({p,rel:"reports to you"}));
  if(!list.length) return "";
  // work out what's open BEFORE choosing who to show: the people with something outstanding are
  // the point of this card, and four cards of "nothing on record" is just furniture
  list=list.map(x=>{
    const open=circleOpen(o,x.p);
    const last=(personInteractions(x.p)[0]||{}).at;
    return Object.assign({},x,{open,gap:last?ageDays(last):null});
  }).sort((a,b)=>
      (b.boss?1:0)-(a.boss?1:0) ||                         // your manager always leads
      b.open.length-a.open.length ||                       // then whoever has the most outstanding
      (b.gap==null?9999:b.gap)-(a.gap==null?9999:a.gap)    // then whoever you've left longest
    ).slice(0,4);
  const cards=list.map(x=>{
    const open=x.open, gap=x.gap;
    return `<div class="circ">
      <button class="circ-h" data-ent="person|${esc(x.p.id)}">
        ${entIcoHTML("person",x.p)}
        <span class="ci-b"><span class="ci-n">${esc(x.p.name)}</span>
          <span class="ci-r">${esc(x.rel)}${gap!=null?` · last spoke ${gap===0?"today":gap+"d ago"}`:" · never in a note"}</span></span>
      </button>
      ${open.length
        ? `<div class="circ-list">${open.map(y=>`<button class="circ-i" data-ent="${esc(y.type)}|${esc(y.rec.id)}">
            <span class="ci-d" style="background:${cssCol((ENT[y.type]||{}).col)}"></span>
            <span class="ci-t">${esc(entName(y.type,y.rec))}</span>
            <span class="ci-a">${ageDays(y.rec.at)}d</span></button>`).join("")}</div>`
        : `<div class="circ-none">${gap==null
              ? "You've never written a note about them — start there."
              : gap>10 ? `Nothing open on record, but you haven't spoken in ${gap} days.`
              : "Nothing open on record."}</div>`}
    </div>`;
  }).join("");
  return `<div class="section-head"><h3>Your manager and your reports</h3><div class="line"></div>
      <span class="tag">unresolved</span></div>
    <div class="circ-grid">${cards}</div>`;
}
/* What you started and stopped. Ranked by how long it has been silent against how much you had
   already put into it, so a thread you worked for a week and dropped beats a one-line note. */
function quietThreads(o,limit){
  const now=Date.now(), out=[];
  const consider=(type,list)=>list.forEach(rec=>{
    const touched=lastTouched(type,rec);
    if(!touched) return;
    const days=Math.floor((now-touched)/86400000);
    if(days<6) return;                                  // "a week or so" — not yet quiet
    const invested=evidenceFor(type,rec.id).length+1;
    out.push({type,rec,days,invested,score:days*Math.log(1+invested)});
  });
  consider("problem",wOf("problems",o.id).filter(p=>!/solved|accepted/i.test(p.status||"")));
  consider("project",wOf("projects",o.id).filter(p=>!/complete|cancelled/i.test(p.status||"")));
  consider("question",wOf("questions",o.id).filter(q=>q.status==="Open"));
  return out.sort((a,b)=>b.score-a.score).slice(0,limit||3);
}
function quietCard(o){
  const list=quietThreads(o,3);
  if(!list.length) return "";
  return `<div class="section-head"><h3>Gone quiet</h3><div class="line"></div>
      <button class="btn ghost sm" data-dig="quiet">See all</button></div>
    <div class="quiet-list">${list.map(x=>`
      <div class="qt">
        <button class="qt-b" data-ent="${esc(x.type)}|${esc(x.rec.id)}">
          <span class="qt-days">${x.days}<i>d</i></span>
          <span class="qt-t"><span class="qt-n">${esc(entName(x.type,x.rec))}</span>
            <span class="qt-m">${esc((ENT[x.type]||{}).label||x.type)} · nothing written since ${esc(fmtDate(ymdOf(lastTouched(x.type,x.rec))))}${x.invested>1?` · ${x.invested} notes before that`:""}</span></span>
        </button>
        <button class="btn ghost sm" data-qtcap="${esc(x.type)}|${esc(x.rec.id)}">${I.note} Update</button>
      </div>`).join("")}</div>`;
}

/* ======================= THE DASHBOARD =======================
   Counts told you how much you had written down. They never told you how much of it you actually
   UNDERSTAND, which is the only question this half of the app exists to answer. Each gauge below
   is a real ratio with a real denominator taken from your own records — nothing here is measured
   against an invented industry benchmark, because there isn't one and pretending otherwise would
   be the same lie the post-hire prompts are built to avoid. The denominator is always "the org you
   have actually found so far", so the gauges get harder as you discover the place is bigger. */
function readiness(o){
  const ppl=(o.people||[]).filter(personHere).filter(p=>!isMe(o,p));
  const depts=wOf("departments",o.id);
  const sys=wOf("systems",o.id), proj=wOf("projects",o.id).filter(p=>!/complete|cancelled/i.test(p.status||""));
  const qs=wOf("questions",o.id);
  const caps=wOf("captures",o.id);
  const known=p=>personInteractions(p).length>0;
  const placed=p=>!!personManager(p);
  const deptCovered=d=>{
    const mem=ppl.filter(p=>p.deptId===d.id);
    if(!mem.length) return false;
    const ids=new Set(mem.map(p=>p.id));
    return mem.some(known) || caps.some(c=>(c.entities||[]).some(e=>(e.t==="department"&&e.id===d.id)||(e.t==="person"&&ids.has(e.id))));
  };
  const owned=r=>!!r.ownerId;
  const answered=qs.filter(q=>q.status&&q.status!=="Open");
  // `dig` is where the MISSING ones live — the point of a gauge is the gap, so that is what a tap
  // opens, and `digHave` is the other half for when you want to see what you have got
  const g=(id,label,have,total,hint,dig,digHave,col)=>({id,label,have,total,
    pct: total? Math.round(have/total*100) : 0, hint, dig, digHave, col, na: !total});
  return [
    g("people","People you actually know",ppl.filter(known).length,ppl.length,
      "never in a note",   "people-cold",   "people-known",   "#6d8bc4"),
    g("org","Reporting lines mapped",ppl.filter(placed).length,ppl.length,
      "unplaced",          "org-unplaced",  "org-placed",     "#8a72bd"),
    g("depts","Departments you've been inside",depts.filter(deptCovered).length,depts.length,
      "still blank",       "depts-blank",   "depts-inside",   "#bf8a4f"),
    g("owners","Who owns what",sys.concat(proj).filter(owned).length,sys.concat(proj).length,
      "unowned",           "owners-unowned","owners-known",   "#5b9c97"),
    g("answers","Questions you've closed",answered.length,qs.length,
      "still open",        "q-open",        "q-closed",       "#c6a45c")
  ];
}
/* A speedometer, hand-drawn like everything else here. A 240° arc so it reads as a dial rather
   than a progress bar, with the track and the fill on the same path so they cannot drift. */
function gaugeSVG(pct,col){
  const R=46, CX=56, CY=54, START=150, SWEEP=240;
  const pt=deg=>[CX+R*Math.cos(deg*Math.PI/180), CY+R*Math.sin(deg*Math.PI/180)];
  const arc=(from,to)=>{ const a=pt(from), b=pt(to);
    return `M${a[0].toFixed(1)} ${a[1].toFixed(1)} A${R} ${R} 0 ${Math.abs(to-from)>180?1:0} 1 ${b[0].toFixed(1)} ${b[1].toFixed(1)}`; };
  const p=Math.max(0,Math.min(100,Math.round(pct)));
  const end=START+SWEEP*p/100;
  // the number lives INSIDE the svg rather than being pulled over it with a negative margin: it
  // scales with the dial, it can't drift as the font changes, and it isn't two boxes overlapping
  return `<svg class="gg-dial" viewBox="0 0 112 86" role="img" aria-label="${p} percent">
    <path d="${arc(START,START+SWEEP)}" style="fill:none;stroke:var(--line);stroke-width:9;stroke-linecap:round"/>
    ${p>0?`<path d="${arc(START,end)}" style="fill:none;stroke:${cssCol(col)};stroke-width:9;stroke-linecap:round"/>`:""}
    <text x="56" y="62" text-anchor="middle" class="gg-num" style="fill:${cssCol(col)}">${p}<tspan class="gg-pc">%</tspan></text>
  </svg>`;
}
function gaugesCard(o){
  const gs=readiness(o).filter(x=>!x.na);
  if(gs.length<2) return "";
  return `<div class="section-head"><h3>How well you know this place</h3><div class="line"></div>
      <span class="tag" title="Measured against what you've found so far, not an outside benchmark">your own records</span></div>
    <div class="gg-grid">${gs.map(x=>`
      <button class="gg" data-dig="${esc(x.total-x.have?x.dig:x.digHave)}" title="Open the ${x.total-x.have?(x.total-x.have)+" "+x.hint:x.have+" you have"}">
        ${gaugeSVG(x.pct,x.col)}
        <span class="gg-lab">${esc(x.label)}</span>
        <span class="gg-sub">${x.have} of ${x.total}${x.total-x.have?` · <b>${x.total-x.have} ${esc(x.hint)} →</b>`:" · all of them"}</span>
      </button>`).join("")}</div>`;
}
/* Where you are against where this is going. Deliberately a projection of YOUR pace rather than a
   target somebody made up: the only honest "expected" here is the line you are already on. */
function pace(o){
  const day=hireDay(o)||0;
  const stamps=[];
  (o.people||[]).forEach(p=>{ if(p.at) stamps.push(p.at); });
  ["projects","problems","systems","processes","decisions","questions","departments","teams","orgs","infos","bites","captures"]
    .forEach(k=>{ (W()[k]||[]).forEach(r=>{ if(r&&r.opId===o.id&&r.at) stamps.push(r.at); }); });
  const now=Date.now(), WK=7*86400000;
  const total=stamps.length;
  const week=stamps.filter(t=>t>now-WK).length;
  const prev=stamps.filter(t=>t>now-4*WK&&t<=now-WK).length/3;   // the three weeks before this one
  const perDay = day>0 ? total/day : 0;
  return {day, total, week, avg:Math.round(prev*10)/10, perDay,
    projected: day>0 ? Math.round(perDay*90) : 0,
    trend: prev>0 ? Math.round((week-prev)/prev*100) : (week?100:0)};
}
function paceCard(o){
  const p=pace(o);
  if(p.total<6||!p.day) return "";
  const up=p.trend>=0;
  return `<div class="pace">
    <button class="pc-cell" data-dig="all-known"><div class="pc-n">${p.total}</div><div class="pc-l">things you know</div></button>
    <button class="pc-cell" data-dig="week-added"><div class="pc-n">${p.week}</div><div class="pc-l">added this week
      ${p.avg?`<span class="pc-trend ${up?"up":"down"}">${up?"▲":"▼"} ${Math.abs(p.trend)}% vs your ${p.avg}/wk</span>`:""}</div></button>
    <div class="pc-cell pc-flat"><div class="pc-n">${p.projected}</div><div class="pc-l">by day 90 at this pace</div></div>
  </div>`;
}
/* The tiles that are actually a to-do list. Post-hire the map has one real clock in it — how long
   things have been sitting — so that is what these count. A number with no age is just a count. */
function ageDays(ts){ return ts? Math.max(0,Math.floor((Date.now()-ts)/86400000)) : 0; }
function actionTiles(o){
  const qs=wOf("questions",o.id).filter(q=>q.status==="Open").sort((a,b)=>a.at-b.at);
  const probs=wOf("problems",o.id).filter(p=>!/solved|accepted/i.test(p.status||"")).sort((a,b)=>a.at-b.at);

  const projs=wOf("projects",o.id).filter(p=>!p.ownerId&&!/complete|cancelled/i.test(p.status||""));
  const stale=reconnectPeople(o,50);
  const blank=deptCoverage(o).filter(r=>r.people===0);
  const due=o.nextActionDate?daysUntil(o.nextActionDate):null;
  const T=[];
  const tile=(n,label,sub,act,col,urgent)=>{ if(!n) return; T.push({n,label,sub,act,col,urgent}); };
  if(o.nextActionLabel) tile(due==null?"·":(due<0?Math.abs(due):due===0?"Now":due), due!=null&&due<0?"Days overdue":"Your next step",
    String(o.nextActionLabel).slice(0,44), `open|${o.id}`, due!=null&&due<=0?"var(--bad)":"var(--warn)", due!=null&&due<=0);
  tile(qs.length,"Open questions", qs.length?`oldest is ${ageDays(qs[0].at)} days old`:"", "dig|q-open","var(--warn)", qs.length&&ageDays(qs[0].at)>21);
  tile(probs.length,"Live problems", probs.length?`oldest is ${ageDays(probs[0].at)} days old`:"", "dig|problems-open","var(--hot)", probs.length&&ageDays(probs[0].at)>30);
  tile(sys.length+projs.length,"Nobody owns these", "systems and projects with no owner", "dig|owners-unowned","#5b9c97");
  tile(stale.length,"Going quiet", stale.length?`longest gap ${Math.round(stale[0].gap/86400000)} days`:"", "dig|stale-people","#6d8bc4");
  tile(blank.length,"Departments you know nothing about", blank.map(r=>r.d.name).slice(0,2).join(", "), "dig|depts-blank","#bf8a4f");
  // only the near-certain ones nag from here; the rest live in Insights where you go to browse
  const dup=dupCount(o);
  tile(dup,"Look like duplicates","one record written down twice","act|dupes","#a874a0",dup>3);
  if(!T.length) return "";
  return `<div class="section-head"><h3>Worth doing something about</h3><div class="line"></div></div>
    <div class="act-grid">${T.map(x=>`
      <button class="act${x.urgent?" hot":""}" data-dash="${esc(x.act)}">
        <span class="act-n" style="color:${cssCol(x.col)}">${esc(String(x.n))}</span>
        <span class="act-l">${esc(x.label)}</span>
        ${x.sub?`<span class="act-s">${esc(x.sub)}</span>`:""}
      </button>`).join("")}</div>`;
}
function workOverview(o){
  maybeAutoObjectives(o);                       // the page should already be a briefing when it opens
  const c=workCounts(o);
  const tile=(n,l,d,go,col)=>`<button class="w-tile" ${go.slice(0,4)==="dig|"?`data-dig="${esc(go.slice(4))}"`:`data-wtab="${esc(go)}"`}><div class="n" style="color:${col||"var(--txt)"}">${n}</div><div class="l">${esc(l)}</div><div class="d">${esc(d||"")}</div></button>`;
  // one line about today, then the dashboard, then what to do about it

    if(m&&byId[m]){ parentOf[p.id]=m; (kids[m]=kids[m]||[]).push(p.id); }
  });

  const roots=ppl.filter(p=>!parentOf[p.id]&&linked(p)).map(p=>p.id);

    if(!ch.length){ const x=cursor; cursor+=NW+GAPX; pos[id]={x,y:depth*(NH+GAPY),depth}; return x; }
    const xs=ch.map(c=>place(c,depth+1));

    return x;

  // a band underneath, ready to be dragged or given a reporting line.

  const perRow=Math.max(3,Math.min(5,Math.ceil(Math.sqrt(loose.length))+1));
  loose.sort((a,b)=>(a.name||"").localeCompare(b.name||"")).forEach((p,i)=>{
    pos[p.id]={x:(i%perRow)*(NW+GAPX), y:(depth+1+Math.floor(i/perRow))*(NH+GAPY)+(depth>=0?26:0), depth:-1, unplaced:1};
  });

  const asideY=(depth+1+Math.ceil(loose.length/perRow))*(NH+GAPY)+(depth>=0?26:0)+(loose.length?34:0);
  aside.sort((a,b)=>(a.name||"").localeCompare(b.name||"")).forEach((p,i)=>{
    pos[p.id]={x:(i%perRow)*(NW+GAPX), y:asideY+Math.floor(i/perRow)*(NH+GAPY), depth:-2, unplaced:1, aside:1};
  });

  const saved=wLayout();

  return `<div class="og-bar">

/* The corporate ladder. Same shape as deptPath but over organizations, and it is the one that
   answers "where do I actually sit" at a company like Siemens. Cycle-guarded: a user can always
   point two records at each other, and this must not hang the whole view when they do. */
function orgPath(id){
  const out=[]; const seen=new Set();
  let g=entGet("org",id);
  while(g && !seen.has(g.id) && out.length<10){ seen.add(g.id); out.unshift(g); g=g.parentId?entGet("org",g.parentId):null; }
  return out;
}
function orgChildren(opId,parentId){ return entAll("org",opId).filter(g=>(g.parentId||"")===(parentId||"")); }
// the org record standing for the company you actually work for, if you've said which
function employerOrg(o){ return o&&o.hired&&o.hired.orgId ? entGet("org",o.hired.orgId) : null; }
/* Departments nest, so a name alone is ambiguous — "Operations" inside which business unit?
   Walks up the parents with a cycle guard, because a user can always point two at each other. */
function deptPath(id,sep){
  const out=[]; const seen=new Set();
  let d=entGet("department",id);
  while(d && !seen.has(d.id) && out.length<8){ seen.add(d.id); out.unshift(d.name||"—"); d=d.parentId?entGet("department",d.parentId):null; }
  return out.join(sep||" › ");
}
function deptParentName(id){ const d=entGet("department",id); const p=d&&d.parentId?entGet("department",d.parentId):null; return p?p.name:""; }
function clip(s,n){ s=String(s||""); return s.length>n?s.slice(0,n-1)+"…":s; }

/* Pan / zoom / drag. Pointer events so a finger and a mouse take the same path. */
let ogView={x:0,y:0,z:1}, ogMode="org", ogFilter="";
function ogApply(){ const el=document.getElementById("ogPan"); if(el) el.style.transform=`translate(${ogView.x}px,${ogView.y}px) scale(${ogView.z})`; }
// The tool rail floats over the top-right of the canvas, so the fitted view keeps a gutter clear
// of it — otherwise the first card lands underneath and the rail eats the tap meant for the person.
function ogRailGutter(){ const r=document.querySelector(".og-tools"); return r?Math.round(r.getBoundingClientRect().width)+14:0; }
function ogFit(){
  const wrap=document.getElementById("ogWrap"), svg=document.getElementById("ogSvg");
  if(!wrap||!svg) return;
  const w=+svg.getAttribute("width"), h=+svg.getAttribute("height");
  const usable=Math.max(120, wrap.clientWidth-16-ogRailGutter());
  const z=Math.min(1, usable/w, (wrap.clientHeight-16)/h);
  ogView={z:Math.max(.3,z), x:Math.max(8,(usable-w*z)/2), y:10};
  ogApply();
}
function armWorkGraph(){
  const wrap=document.getElementById("ogWrap"); if(!wrap) return;
  const svg=document.getElementById("ogSvg");
  if(svg){                       // size the canvas to the chart rather than always 400px
    const w=+svg.getAttribute("width"), h=+svg.getAttribute("height");
    const z=Math.min(1,Math.max(120,wrap.clientWidth-16-ogRailGutter())/w);
    // the floor accommodates the tool rail, so it never hangs off a short map
    wrap.style.height=Math.round(Math.max(252,Math.min(420,h*Math.max(.3,z)+34)))+"px";
  }
  ogFit();
  // The flag lives on the element, not on the module: every render builds a NEW #ogWrap, and a
  // module-level "already bound" would leave that new one dead. (It did — editing anyone from the
  // map re-rendered the view and nothing was clickable until a reload.)
  if(wrap.dataset.bound) return; wrap.dataset.bound="1";
  let mode=null, startX=0, startY=0, orig=null, nodeId=null, moved=false, pts=new Map(), pinch=0;
  const pt=e=>({x:e.clientX,y:e.clientY});
  wrap.addEventListener("pointerdown",e=>{
    // the tool rail floats over the canvas; capturing its pointer would swallow the click
    if(e.target.closest(".og-tools")) return;
    const n=e.target.closest("[data-node]");
    pts.set(e.pointerId,pt(e));
    if(pts.size===2){ mode="pinch"; pinch=ogDist(pts); orig={...ogView}; return; }
    moved=false; startX=e.clientX; startY=e.clientY;
    if(n){ mode="node"; nodeId=n.dataset.node; const m=n.getAttribute("transform").match(/translate\(([-\d.]+),([-\d.]+)\)/); orig={x:+m[1],y:+m[2]}; }
    else { mode="pan"; orig={...ogView}; }
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener("pointermove",e=>{
    if(!mode) return;
    pts.set(e.pointerId,pt(e));
    if(mode==="pinch"&&pts.size===2){ const d=ogDist(pts); ogView.z=Math.max(.3,Math.min(2.4,orig.z*(d/pinch))); ogApply(); return; }
    const dx=e.clientX-startX, dy=e.clientY-startY;
    if(Math.abs(dx)>3||Math.abs(dy)>3) moved=true;
    if(mode==="pan"){ ogView.x=orig.x+dx; ogView.y=orig.y+dy; ogApply(); }
    else if(mode==="node"){
      const g=wrap.querySelector(`[data-node="${nodeId}"]`); if(!g) return;
      g.setAttribute("transform",`translate(${orig.x+dx/ogView.z},${orig.y+dy/ogView.z})`);
      g.classList.add("dragging");
    }
  });
  const done=e=>{
    pts.delete(e.pointerId);
    if(mode==="node"&&nodeId){
      const g=wrap.querySelector(`[data-node="${nodeId}"]`);
      if(g){ g.classList.remove("dragging");
        if(moved){ const m=g.getAttribute("transform").match(/translate\(([-\d.]+),([-\d.]+)\)/);
          const o=workOp(); const base=orgLayout(o);
          // store in layout space, not screen space, so it survives a re-render
          const ids=Object.keys(base.pos); const minX=Math.min(0,...ids.map(i=>base.pos[i].x)), minY=Math.min(0,...ids.map(i=>base.pos[i].y));
          wLayout()[nodeId]={x:+m[1]-30+minX, y:+m[2]-30+minY};
          save();
        } else { const [ty,id]=["person",nodeId]; openEnt(ty,id); } }
    }
    mode=null; nodeId=null;
  };
  wrap.addEventListener("pointerup",done);
  wrap.addEventListener("pointercancel",done);
  wrap.addEventListener("wheel",e=>{
    e.preventDefault();
    const r=wrap.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    const z=Math.max(.3,Math.min(2.4, ogView.z*(e.deltaY<0?1.12:0.89)));
    ogView.x = mx-(mx-ogView.x)*(z/ogView.z); ogView.y = my-(my-ogView.y)*(z/ogView.z); ogView.z=z;
    ogApply();
  },{passive:false});
}
function ogDist(pts){ const [a,b]=[...pts.values()]; return Math.hypot(a.x-b.x,a.y-b.y)||1; }
function ogZoom(dir){
  const wrap=document.getElementById("ogWrap"); if(!wrap) return;
  if(dir==="fit") return ogFit();
  if(dir==="reset"){ W().layout={}; save(); render(); toast("Back to the automatic layout"); return; }
  const cx=wrap.clientWidth/2, cy=wrap.clientHeight/2;
  const z=Math.max(.3,Math.min(2.4, ogView.z*(dir==="in"?1.2:0.83)));
  ogView.x=cx-(cx-ogView.x)*(z/ogView.z); ogView.y=cy-(cy-ogView.y)*(z/ogView.z); ogView.z=z;
  ogApply();
}

  else if(type==="problem") rows.push(["Status",probPill(rec.status)],["Discovered",rec.discovered?fmtDate(rec.discovered):""],["What's wrong",rec.description],["Tried so far",rec.attempts],["Solution",rec.solution]);
  else if(type==="system") rows.push(["Owner",rec.ownerId?entLabel("person",rec.ownerId):"— not recorded"],["Notes",rec.note]);

/* ---------------- A DROPDOWN THAT CAN BE SEARCHED ----------------
   `listFilter` covers every list the app *renders*, but a native <select> is not a rendered list:
   it has no search, and its options arrive in whatever order the records happened to be created.
   Twenty-odd colleagues in creation order, in a control you cannot type into, is unusable.

   A native <select> stays the control, because on a phone it gets the OS picker — far better than
   anything hand-rolled. What changes: options are SORTED, and above any list long enough to need
   one there is a filter box.

   Options are removed and re-added rather than marked [hidden]: iOS Safari ignores `hidden` on an
   <option> and would happily show every name anyway, which is the same class of bug as the
   `[hidden]{display:none!important}` one in listFilter. */
const PICK_MIN=8;                       // a search box over seven names is clutter
const pickFull=new WeakMap();           // select → its complete option list, so filtering is lossless
function pickSort(list){
  return list.slice().sort((a,b)=>norm(a.t).localeCompare(norm(b.t)));
}
function pickSelect(o){
  const list=pickSort(o.pool||[]), cur=o.value||"";
  const opts=`<option value="">— ${esc(o.none||"none")} —</option>`+
    list.map(x=>`<option value="${esc(x.v)}" ${x.v===cur?"selected":""}>${esc(x.t)}</option>`).join("")+
    (o.tail||"");
  const sel=`<select name="${esc(o.name||"")}" ${o.id?`id="${esc(o.id)}"`:""} ${o.extra||""}>${opts}</select>`;
  if(list.length<PICK_MIN) return sel;
  return `<div class="pick-find">
      <input type="search" class="pick-q" placeholder="Search ${esc(o.noun||"the list")}…" autocomplete="off" data-pickq="1"/>
      <span class="pick-count"></span>
    </div>${sel}`;
}
/* Rebuild the select from the remembered full list. Keeps the current choice selected even when it
   no longer matches the query — silently clearing someone's answer because they typed is worse
   than showing one row that doesn't match. */
function pickFilter(inp){
  const wrap=inp.closest(".pick-wrap")||inp.parentElement.parentElement;
  const sel=wrap&&wrap.querySelector("select"); if(!sel) return;
  let full=pickFull.get(sel);
  if(!full){
    full=[...sel.options].map(op=>({v:op.value,t:op.textContent,fixed:op.value===""||op.value==="__new"}));
    pickFull.set(sel,full);
  }
  const cur=sel.value;
  const q=norm(inp.value).split(" ").filter(Boolean);
  // What MATCHED and what is SHOWN are two different things: the current choice is always shown
  // (silently clearing an answer because you typed is worse than one row that doesn't match), but
  // it must never be counted as a match, or "nothing matches" would read "1 of 21".
  const match=full.filter(x=>!x.fixed&&q.every(w=>norm(x.t).includes(w)));
  const keep=q.length?full.filter(x=>x.fixed||x.v===cur||match.includes(x)):full;
  sel.innerHTML=keep.map(x=>`<option value="${esc(x.v)}" ${x.v===cur?"selected":""}>${esc(x.t)}</option>`).join("");
  sel.value=cur;
  // Narrowed to exactly one? Pick it — otherwise what you just searched for is still hidden inside
  // a closed dropdown. Never over an answer already given: that one you chose deliberately.
  if(q.length&&match.length===1&&!cur) sel.value=match[0].v;
  const c=wrap.querySelector(".pick-count");
  if(c) c.textContent=q.length?(match.length?`${match.length} of ${full.filter(x=>!x.fixed).length}`:"nothing matches"):"";
}
/* Put the whole list back and forget the search — used before anything mutates the options, so a
   filtered view is never mistaken for the real one. */
function pickRestore(sel,wrap){
  wrap=wrap||sel.closest(".pick-wrap");
  const full=pickFull.get(sel), cur=sel.value;
  if(full){
    sel.innerHTML=full.map(x=>`<option value="${esc(x.v)}" ${x.v===cur?"selected":""}>${esc(x.t)}</option>`).join("");
    sel.value=cur;
    pickFull.delete(sel);
  }
  if(wrap){
    const q=wrap.querySelector(".pick-q"); if(q) q.value="";
    const c=wrap.querySelector(".pick-count"); if(c) c.textContent="";
  }
}
/* Create the thing the picker is picking, without leaving the form. The record is real
   immediately (entities are cheap and editable on their own), so the select just gains it. */
function addEntInline(btn){
  const wrap=btn.closest(".pick-wrap"); if(!wrap) return;
  const [field,type]=(btn.dataset.newadd||"").split("|");

    // match whatever was typed at the time, and the cache would then re-learn the truncated list.
    pickRestore(sel, wrap);

/* ---- Merging two people. Resolution stops most duplicates at the door, but you can still
   end up with two records (you picked "add new", or you met someone twice under two names).
   Merging has to move the graph too, or the evidence trail breaks. ---- */
function dedupeLinks(){
  const w=W(), seen={}, out=[];
  w.links.forEach(l=>{
    if(l.st===l.tt&&l.sid===l.tid) return;                 // self-link left over from a merge
    const k=[l.opId,l.st,l.sid,l.rel,l.tt,l.tid].join("|");
    if(seen[k]){ const e=seen[k];
      e.conf=Math.max(e.conf||0,l.conf||0);
      e.via=[...new Set((e.via||[]).concat(l.via||[]))];
      e.seen=(e.seen||1)+(l.seen||1);
      return; }
    seen[k]=l; out.push(l);
  });
  w.links=out;
}
/* ================= YOU, IN YOUR OWN MAP =================
   The point of the post-hire half is understanding a company from where YOU sit, and that only
   works if you are actually in it. So "me" is a real person record on o.people like everybody
   else — same links, same department, same reporting line — flagged by o.hired.meId. Everything
   that reasons about the place can then reason about your position in it, rather than treating
   you as an outside observer of your own org chart. */
function meOf(o){ const id=o&&o.hired&&o.hired.meId; return id?((o.people||[]).find(p=>p.id===id)||null):null; }
function isMe(o,p){ return !!(p&&o&&o.hired&&o.hired.meId===p.id); }
function ensureMe(o){
  if(!o||!o.hired) return null;

  const p={id:uid(),name:nm||"Me",title:(o.hired.title)||o.role||"",linkedin:"",email:"",notes:"",
    managerId:o.hired.managerId||"",at:Date.now()};

function personMgrId(p){ return p&&(p.managerId||personManager(p))||""; }
/* Where you sit, computed from the graph — the sentence every prompt needs and the line the

function myPlace(o){

/* ---- Merging two records for the same person ----
   The old merge kept whatever was already on the record you were keeping and quietly discarded
   the other value when both had one. That is where the useful correction usually lives: one
   record says "Analyst" from an interview six months ago, the other says "Head of Finance" from
   last week. So nothing is thrown away any more — you review every field where the two disagree,
   the AI recommends which is right and says why, and whatever you don't pick is written into the
   notes rather than deleted. */
/* ============================== THE DUPLICATE CHECKER ==============================
   Records arrive from three directions — typed by hand, extracted from a note, pulled off a
   photo — and each has its own way of spelling the same thing. `resolveEnt` catches what it can at
   the moment of writing, but it only ever sees one item at a time and it is deliberately shy: two
   plausible matches means it creates nothing and asks. So duplicates accumulate quietly.

   This is the sweep that finds them afterwards. It has to catch what a string comparison cannot:
   an acronym against its expansion, a nickname, an alias, a name that contains another, a typo.
   And every pair carries the reasons it was flagged, because a merge is destructive and "trust me"
   is not good enough. */
const DUP_TIERS={same:{label:"Almost certainly the same",min:0.95},likely:{label:"Probably the same",min:0.72},possible:{label:"Worth a look",min:0.52}};
const DUP_MAX=60;                       // a review screen, not a database report
function dupTier(s){ return s>=DUP_TIERS.same.min?"same":s>=DUP_TIERS.likely.min?"likely":s>=DUP_TIERS.possible.min?"possible":""; }
// edit distance, capped — only ever asked about short names, and bails as soon as it's hopeless
function editDist(a,b,cap){
  if(a===b) return 0;
  if(Math.abs(a.length-b.length)>cap) return cap+1;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i]; let best=i;
    for(let j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(cur[j]<best) best=cur[j];
    }
    if(best>cap) return cap+1;
    prev=cur;
  }
  return prev[b.length];
}
function initialsOf(s){ return norm(s).split(" ").filter(w=>w.length>1).map(w=>w[0]).join(""); }
/* How alike are two names, and WHY. Returns {s, why:[]} — the reasons are the whole point. */
function nameLike(an,bn){
  const a=canonThing(an), b=canonThing(bn);
  if(!a||!b) return {s:0,why:[]};
  if(a===b) return {s:1,why:["identical once you ignore case and punctuation"]};
  /* Names that differ ONLY in their numbers are enumerations, never duplicates: Q1 and Q2 forecast,
     v1 and v2, Phase 1 and Phase 2, Region 3. This has to come before everything below, because a
     single differing digit otherwise reads as a one-character typo and scores 0.8. */
  if(a.replace(/\d+/g,"#")===b.replace(/\d+/g,"#")) return {s:0,why:[]};
  const at=a.split(" ").filter(Boolean), bt=b.split(" ").filter(Boolean);
  // an acronym against its expansion — QBR / quarterly business review
  const ai=initialsOf(an), bi=initialsOf(bn);

function dupScan(o){
  if(!o) return [];
  const g={}, out=[];

  const nbOf={};                       // one hop of the graph, for corroboration
  const near=(t,id)=>{
    const k=t+"|"+id;
    if(!nbOf[k]) nbOf[k]=new Set(relatedTo(t,id,true).map(r=>r.type+"|"+r.id));
    return nbOf[k];

    return notesOf[k];

  ENT_TYPES.filter(t=>t!=="capture").forEach(type=>{
    const pool=entAll(type,o.id).filter(r=>r&&r.id);
    for(let i=0;i<pool.length;i++) for(let j=i+1;j<pool.length;j++){
      const a=pool[i], b=pool[j];

      if(skipped.has(key)) continue;
      const an=entName(type,a)||"", bn=entName(type,b)||"";

        else if(pm>=0.7){ s=0.74; why=[`"${an}" and "${bn}" could be one person`]; }
        else { const nl=nameLike(an,bn); s=nl.s*0.85; why=nl.why; }   // typos still count, less
      } else {

      const sameOwner=a.ownerId&&b.ownerId&&a.ownerId===b.ownerId;
      const sameKind=a.kind&&b.kind&&a.kind===b.kind;
      if(sameDept){ s+=0.06; why.push("both in "+(entLabel("department",a.deptId)||"the same department")); }
      if(sameOwner){ s+=0.05; why.push("the same owner"); }
      if(sameKind&&type!=="person"){ s+=0.03; why.push("both filed as "+a.kind); }
      const na=near(type,a.id), nb=near(type,b.id);
      let sharedN=0; na.forEach(k=>{ if(nb.has(k)) sharedN++; });

      if(together){ s-=0.22; why.push(`⚠ ${together} note${together===1?"":"s"} mention${together===1?"s":""} both, so they may well be different`); }
      // people in openly different departments are usually not one person
      if(type==="person"&&a.deptId&&b.deptId&&a.deptId!==b.deptId){ s-=0.1; why.push("⚠ different departments"); }

    const types=[...new Set(list.map(x=>x.type))];
    if(types.length<2) return;

      if(list[i].type===list[j].type) continue;
      const key="x:"+[list[i].type+"|"+list[i].r.id,list[j].type+"|"+list[j].r.id].sort().join("~");
      if(skipped.has(key)) continue;
      out.push({key,cross:true,tier:"cross",score:1,

/* ---- "That isn't a project." Records get mislabelled — by you in a hurry or by the AI reading a
   note. Moving one keeps its history: every link, every note that mentions it, its original date. ---- */
/* Every record can become any other kind. A CRM that files something as a contact forever is the
   thing this is meant to fix — you rarely know what a thing is when you first write it down.
   The order is just "what this is most often actually was"; nothing is forbidden. */
const CONVERT_LIKELY={
  person:  ["bite","info","org","department","team"],
  project: ["info","problem","process","system","decision","bite"],
  problem: ["info","project","process","decision","bite"],
  process: ["info","project","system","decision","bite"],
  system:  ["info","project","process","bite"],
  decision:["info","process","project","bite"],
  info:    ["bite","project","problem","process","system","decision"],
  question:["info","bite","problem"],
  bite:    ["info","question","decision","person"],
  org:     ["department","info","team","bite"],
  department:["team","org","info"],
  team:    ["department","org","info"],
};
const CONVERT_ALL = ["person","bite","info","project","problem","question","decision","process","system","department","team","org"];
function convertTargets(type){
  const likely=(CONVERT_LIKELY[type]||[]).filter(t=>t!==type&&ENT[t]);
  return likely.concat(CONVERT_ALL.filter(t=>t!==type&&!likely.includes(t)&&ENT[t]));
}
// what each type calls its name and its body, so text survives the move
const ENT_NAMEF={person:"name",bite:"fact",org:"name",project:"name",problem:"title",department:"name",team:"name",system:"name",process:"name",decision:"title",question:"q",info:"title"};
const ENT_BODYF={person:"notes",bite:"note",org:"note",project:"description",problem:"description",department:"note",team:"note",system:"note",process:"steps",decision:"reason",question:"answer",info:"summary"};
function convertEnt(fromType,id,toType){
  const rec=entGet(fromType,id); if(!rec||fromType===toType||!ENT[toType]) return null;
  const opId=rec.opId||entOpId(fromType,id);
  const name=entName(fromType,rec);
  // a person's title is part of what they were, so it survives into the new record's body
  const body=[rec[ENT_BODYF[fromType]],fromType==="person"?rec.title:"",rec.note,rec.notes]
    .filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join("\n");
  const seedTags = fromType==="bite" ? (rec.tags||[]) : [];
  const made=createEnt(toType,opId,name,{tags:seedTags},rec.fromCapture||"");
  if(!made) return null;
  if(body) made[ENT_BODYF[toType]]=body;
  made.at=rec.at||Date.now();                       // it was learned when it was learned
  made.convertedFrom=ENT[fromType].label;
  if(toType==="info"&&!made.kind) made.kind="Other";
  if(toType==="bite"&&!made.source&&fromType==="person") made.source=rec.name||"";
  if(toType==="person"){ made.title=made.title||""; }
  // the graph comes with it
  const w=W();
  w.links.forEach(l=>{
    if(l.st===fromType&&l.sid===id){ l.st=toType; l.sid=made.id; }
    if(l.tt===fromType&&l.tid===id){ l.tt=toType; l.tid=made.id; }
  });
  w.captures.forEach(c=>(c.entities||[]).forEach(e=>{ if(e.t===fromType&&e.id===id){ e.t=toType; e.id=made.id; } }));
  ["projects","systems"].forEach(k=>W()[k].forEach(r=>{ if(r&&r.ownerId===id) r.ownerId=(toType==="person"?made.id:""); }));
  if(fromType==="person"){
    // nobody should still report to, or be led by, a record that is no longer a person
    state.opportunities.forEach(op=>(op.people||[]).forEach(p=>{ if(p.managerId===id) p.managerId=""; }));
    ["departments","teams"].forEach(k=>W()[k].forEach(r=>{ if(r&&r.headId===id) r.headId=""; }));
    W().bites.forEach(bt=>{ if(bt.personId===id) bt.personId=(toType==="person"?made.id:""); });
  }
  dedupeLinks();
  entDelete(fromType,id);
  return made;
}

// everything you've recorded that's relevant to these people, computed — not generated
function meetingBrief(o,ids,topic){
  const T=terms(topic||"");
  const hit=s=>T.length?T.some(t=>norm(s).includes(t)):false;
  const people=ids.map(id=>entGet("person",id)).filter(Boolean);
  const per=people.map(p=>{
    const rel=relatedTo("person",p.id,true);
    const ints=personInteractions(p);
    return {p, rel, ints, last:ints[0]?ints[0].at:0,
      owns:rel.filter(r=>r.rel==="OWNS"), knows:rel.filter(r=>r.rel==="KNOWS"),
      inv:rel.filter(r=>["INVOLVED_IN","HELPED_SOLVE","USES"].includes(r.rel))};
  });
  // things more than one of them is attached to — the actual common ground
  const tally={};
  per.forEach(x=>x.rel.forEach(r=>{ const k=r.type+"|"+r.id; (tally[k]=tally[k]||{r,who:[]}).who.push(x.p.name); }));
  const shared=Object.values(tally).filter(x=>x.who.length>1);
  const openQs=wOf("questions",o.id).filter(q=>q.status==="Open").map(q=>{
    const byTopic=hit(q.q);
    const byPerson=per.some(x=>x.rel.some(r=>norm(q.q).includes(norm(entLabel(r.type,r.id)))));
    return {q, score:(byTopic?2:0)+(byPerson?1:0)};
  }).filter(x=>x.score>0||T.length===0).sort((a,b)=>b.score-a.score).slice(0,6).map(x=>x.q);
  const ids2=new Set(ids);
  const notes=wOf("captures",o.id)
    .filter(c=>(c.entities||[]).some(e=>e.t==="person"&&ids2.has(e.id)) || (T.length&&hit(c.text)))
    .sort((a,b)=>b.at-a.at).slice(0,5);
  const topicHits=T.length?["project","problem","system","process","decision"].flatMap(t=>
    entAll(t,o.id).filter(r=>hit(entName(t,r))).map(r=>({t,r}))):[];
  return {per, shared, openQs, notes, topicHits};
}

In 2-4 sentences: what should I get out of this meeting, and what's the one thing worth raising? Use only what's above — if my records are thin, say so. Plain text, no preamble.`;

/* ---- What changed. The company map moves under you; this is the diff. Everything here is
   derived from timestamps already on the records, so it's a fact, not a summary. ---- */
let changeRange=7;
function changesSince(o,days){
  const since=Date.now()-days*86400000;
  const fresh=r=>(r.at||0)>=since;
  const d={days,since};
  ["project","problem","system","department","process","decision","question"].forEach(t=>{ d[t]=wOf(ENT[t].list,o.id).filter(fresh); });
  d.people=(o.people||[]).filter(fresh);
  d.notes=wOf("captures",o.id).filter(c=>fresh(c)||(c.editedAt||0)>=since);
  d.talked=(o.people||[]).filter(p=>{ const i=personInteractions(p); return i.length&&i[0].at>=since; });
  d.status=wOf("projects",o.id).concat(wOf("problems",o.id)).filter(r=>(r.statusAt||0)>=since&&r.prevStatus);
  d.answered=wOf("questions",o.id).filter(q=>(q.answeredAt||0)>=since);
  d.links=W().links.filter(l=>l&&l.opId===o.id&&l.rel!=="MENTIONS"&&(l.at||0)>=since);
  d.total=d.notes.length+d.people.length+d.status.length+d.answered.length+d.project.length+d.problem.length+d.system.length+d.decision.length;
  return d;
}
function changedCard(o){

  const ranges=[[7,"week"],[30,"month"],[90,"90 days"]];
  const chips=ranges.map(([n,l])=>`<span class="chip ${changeRange===n?'tag-chip':''}" data-range="${n}" style="cursor:pointer">Past ${l}</span>`).join("");
  const head=`<div class="section-head"><h3>What changed</h3><div class="line"></div></div>
    <div class="cards-sorts" style="padding-bottom:10px">${chips}</div>`;
  if(!d.total) return head+`<div class="card panel"><div class="ent-empty">Nothing new in the past ${changeRange===7?"week":changeRange===30?"month":"90 days"}.<br><br><button class="btn primary sm" data-act="capture">${I.plus} Capture something</button></div></div>`;

  h+=line(d.people.length,"new person","new people",names(d.people,"person"));
  h+=line(d.project.length,"new project","new projects",names(d.project,"project"));
  h+=line(d.problem.length,"problem discovered","problems discovered",names(d.problem,"problem"));
  h+=line(d.system.length,"new system","new systems",names(d.system,"system"));
  h+=line(d.decision.length,"decision recorded","decisions recorded",names(d.decision,"decision"));
  h+=line(d.answered.length,"question answered","questions answered",names(d.answered,"question"));
  h+=line(d.question.length,"new open question","new open questions");
  h+=line(d.links.length,"new connection","new connections");
  h+=`</div>`;
  if(d.status.length){
    h+=`<div class="ai-subhead">${I.spark} Moved</div><div style="font-size:13px;line-height:1.8;color:var(--muted)">${
      d.status.map(r=>{ const t=r.title!==undefined?"problem":"project";
        return `<div><span class="cite" data-ent="${t}|${r.id}">${esc(entName(t,r))}</span> — ${esc(r.prevStatus)} → <b style="color:var(--txt)">${esc(r.status)}</b></div>`; }).join("")}</div>`;
  }
