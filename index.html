function workRefs(o){
  const refs={}; const L=[]; let n={};
  const key=t=>({person:"p",project:"pr",problem:"pb",department:"d",team:"tm",system:"s",process:"pc",decision:"dc",question:"q",info:"in",capture:"c"})[t];
  const reg=(t,rec)=>{ const k=key(t); n[k]=(n[k]||0)+1; const id=k+n[k]; refs[id]={t,id:rec.id}; return id; };
  ["person","department","team","system","project","problem","process","decision","question","info"].forEach(t=>{
    const list=entAll(t,o.id); if(!list.length) return;
    L.push("",ENT[t].plural.toUpperCase()+":");
    list.forEach(rec=>{
      const id=reg(t,rec);
      let line=`[${id}] ${entName(t,rec)}`;
      const m=entRowMeta(t,rec); if(m) line+=` — ${m}`;
      L.push(line.length>240?line.slice(0,240)+"…":line);
    });
  });
  const caps=wOf("captures",o.id).sort((a,b)=>b.at-a.at).slice(0,40);
  if(caps.length){
    L.push("","MY NOTES (newest first):");
    caps.forEach(c=>{ const id=reg("capture",c); const t=(c.text||"").replace(/\s+/g," "); L.push(`[${id}] ${fmtDate(ymdOf(c.at))}: ${t.length>420?t.slice(0,420)+"…":t}`); });
  }
  const links=W().links.filter(l=>l.opId===o.id&&l.rel!=="MENTIONS");
  if(links.length){
    L.push("","WHAT I'VE RECORDED ABOUT HOW THINGS CONNECT:");
    links.slice(0,120).forEach(l=>{
      const a=entGet(l.st,l.sid), b=entGet(l.tt,l.tid); if(!a||!b) return;
      L.push(`- ${entName(l.st,a)} ${REL_LABEL[l.rel]||l.rel} ${entName(l.tt,b)}${l.conf<0.75?" (inferred, low confidence)":""}`);
    });
  }
  return {refs,text:L.join("\n")};
}
function askWorkPrompt(o,q,ctx){
  const day=hireDay(o);
  return `You are the organizational memory of one person — ${getProfile().name||"the user"}${o.hired&&o.hired.title?`, ${o.hired.title}`:""} at ${o.company}${day>0?`, ${day} days in`:""}. Everything below is what THEY have personally recorded. Today is ${todayYMD()}.

${ctx.text}

---
Answer their question using only the records above.

Hard rules:
- Cite your sources inline with the bracket ids exactly as they appear, e.g. [p2] or [c7]. Every specific claim needs at least one.
- Distinguish what is recorded from what you're inferring. Say "You recorded…", "Based on three notes…", "This appears to be…".
- If the records don't cover it, say so plainly and suggest who they could ask or what to find out. Never invent people, owners, reporting lines, dates, project status, company politics or anyone's opinions.
- Be concise and concrete. Lead with the answer. No preamble, no headings unless it genuinely helps.

Question: ${q}`;
}
let askRefs={};
// a citation reads as a name for a record and as a date for a note — never a wall of note text
function citeLabel(t,id){
  if(t==="capture"){ const c=wFind("captures",id); return c?`${fmtDate(ymdOf(c.at))} note`:""; }
  return entLabel(t,id);
}
function citeHTML(text){
  return esc(text).replace(/\[([a-z]{1,2}\d{1,3})\]/g,(m,id)=>{
    const r=askRefs[id]; if(!r) return m;
    const label=citeLabel(r.t,r.id); if(!label) return m;
    return `<span class="cite" data-cite="${r.t}|${r.id}">${esc(label)}</span>`;
  });
}

/* ---- "Who do I ask?" — ranked in JS from the graph so the evidence is always real.
   The AI only phrases the recommendation; it can't add a person who isn't in your records. ---- */
const STOP=new Set("the a an of for to in on at is are was were do does did i my me we our you your it this that what who how why when which and or but with about into from can should would could".split(" "));
function terms(q){ return norm(q).split(" ").filter(w=>w.length>2&&!STOP.has(w)); }
function whoToAsk(o,q){
  const T=terms(q); if(!T.length) return [];
  const hit=s=>{ const n=norm(s); return T.filter(t=>n.includes(t)).length; };
  const out=[];
  (o.people||[]).forEach(p=>{
    let score=0; const why=[];
    const rel=relatedTo("person",p.id,true);
    rel.forEach(r=>{
      const nm=entLabel(r.type,r.id); const h=hit(nm); if(!h) return;
      const w=({OWNS:5,KNOWS:4,HELPED_SOLVE:5,INVOLVED_IN:3,WORKS_IN:2,USES:2}[r.rel]||2)*(r.conf||1);
      score+=w*h;
      why.push(`${r.dir==="out"?(REL_LABEL[r.rel]||r.rel):"linked to"} ${nm}${r.conf<0.75?" — though that one's inferred":""}`);
    });
    (p.expertise||[]).forEach(x=>{ const h=hit(x); if(h){ score+=3*h; why.push(`you recorded them as knowing ${x}`); } });
    if(p.title&&hit(p.title)){ score+=2; why.push(`their title is ${p.title}`); }
    if(p.deptId&&hit(entLabel("department",p.deptId))){ score+=2; why.push(`they're in ${entLabel("department",p.deptId)}`); }
    const caps=evidenceFor("person",p.id).filter(c=>hit(c.text));
    if(caps.length){ score+=1.6*caps.length; why.push(caps.length===1?"one of your notes mentions them alongside this":`${caps.length} of your notes mention them alongside this`); }
    if(score>0) out.push({p,score,why:[...new Set(why)],caps});
  });
  return out.sort((a,b)=>b.score-a.score).slice(0,4);
}

/* ---- "What am I missing?" — every gap below is computed from the records, so each one is
   a fact about your notes, not a guess about the company. ---- */
function knowledgeGaps(o){
  const g=[]; const ppl=(o.people||[]);
  const add=(icon,col,title,why,act)=>g.push({icon,col,title,why,act});
  wOf("systems",o.id).forEach(s=>{
    const knowers=relatedOfType("system",s.id,"person",["KNOWS","OWNS"]).length
      + linksOf("system",s.id).filter(l=>l.st==="person"&&(l.rel==="KNOWS"||l.rel==="OWNS")).length;
    if(!s.ownerId&&!knowers) add(I.system,ENT.system.col,`Nobody owns ${entName("system",s)}`,`You've referenced ${entName("system",s)} but haven't recorded who owns it or who knows it well.`,{t:"who",q:entName("system",s)});
  });
  wOf("projects",o.id).forEach(p=>{
    if(!p.ownerId&&!relatedOfType("project",p.id,"person",["OWNS"]).length)
      add(I.project,ENT.project.col,`${entName("project",p)} has no clear owner`,`You've mentioned this project but haven't recorded who owns it.`,{t:"who",q:entName("project",p)});
  });
  wOf("problems",o.id).filter(p=>p.status==="Discovered"||p.status==="Investigating").forEach(p=>{
    const age=daysSince(p.at);
    if(age>=14) add(I.problem,ENT.problem.col,`"${entName("problem",p)}" has been open ${age} days`,`Still ${p.status.toLowerCase()} with no recorded outcome.`,{t:"ent",type:"problem",id:p.id});
  });
  // departments your work depends on but you barely talk to
  wOf("departments",o.id).forEach(d=>{
    const people=ppl.filter(p=>p.deptId===d.id).length;
    const deps=W().links.filter(l=>l.opId===o.id&&((l.st==="department"&&l.sid===d.id)||(l.tt==="department"&&l.tid===d.id))&&l.rel!=="MENTIONS"&&l.rel!=="WORKS_IN").length;
    if(deps>=2&&people===0) add(I.people,ENT.department.col,`You don't know anyone in ${entName("department",d)}`,`${deps} things you've recorded touch ${entName("department",d)}, but you haven't met anyone there.`,{t:"who",q:entName("department",d)});
  });
  const openQ=wOf("questions",o.id).filter(q=>q.status==="Open"&&daysSince(q.at)>=7);
  if(openQ.length>=3) add(I.question,ENT.question.col,`${openQ.length} questions have been open over a week`,`Oldest: "${entName("question",openQ.sort((a,b)=>a.at-b.at)[0])}"`,{t:"tab",tab:"knowledge"});
  // interview contacts who've gone quiet since you joined
  const started=o.hired&&o.hired.startDate?new Date(o.hired.startDate+"T00:00").getTime():0;
  const quiet=ppl.filter(p=>{ const ints=personInteractions(p).filter(x=>x.at>started); return started&&!ints.length; });
  if(quiet.length&&hireDay(o)>=14) add(I.user,"#6d8bc4",`${quiet.length} ${quiet.length===1?"person":"people"} from your interviews you haven't caught up with`,quiet.slice(0,4).map(p=>p.name).join(", "),{t:"tab",tab:"people"});
  if(hireDay(o)>=7&&wOf("captures",o.id).length<3) add(I.note,"#7c828f","Your map is still mostly empty",`A note after each meeting is all it takes — that's what everything else here is built from.`,{t:"cap"});
  return g;
}
function gapHTML(g){
  const act = g.act.t==="who" ? `data-whoq="${esc(g.act.q)}"` : g.act.t==="ent" ? `data-ent="${g.act.type}|${g.act.id}"` : g.act.t==="tab" ? `data-wtab="${g.act.tab}"` : `data-act="capture"`;
  const label = g.act.t==="who" ? "Who do I ask? →" : g.act.t==="ent" ? "Open →" : g.act.t==="cap" ? "Capture a note →" : "Take a look →";
  return `<div class="gap-item"><div class="gap-ico" style="background:${g.col}22;color:${g.col}">${g.icon}</div>
    <div style="min-width:0"><b>${esc(g.title)}</b><div style="color:var(--muted);font-size:12.5px">${esc(g.why)}</div>
    <span class="gap-do" ${act}>${label}</span></div></div>`;
}
function openGaps(){

/* ---- 30 / 60 / 90-day reviews. The numbers and lists are computed; the AI writes the read
   on top of them. Saved so you can look back at who you were on day 30. ---- */
function reportData(o,day){
  const start=o.hired&&o.hired.startDate?new Date(o.hired.startDate+"T00:00").getTime():o.createdAt;
  const until=start+day*86400000;
  const inWin=r=>r.at<=until;
  const d={day,people:(o.people||[]).filter(p=>!p.at||p.at<=until),caps:wOf("captures",o.id).filter(inWin)};
  ["project","problem","department","system","process","decision","question"].forEach(t=>{ d[t]=wOf(ENT[t].list,o.id).filter(inWin); });
  d.solved=d.problem.filter(p=>p.status==="Solved");
  d.openQ=d.question.filter(q=>q.status==="Open");
  d.gaps=knowledgeGaps(o);
  return d;
}
function reportText(o,day){
  const d=reportData(o,day);
  const L=[`# Day ${day} at ${o.company}`,``,
    `Role: ${workTitle(o)}${o.hired&&o.hired.startDate?` · started ${fmtDate(o.hired.startDate)}`:""}`,
    `Notes captured: ${d.caps.length}`,``,
    `## People (${d.people.length})`,
    ...d.people.map(p=>`- ${p.name}${p.title?` — ${p.title}`:""}${p.deptId?` · ${entLabel("department",p.deptId)}`:""}${(p.expertise||[]).length?` · knows ${p.expertise.join(", ")}`:""} · ${personInteractions(p).length} interactions`),
    ``,`## Departments (${d.department.length})`, ...d.department.map(x=>`- ${entName("department",x)}`),
    ``,`## Projects (${d.project.length})`, ...d.project.map(x=>`- ${entName("project",x)} [${x.status}]${x.ownerId?` · owner ${entLabel("person",x.ownerId)}`:" · owner not recorded"}`),
    ``,`## Problems (${d.problem.length}, ${d.solved.length} solved)`, ...d.problem.map(x=>`- ${entName("problem",x)} [${x.status}]`),
    ``,`## Systems (${d.system.length})`, ...d.system.map(x=>`- ${entName("system",x)}${x.ownerId?` · owner ${entLabel("person",x.ownerId)}`:""}`),
    ``,`## Processes (${d.process.length})`, ...d.process.map(x=>`- ${entName("process",x)}`),
    ``,`## Decisions recorded (${d.decision.length})`, ...d.decision.map(x=>`- ${entName("decision",x)}${x.reason?` — ${x.reason}`:""}`),
    ``,`## Still open (${d.openQ.length})`, ...d.openQ.map(x=>`- ${entName("question",x)}`),
    ``,`## Gaps in what I've recorded`, ...d.gaps.map(g=>`- ${g.title}: ${g.why}`),
  ];
  return L.join("\n");
}
function reportPrompt(o,day){
  const ninety = day>=90;
  return `${reportText(o,day)}

---
Everything above is what I personally recorded during my first ${day} days at ${o.company}. Write my ${ninety?"90-day map":`day-${day} review`} from it — plain text, no markdown headers heavier than a single line, warm but direct, written to me as "you".

${ninety?`Cover, in this order: how I understand the organization; the people who matter most to my role and what each knows; how the departments actually interact; how important work gets done; the systems I depend on and who owns them; the major projects affecting me; the problems I found; what I helped solve; where I could have impact; what I still don't understand; and what I should focus on next.`
: `Cover: what I've learned, who I now know and how well, what I've discovered about how the place works, what I'm still missing, which relationships to strengthen, and what to focus on in the next 30 days.`}

Rules: use only what's above. Don't invent people, projects, problems or opinions. Where my records are thin, say so — "you haven't recorded anything about X yet" is a useful finding. Be specific: name the actual people, systems and projects.`;
}

    <div style="display:flex;gap:8px;flex-wrap:wrap">

    <div style="font-size:11.5px;color:var(--faint);margin-top:13px">${getStories().length?`✓ Using ${getStories().length} ${getStories().length===1?"story":"stories"} from your `:"Add reusable STAR stories in your "}<span data-act="prep-bank" style="color:var(--accent3);cursor:pointer;font-weight:700">Prep bank</span> for behavioral answers.</div>
    <details style="margin-top:13px"><summary style="cursor:pointer;font-size:12px;color:var(--muted);font-weight:600">View / copy the raw brief</summary>
      <div class="ai-pre" id="briefText" style="margin-top:8px">${esc(brief)}</div>

function buildBrief(o){
  const L=[];
  L.push(`# Interview brief — ${o.company}${o.role?` (${o.role})`:""}`);
  L.push("");
  if(getProfile().name) L.push(`- Candidate (me): ${getProfile().name}${getProfile().headline?` — ${getProfile().headline}`:""}`);
  L.push(`- Stage: ${stage(o.status).name}`);
  if(o.source) L.push(`- How I got here: ${o.source}${o.referrer?` (via ${o.referrer})`:""}`);
  if(o.workMode||o.location) L.push(`- Setup: ${[o.workMode,o.location].filter(Boolean).join(", ")}`);
  if(o.compMin||o.compMax) L.push(`- Comp target: ${(o.compMin?fmtMoney(o.compMin):"")}${o.compMax?"–"+fmtMoney(o.compMax):""}${o.compNotes?` (${o.compNotes})`:""}`);
  if(o.excitement) L.push(`- My excitement: ${o.excitement}/5`);
  const e=nextEvent(o); if(e) L.push(`- Next: ${e.label} on ${fmtDateTime(e.date,e.time)||fmtDate(e.date)}`);
  if(o.jobUrl) L.push(`- Job post: ${o.jobUrl}`);
  if((o.tags||[]).length) L.push(`- Tags: ${o.tags.join(", ")}`);
  if(o.product){ L.push(""); L.push(`## Company / product`); L.push(o.product); }
  if(o.vibes){ L.push(""); L.push(`## Vibes / culture read`); L.push(o.vibes); }
  if(o.notes){ L.push(""); L.push(`## My notes`); L.push(o.notes); }
  if((o.people||[]).length){ L.push(""); L.push(`## People I'm meeting`); o.people.forEach(p=>{ L.push(`- ${p.name}${p.title?` — ${p.title}`:""}${p.linkedin?` · ${p.linkedin}`:""}`); if(p.notes) L.push(`  notes: ${p.notes}`); }); }
  if((o.rounds||[]).length){ L.push(""); L.push(`## Interview rounds so far`); o.rounds.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(r=>{ L.push(`- ${r.name||r.type||"Round"}${r.date?` (${fmtDate(r.date)})`:""}${r.status==="done"?" — done":""}${r.rating?` — went ${r.rating}/5`:""}`); if(r.debrief) L.push(`  debrief: ${r.debrief}`); }); }
  if(o.jd){ L.push(""); L.push(`## Job description`); L.push(o.jd.length>4000?o.jd.slice(0,4000)+"\n…(trimmed)":o.jd); }
  else if(o.jdFile){ L.push(""); L.push(`## Job description`); L.push(`(attached as file: ${o.jdFile.name})`); }
  return L.join("\n");
}
function prepPrompt(o){
  const next=nextEvent(o);
  const who=(o.people||[]).map(p=>p.name+(p.title?` (${p.title})`:"")).join(", ");
  return buildBrief(o)+`\n\n---\nYou're my interview-prep coach. Based on the brief above, help me get ready for ${next?`my "${next.label}" round`:"my next round"} at ${o.company}.\n1) The 8 most likely questions they'll ask for this stage and role, with a crisp angle for how I should answer each — where a behavioral question fits one of my STAR stories below, name that story.\n2) 6 sharp, non-generic questions I should ask${who?` ${who}`:" them"} that show I've done my homework on the product.\n3) Two things to emphasize about my background to fit this role.\n\nHere's my background:\n${resumeText()}${storyBankText()}`;
}
function introPrompt(o){
  return buildBrief(o)+`\n\n---\nUsing the brief above, write me a warm, confident 30-second self-introduction to open this interview at ${o.company} — tailored to the role and what they care about. Keep it natural and spoken, not corporate. Then give me a 2-sentence shorter version for a recruiter screen.\n\nMy background:\n${resumeText()}`;
}
function researchPrompt(o,p){
  return `Help me prep to meet an interviewer. Research this person and give me: a short summary of their background and career path, what they likely care about / focus on in interviews, any common ground I might build rapport on, and 4 thoughtful questions I could ask them.\n\nPerson: ${p.name}${p.title?` — ${p.title}`:""} at ${o.company}\nLinkedIn: ${p.linkedin||"(none provided — search for them)"}\n${p.notes?`What I already know: ${p.notes}\n`:""}Role I'm interviewing for: ${o.role||"(role)"}. Use web search if you can.`;
}
function questionsPrompt(o){
  const next=nextEvent(o);
  return buildBrief(o)+`\n\n---\nUsing the brief above, give me 8 sharp, specific questions to ask${next?` in my "${next.label}" round`:""} at ${o.company} — the kind that show genuine research into their product, role and team, and help me judge whether this is the right fit. Group them: 3 on the role/team, 3 on the product/strategy, 2 on growth/culture. No generic filler.`;
}
function thankyouPrompt(o,r){
  const who=(r&&r.interviewers)||((o.people||[]).map(p=>p.name).join(", "));
  return `Write a concise, genuine thank-you email to send after my ${r?`"${r.name||r.type||"interview"}" round`:"interview"} at ${o.company}${o.role?` for the ${o.role} role`:""}.${who?` I met with ${who}.`:""}\nWarm and specific, not generic — reference the conversation at a high level and reaffirm my interest and fit. About 120 words. Start with a one-line subject ("Subject: …").${r&&r.debrief?`\n\nHow it went / what we covered: ${r.debrief}`:""}\n\nA little about me for voice:\n${resumeText()}`;
}

function coverLetterPrompt(o){
  return buildBrief(o)+`\n\n---\nUsing the brief and job description above, write me a focused, genuine cover letter for the ${o.role||"role"} at ${o.company}. ~250-300 words, specific to this company and role, showing fit and real motivation — not a generic template. Sound like me. Plain text, ready to send.\n\nMy résumé:\n${resumeText()}`;

let editorEl=null;
function openEditor(html){
  closeEditor();
  // Flex + margin:auto so the modal centers when it fits but, when it's taller than
  // the (dynamic, toolbar-aware) viewport, the overlay itself scrolls — keeping the top
  // (the X button) and bottom reachable instead of clipped off-screen on mobile.
  editorEl=el(`<div class="overlay show" id="editorOverlay" style="z-index:150;display:flex;justify-content:center;overflow:auto;-webkit-overflow-scrolling:touch;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))">
    <div class="card" style="width:min(540px,100%);margin:auto;padding:22px">${html}</div></div>`);
  document.body.appendChild(editorEl);
  // A stray tap on the backdrop used to bin whatever you'd typed. Now it only closes when there's
  // nothing to lose; if there is, it asks. The ✕ and Cancel buttons still close outright.
  editorEl.addEventListener("click",e=>{ if(e.target===editorEl) tryCloseEditor(); });
  snapshotEditor();
  const f=editorEl.querySelector("input,textarea,select"); if(f) setTimeout(()=>f.focus(),50);
}
// remember what every field looked like when the screen appeared, so "changed" means changed
function snapshotEditor(){
  if(!editorEl) return;
  editorEl.querySelectorAll("input,textarea,select").forEach(el=>{
    if(el.type==="file"||el.type==="button") return;
    el.dataset.initial = el.type==="checkbox"||el.type==="radio" ? (el.checked?"1":"") : (el.value||"");
  });
}
function editorDirty(){
  if(!editorEl) return false;
  return [...editorEl.querySelectorAll("input,textarea,select")].some(el=>{
    if(el.type==="file"||el.type==="button"||el.dataset.initial===undefined) return false;
    const now = el.type==="checkbox"||el.type==="radio" ? (el.checked?"1":"") : (el.value||"");
    return now !== el.dataset.initial;
  });
}
function tryCloseEditor(){
  if(!editorDirty()) return closeEditor();
  if(confirm("You've typed something here that hasn't been saved.\n\nOK to discard it — Cancel to keep editing.")) closeEditor();
}
function closeEditor(){ if(typeof capStopVoice==="function") capStopVoice(); if(editorEl){ editorEl.remove(); editorEl=null; } }

create table if not exists vaults (

  data jsonb not null,
  updated_at bigint not null default 0
);
alter table vaults enable row level security;

create or replace function get_vault(p_code text)
returns setof vaults language sql security definer set search_path = public as $$

$$;

create or replace function set_vault(p_code text, p_data jsonb, p_updated bigint)

begin

end;

/* ============================ SMART PASTE (AI ingest) ============================ */
// Paste a calendar invite / recruiter email / job post / LinkedIn profile → a suggested entry.
// Engine is pluggable: Supabase proxy (key server-side) → direct provider key (browser) →
// copy-paste fallback (any chatbot, no key). Config is device-local, never synced, never in repo.
const AI_KEY="callback_ai_cfg_v1";
let aiCfg=(function(){ try{ return JSON.parse(localStorage.getItem(AI_KEY))||{}; }catch(e){ return {}; } })();
function saveAICfg(){ try{ localStorage.setItem(AI_KEY, JSON.stringify(aiCfg)); }catch(e){} }
function aiProxyUrl(){ if(aiCfg.proxyUrl) return aiCfg.proxyUrl.trim();
  if(sync.url) return sync.url.trim().replace(/\/+$/,"").replace(/\/rest\/v1$/,"")+"/functions/v1/ai"; return ""; }
// effective engine after checking requirements; falls back to copy-paste
function aiEngine(){
  const e=aiCfg.engine||"google";   // Gemini is the default — free tier, broad reach
  if(e==="off") return "off";
  if(e==="proxy") return aiProxyUrl()?"proxy":"paste";
  if(e==="anthropic") return aiCfg.key?"anthropic":"paste";
  if(e==="openai") return aiCfg.key?"openai":"paste";
  if(e==="groq") return aiKey()?"groq":"paste";
  if(e==="google") return aiKey()?"google":"paste";
  return "paste";
}
/* Free-tier keys (Gemini, Groq) can ride along in your own synced vault so you set them up once
   instead of on every device. Paid keys are attached to a card, so they stay on the device where
   you entered them and are never written into the document that syncs. */
const FREE_ENGINES=["google","groq"];
function engineIsFree(e){ return FREE_ENGINES.includes(e||aiCfg.engine||"google"); }
// the key in play: this device's, or the synced one if this device hasn't got its own
function aiKey(){
  if(aiCfg.key) return aiCfg.key;
  const sh=state.ai;
  if(sh&&sh.key&&sh.engine===(aiCfg.engine||"google")&&engineIsFree(sh.engine)) return sh.key;
  return "";
}
/* Syncing the key was only half the promise. A second device starts on the default engine, so a
   synced Groq key sat in the document and was refused for not matching — the key was there and the
   app still said "connect an AI". A device with no key of its own now adopts the whole synced
   setup (engine, key, model) so it genuinely just works, and the settings screen shows it. A device
   that has its own key is never touched. */
function adoptSyncedAI(){
  const sh=state.ai;
  if(!sh||!sh.key||!engineIsFree(sh.engine)) return false;
  if(aiCfg.key) return false;                       // this device already has its own
  if(aiCfg.engine===sh.engine && aiCfg.key===sh.key) return false;
  aiCfg.engine=sh.engine; aiCfg.key=sh.key; aiCfg.model=sh.model||"";
  saveAICfg();
  return true;
}
function aiSyncOn(){ return aiCfg.syncKey!==false; }   // opt-out, on by default for free engines
// providers that can read an uploaded PDF directly
function engineReadsPDF(){ return ["proxy","anthropic","google"].includes(aiEngine()); }
const AI_SCHEMA=`Return ONLY a JSON object (no markdown, no commentary) with exactly these keys:
{
 "company": "",            // employer name; "" if unknown
 "role": "",               // job title; "" if unknown
 "kind": "interview",      // one of: interview, task, offer, contact, application, other
 "round": null,            // or { "name":"", "type":"", "date":"YYYY-MM-DD", "time":"HH:MM", "interviewers":"", "link":"" }
 "person": null,           // or { "name":"", "title":"", "linkedin":"", "email":"", "notes":"" }
 "source": "",             // how it came about (recruiter, referral, job board…)
 "location": "",
 "workMode": "",           // Remote, Hybrid, or Onsite
 "compNote": "",           // any pay info mentioned
 "nextActionLabel": "",    // a suggested next step

 "notes": ""               // 1–3 sentences of anything else useful
}`;
function aiPrompt(text){
  return `You extract structured job-search data. Today is ${todayYMD()}. The pasted content below may be a calendar invite, a recruiter or interview email, a job posting, or a LinkedIn / contact profile. Pull the details into the exact JSON schema. Resolve relative dates (e.g. "next Tuesday", "tomorrow 3pm") to absolute YYYY-MM-DD / 24h HH:MM using today's date. Use "" (or null for round/person) for anything not stated — never invent. If it is about a person/contact rather than a role, fill "person" and leave "round" null.

${AI_SCHEMA}

--- PASTED CONTENT ---
${text}
--- END ---`;
}
function aiParse(s){
  if(!s) throw new Error("Empty response");
  let t=String(s).trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  const a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a>=0&&b>a) t=t.slice(a,b+1);
  return JSON.parse(t);
}
// prompt + optional doc {data:base64-no-prefix, mime}; opts.json=false for prose (default JSON)
async function aiCall(prompt, doc, opts){
  const eng=aiEngine(); const wantJson = !(opts&&opts.json===false); const maxTok=(opts&&opts.maxTokens)||(doc?2048:wantJson?1024:1400);
  if(eng==="proxy"){
    const res=await fetch(aiProxyUrl(),{method:"POST",headers:Object.assign({"Content-Type":"application/json"}, sync.key?{Authorization:"Bearer "+sync.key, apikey:sync.key}:{}), body:JSON.stringify({prompt,doc:doc||undefined,maxTokens:maxTok,json:wantJson})});
    if(!res.ok) throw new Error("Proxy "+res.status+" "+(await res.text()).slice(0,140));
    const j=await res.json(); return j.text||j.output||(typeof j==="string"?j:JSON.stringify(j));
  }
  if(eng==="anthropic"){
    const content = doc ? [{type:"document",source:{type:"base64",media_type:doc.mime||"application/pdf",data:doc.data}},{type:"text",text:prompt}] : prompt;
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":aiCfg.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:aiCfg.model||"claude-haiku-4-5",max_tokens:maxTok,messages:[{role:"user",content}]})});
    if(!res.ok) throw new Error("Claude "+res.status+" "+(await res.text()).slice(0,180));
    const j=await res.json(); return (j.content||[]).map(b=>b.text||"").join("");
  }
  if(eng==="openai"){
    const model=aiCfg.model||"gpt-4o-mini";
    const body={model,messages:[{role:"user",content:prompt}],max_tokens:maxTok};
    if(wantJson) body.response_format={type:"json_object"};
    const res=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+aiCfg.key},body:JSON.stringify(body)});
    if(!res.ok){ const tx=(await res.text()).slice(0,300);
      if(res.status===429){
        if(/insufficient_quota|exceeded your current quota|billing/i.test(tx)) throw new Error("Your OpenAI API account has no credits. Note: the API is billed SEPARATELY from ChatGPT Plus — add a payment method / credits at platform.openai.com → Settings → Billing. (Or use Gemini's free tier instead.)");
        throw new Error("OpenAI rate limit — wait a few seconds and retry.");
      }
      if(res.status===401) throw new Error("That OpenAI key looks invalid — re-copy it from platform.openai.com/api-keys.");
      throw new Error("OpenAI "+res.status+" "+tx); }
    const j=await res.json(); return (((j.choices||[])[0]||{}).message||{}).content||"";
  }
  if(eng==="groq"){
    // OpenAI-compatible, free tier (runs Llama). Model fallback guards against renames.
    const models=[aiCfg.model||"llama-3.3-70b-versatile","llama-3.1-8b-instant"].filter((m,i,a)=>m&&a.indexOf(m)===i);
    const base={messages:[{role:"user",content:prompt}],max_tokens:maxTok}; if(wantJson) base.response_format={type:"json_object"};
    let res,lastStatus=0,lastErr="";
    for(const model of models){
      res=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+aiKey()},body:JSON.stringify(Object.assign({model},base))});
      if(res.ok) break; lastStatus=res.status; lastErr=(await res.text()).slice(0,200);
      if(![404,400].includes(res.status)) break;
    }
    if(!res||!res.ok){
      if(lastStatus===429) throw new Error("Groq rate limit — wait a few seconds and retry (the free tier resets quickly).");
      if(lastStatus===401) throw new Error("That Groq key looks invalid — re-copy it from console.groq.com/keys.");
      throw new Error("Groq "+lastStatus+" "+lastErr);
    }
    const j=await res.json(); return (((j.choices||[])[0]||{}).message||{}).content||"";
  }
  if(eng==="google"){
    const parts = doc ? [{inline_data:{mime_type:doc.mime||"application/pdf",data:doc.data}},{text:prompt}] : [{text:prompt}];
    const genCfg = wantJson ? {responseMimeType:"application/json",maxOutputTokens:maxTok} : {maxOutputTokens:maxTok};
    const body=JSON.stringify({contents:[{parts}],generationConfig:genCfg});
    // try the chosen/default model, then fall back to others. Each free-tier model has its OWN
    // quota, so on a 429 (or a model rename = 404/400) we try the next one before giving up.
    const models=[aiCfg.model||"gemini-2.0-flash","gemini-1.5-flash","gemini-2.0-flash-lite"].filter((m,i,a)=>m&&a.indexOf(m)===i);
    let res,lastStatus=0,lastErr="";
    for(const model of models){
      res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(aiKey())}`,{method:"POST",headers:{"Content-Type":"application/json"},body});
      if(res.ok) break;
      lastStatus=res.status; lastErr=(await res.text()).slice(0,160);
      if(![404,400,429].includes(res.status)) break; // model-not-found or quota → try the next model
    }
    if(!res||!res.ok){
      if(lastStatus===429) throw new Error("Gemini's free limit was hit. Free keys reset per-minute (and daily) — wait a bit and retry. For uninterrupted use, enable billing on your key (Flash stays ~free at low volume) or paste a different key in Settings.");
      if(lastStatus===400 && /API key/i.test(lastErr)) throw new Error("That Gemini key looks invalid — re-copy it from aistudio.google.com/apikey.");
      throw new Error("Gemini "+lastStatus+" "+lastErr);
    }
    const j=await res.json(); return ((((j.candidates||[])[0]||{}).content||{}).parts||[{}])[0].text||"";
  }
  throw new Error("paste-mode");
}

/* ---- Reading a job posting from a URL ----
   A browser can't just fetch another site: without CORS headers the request dies before we see
   it. So we go through public readers that do send them. Any one of them can be rate-limited,
   key-walled or blocked by the target site on any given day, so we try several and, if they all
   fail, say WHICH thing failed instead of one shrug of an error message.
   NB: only CORS-safelisted request headers here (Accept is fine). Adding something like
   x-return-format triggers a preflight most of these hosts don't answer, breaking every fetch. */
const URL_READERS = [
  { name:"Jina Reader", to:u=>"https://r.jina.ai/"+u,                                        parse:t=>t },
  { name:"AllOrigins",  to:u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),    parse:htmlToText },
  { name:"CodeTabs",    to:u=>"https://api.codetabs.com/v1/proxy/?quest="+encodeURIComponent(u), parse:htmlToText },
  { name:"direct",      to:u=>u,                                                             parse:htmlToText },
];
// strip a page down to the words, and lift the structured job data most boards embed
function htmlToText(html){
  if(!html) return "";
  if(!/<[a-z!]/i.test(html)) return html;                       // already plain text
  let doc; try{ doc=new DOMParser().parseFromString(html,"text/html"); }catch(e){ return html; }
  const head=[];
  const title=(doc.querySelector("title")||{}).textContent; if(title) head.push(title.trim());
  const md=doc.querySelector('meta[name="description"],meta[property="og:description"]');
  if(md&&md.content) head.push(md.content.trim());
  head.push(...jsonLdJobs(doc));
  doc.querySelectorAll("script,style,noscript,svg,iframe,nav,footer,header,form").forEach(n=>n.remove());
  const main=doc.querySelector("main,article,[role=main]")||doc.body;
  const body=((main&&main.textContent)||"").replace(/[ \t ]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
  return (head.filter(Boolean).join("\n")+"\n\n"+body).trim();
}
// schema.org JobPosting — title, company, salary and description, already structured
function jsonLdJobs(doc){
  const out=[];
  doc.querySelectorAll('script[type="application/ld+json"]').forEach(s=>{
    let data; try{ data=JSON.parse(s.textContent); }catch(e){ return; }
    const walk=n=>{
      if(!n||typeof n!=="object") return;
      if(Array.isArray(n)) return n.forEach(walk);
      if(n["@graph"]) walk(n["@graph"]);
      if(String(n["@type"]||"").includes("JobPosting")){
        const org=n.hiringOrganization&&(n.hiringOrganization.name||n.hiringOrganization);
        const loc=n.jobLocation&&JSON.stringify(n.jobLocation).match(/"addressLocality":"([^"]+)"/);
        const pay=n.baseSalary&&JSON.stringify(n.baseSalary).match(/"(?:minValue|value)":\s*"?([\d.]+)/);
        out.push(["JOB POSTING",
          n.title&&("Title: "+n.title), org&&("Company: "+org),
          loc&&("Location: "+loc[1]), n.employmentType&&("Type: "+n.employmentType),
          pay&&("Pay: "+pay[1]), n.datePosted&&("Posted: "+n.datePosted),
          n.description&&("Description: "+String(n.description).replace(/<[^>]+>/g," ").replace(/\s+/g," ").slice(0,6000))
        ].filter(Boolean).join("\n"));
      }
      Object.values(n).forEach(v=>{ if(v&&typeof v==="object") walk(v); });
    };
    walk(data);
  });
  return out;
}
// try each reader in turn; resolves {text, via} or throws with .tried for a useful message
async function readUrlText(url, onStep){
  const tried=[];
  for(const r of URL_READERS){
    if(onStep) onStep(r.name);
    const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),15000);
    try{
      const res=await fetch(r.to(url),{headers:{Accept:"text/plain, text/html;q=0.9, */*;q=0.8"},signal:ctl.signal});
      clearTimeout(timer);
      if(!res.ok){ tried.push({name:r.name,status:res.status}); continue; }
      const raw=await res.text();
      const text=(r.parse(raw)||"").trim();
      if(text.length<120){ tried.push({name:r.name,status:"empty"}); continue; }
      return {text, via:r.name};
    }catch(e){
      clearTimeout(timer);
      tried.push({name:r.name,status:e.name==="AbortError"?"timeout":"blocked"});
    }
  }
  const err=new Error("no reader could fetch that page"); err.tried=tried; throw err;
}
// job sites that simply won't be read by anything but a logged-in browser
const WALLED=/(^|\.)(linkedin|indeed|glassdoor|ziprecruiter|dice|monster)\.(com|co\.[a-z]{2}|[a-z]{2})$/i;
// turn the pile of attempts into one sentence a person can act on
function readFailMessage(tried,url){
  const s=tried.map(x=>x.status);
  const n=v=>s.filter(x=>x===v).length;
  let host=""; try{ host=new URL(url||"").hostname.replace(/^www\./,""); }catch(e){}
  if(host&&WALLED.test(host)) return `${host.split(".")[0].replace(/^./,c=>c.toUpperCase())} only shows job posts to a signed-in browser, so nothing can read that link from here.`;
  if(s.length&&s.every(x=>x==="blocked"||x==="timeout")) return "Your browser couldn't reach any of the page readers — check your connection, or a network/extension may be blocking them.";
  if(s.length&&s.every(x=>x==="empty")) return "That page loaded but had no readable text — it's probably drawn by JavaScript after a login.";
  const walls=n(403)+n(451), limits=n(429), keys=n(401)+n(402);
  if(walls&&walls>=limits&&walls>=keys) return "That site turns away automated readers — job boards behind a login usually do.";
  if(limits&&limits>=keys) return "The free page readers are rate-limited right now. Waiting a minute usually clears it.";
  if(keys) return "The page readers are asking for an API key today.";
  return "None of the page readers could open that link.";
}

/* ============================ COMPANY ENRICH (logo + pre-call brief) ============================ */
// When you're juggling 3-5 live processes, instant visual ID matters. We pull a real company
// logo + canonical domain (Clearbit autocomplete — free, no key) and an AI pre-call brief
// (tagline + ~120-word snapshot). Results cache on the opportunity (o.logo/o.domain/o.tagline/
// o.research) so they sync and never re-fetch. Logo works with zero config; brief uses aiEngine().
async function resolveCompany(name){
  if(!name) return null;
  try{
    const r=await fetch("https://autocomplete.clearbit.com/v1/companies/suggest?query="+encodeURIComponent(name));
    if(!r.ok) return null;
    const arr=await r.json();
    if(Array.isArray(arr)&&arr.length){ const m=arr[0]; return {domain:m.domain||"", logo:m.logo||(m.domain?"https://logo.clearbit.com/"+m.domain:"")}; }
  }catch(e){}
  return null;
}
async function enrichLogo(o){
  if(!o||!o.company) return false;
  if(o.domain && o.logo) return false;        // already resolved
  const m=await resolveCompany(o.company);
  if(m && m.domain){ o.domain=o.domain||m.domain; o.logo=o.logo||m.logo; o.updatedAt=Date.now(); return true; }
  return false;
}

/* ============================ NATIVE (Capacitor iOS) ============================ */
// Everything here is guarded by isNative() so the web/PWA build is unaffected. Plugins are
// reached through the Capacitor bridge global (window.Capacitor.Plugins.*) — no bundler needed.
// Setup + the iOS Share Extension live in NATIVE.md. Calls are defensive: a missing/renamed
// plugin surfaces a toast, never a crash.
const APP_GROUP="group.com.scheidelholdings.callback";
function cap(){ return (typeof window!=="undefined") && window.Capacitor; }
function isNative(){ const c=cap(); return !!(c && c.isNativePlatform && c.isNativePlatform()); }
function plugin(){ const c=cap(); if(!c||!c.Plugins) return null; for(const n of arguments){ if(c.Plugins[n]) return c.Plugins[n]; } return null; }

function initNative(){
  if(!isNative()) return;
  try{ initShareIntake(); }catch(e){}
  scheduleRemindersSoon();
}

/* ---- Share-into-app: a recruiter email / LinkedIn profile shared into Meanwhile ---- */
function handleSharedText(text){ if(!text||!String(text).trim()) return; spText=String(text); openSmartPaste(true); }
async function initShareIntake(){
  const App=plugin("App");
  if(App && App.addListener){
    App.addListener("appUrlOpen", (d)=>{ try{ const u=new URL(d.url); const t=u.searchParams.get("text")||u.searchParams.get("url")||""; if(t) handleSharedText(decodeURIComponent(t)); }catch(e){} });
    App.addListener("resume", ()=>{ checkSharedInbox(); });
  }
  const Prefs=plugin("Preferences");
  if(Prefs && Prefs.configure){ try{ await Prefs.configure({group:APP_GROUP}); }catch(e){} }
  checkSharedInbox();
}
async function checkSharedInbox(){
  const Prefs=plugin("Preferences"); if(!Prefs) return;
  try{ const {value}=await Prefs.get({key:"shared_intake"}); if(value){ await Prefs.remove({key:"shared_intake"}); handleSharedText(value); } }catch(e){}
}

/* ---- Local-notification reminders for rounds / next steps / offer deadlines ---- */
function remAt(d,t,offMin){ const [y,m,dd]=String(d).split("-").map(Number); let [hh,mm]=String(t||"09:00").split(":").map(Number); const dt=new Date(y,(m||1)-1,dd||1,hh||9,mm||0); return dt.getTime()+(offMin||0)*60000; }
let remTimer=null;
function scheduleRemindersSoon(){ if(!isNative()||!aiCfg.reminders) return; clearTimeout(remTimer); remTimer=setTimeout(syncReminders,1500); }
async function syncReminders(){
  if(!isNative()||!aiCfg.reminders) return;
  const LN=plugin("LocalNotifications"); if(!LN) return;
  try{
    const perm = LN.checkPermissions? await LN.checkPermissions() : {display:"granted"};
    if(perm.display!=="granted") return;
    try{ const pend=await LN.getPending(); if(pend&&pend.notifications&&pend.notifications.length) await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))}); }catch(e){}
    const notes=[]; let id=1; const now=Date.now();
    state.opportunities.forEach(o=>{
      (o.rounds||[]).forEach(r=>{ if(r.date && r.status!=="done" && r.status!=="cancelled"){ const at=remAt(r.date,r.time,r.time?-60:0); if(at>now) notes.push({id:id++,title:`${o.company} — ${r.name||r.type||"interview"}`,body:r.time?`Starts at ${r.time}`:"Today",schedule:{at:new Date(at)}}); } });
      if(o.nextActionDate){ const at=remAt(o.nextActionDate,"09:00",0); if(at>now) notes.push({id:id++,title:`${o.company}: ${o.nextActionLabel||"Next step"}`,body:"Due today",schedule:{at:new Date(at)}}); }
      if(o.offer&&o.offer.deadline){ const at=remAt(o.offer.deadline,"09:00",0); if(at>now) notes.push({id:id++,title:`${o.company}: offer decision`,body:"Decision deadline today",schedule:{at:new Date(at)}}); }
    });
    if(notes.length) await LN.schedule({notifications:notes.slice(0,60)});
  }catch(e){}
}
async function enableReminders(){
  if(!isNative()){ toast("Reminders are available in the iOS app"); return; }
  const LN=plugin("LocalNotifications"); if(!LN){ toast("Install @capacitor/local-notifications"); return; }
  try{ const p=await LN.requestPermissions(); if(p.display!=="granted"){ toast("Notifications not allowed"); return; }
    aiCfg.reminders=true; saveAICfg(); await syncReminders(); toast("Reminders on ✓"); }catch(e){ toast("⚠ "+e.message); }
}

/* ---- On-device calendar scan → Smart add ---- */
function looksLikeInterview(e){ const s=((e.title||"")+" "+(e.notes||"")).toLowerCase(); return /interview|screen(ing)?|onsite|on-site|recruiter|phone screen|hiring|hr call|technical|panel|final round/.test(s); }
async function scanCalendar(){
  if(!isNative()){ toast("Calendar scan is available in the iOS app"); return; }
  const Cal=plugin("CapacitorCalendar","Calendar"); if(!Cal){ toast("Install @ebarooni/capacitor-calendar"); return; }
  try{
    try{ if(Cal.requestFullCalendarAccess) await Cal.requestFullCalendarAccess(); else if(Cal.requestPermissions) await Cal.requestPermissions(); }catch(e){}
    const from=Date.now(), to=from+1000*60*60*24*30; let res;
    if(Cal.listEventsInRange) res=await Cal.listEventsInRange({from,to});
    else if(Cal.getEvents) res=await Cal.getEvents({startDate:from,endDate:to});
    else throw new Error("calendar API not recognized");
    const list=(res.result||res.events||res.data||[]).map(e=>({title:e.title||e.summary||"",notes:e.notes||e.description||"",location:e.location||"",start:e.startDate||e.start||e.eventStartDate}));
    const hits=list.filter(looksLikeInterview);
    if(!hits.length){ toast("No interview-like events in the next 30 days"); return; }
    spText=hits.map(e=>`${e.title}\n${e.notes}\n${e.location}\n${e.start?new Date(e.start).toString():""}`).join("\n--- next event ---\n");
    openSmartPaste(true);
  }catch(e){ toast("⚠ Calendar: "+e.message); }
}

/* ---- Pull a contact's details + photo into the open person form ---- */
async function pullContactInto(){
  if(!isNative()){ toast("Contacts is available in the iOS app"); return; }
  const C=plugin("Contacts","CapacitorContacts"); if(!C){ toast("Install @capacitor-community/contacts"); return; }
  const nameInp=document.querySelector('#personForm [name="name"]'); const q=(nameInp?nameInp.value:"").trim();
  if(!q){ toast("Type a name first"); return; }
  try{
    if(C.requestPermissions) await C.requestPermissions();
    const res=await C.getContacts({projection:{name:true,emails:true,urls:true,image:true,organization:true}});
    const list=res.contacts||res.result||[];
    const disp=c=>(c.name&&(c.name.display||c.displayName))||c.displayName||"";
    const hit=list.find(c=>disp(c).toLowerCase().includes(q.toLowerCase()));
    if(!hit){ toast("No matching contact"); return; }
    const set=(n,v)=>{ const el=document.querySelector(`#personForm [name="${n}"]`); if(el&&v&&!el.value) el.value=v; };
    set("name",disp(hit));
    set("email",(hit.emails&&hit.emails[0]&&(hit.emails[0].address||hit.emails[0].value))||"");
    set("title",(hit.organization&&(hit.organization.company||hit.organization.jobTitle))||"");
    set("linkedin",(hit.urls&&hit.urls[0]&&(hit.urls[0].url||hit.urls[0].value))||"");
    const img=(hit.image&&(hit.image.base64String||hit.image.base64))||hit.photoThumbnail||"";
    // photos render inline all over the app, so they stay in state — as a thumbnail, not a 3MB original
    if(img){ const ph=document.querySelector('#personForm [name="photo"]');
      if(ph) ph.value=await shrinkImage(img.startsWith("data:")?img:("data:image/jpeg;base64,"+img),128); }
    toast("Pulled from Contacts ✓");
  }catch(e){ toast("⚠ Contacts: "+e.message); }
}

function fd(form){ const d={}; new FormData(form).forEach((v,k)=>d[k]=typeof v==="string"?v.trim():v); return d; }
function saveOpForm(form){
  const d=fd(form);
  if(!d.company){ toast("Company name is required"); return; }
  d.tags=d.tags?d.tags.split(",").map(s=>s.trim()).filter(Boolean):[];
  d.excitement=+d.excitement||0;
  if(d.jdFile){ try{ d.jdFile=JSON.parse(d.jdFile); }catch(e){ delete d.jdFile; } } else { d.jdFile=null; }
  // a manually-entered company website drives the logo (and stops the auto-guess overriding it)
  d.domain=(d.domain||"").trim().replace(/^https?:\/\//,"").replace(/^www\./,"").replace(/\/.*$/,"");
  d.logo = d.domain ? "https://logo.clearbit.com/"+d.domain : "";
  const editId=editorEl&&editorEl.dataset.editId;
  const existing=editId?state.opportunities.find(o=>o.id===editId):null;
  if(existing){ Object.assign(existing,d,{updatedAt:Date.now()}); openId=existing.id; }
  else { const o={id:uid(),createdAt:Date.now(),updatedAt:Date.now(),rounds:[],people:[],offer:{},...d}; state.opportunities.push(o); openId=o.id; }
  save(); closeEditor(); render();
  if(getOp()){ if(!$("#drawer").classList.contains("show")) openDetail(openId); else renderDrawer(); }
  enrichLater(getOp());
  toast("Saved");
}
// Spin a round's free-text interviewers into People records (dedup by name); returns count added
function linkInterviewers(o, str){
  if(!str) return 0; o.people=o.people||[]; let added=0;
  String(str).split(/,|;|&|\band\b/i).forEach(part=>{
    let s=part.trim(); if(s.length<2) return;
    let title=""; const m=s.match(/^(.*?)\s*\(([^)]+)\)\s*$/); if(m){ s=m[1].trim(); title=m[2].trim(); }
    if(!s || s.length<2) return;
    if(o.people.some(p=>(p.name||"").trim().toLowerCase()===s.toLowerCase())) return;
    o.people.push({id:uid(),name:s,title,linkedin:"",email:"",notes:""}); added++;
  });
  return added;
}
function saveRoundForm(form){
  const d=fd(form); const o=getOp(); o.rounds=o.rounds||[];
  d.rating=+d.rating||0;
  const editId=editorEl&&editorEl.dataset.editId;
  if(editId){ Object.assign(o.rounds.find(r=>r.id===editId),d); }
  else { o.rounds.push({id:uid(),...d}); }
  const added=linkInterviewers(o, d.interviewers);
  o.updatedAt=Date.now(); save(); closeEditor(); renderDrawer(); render(); toast(added?`Round saved · +${added} to People`:"Round saved");
}
function savePersonForm(form){
  const d=fd(form); if(!d.name){ toast("Name required"); return; }
  const o=getOp(); o.people=o.people||[];
  const editId=editorEl&&editorEl.dataset.editId;
  if(editId){ Object.assign(o.people.find(p=>p.id===editId),d); }
  else { o.people.push({id:uid(),...d}); }
  o.updatedAt=Date.now(); save(); closeEditor(); renderDrawer(); toast("Saved");
}

/* ============================ IMPORT / EXPORT ============================ */
// A backup has to be the whole thing, so attachments are re-inlined into the file on the way out
async function exportData(){
  const snap=JSON.parse(JSON.stringify(state));
  const pairs=[[snap.resume&&snap.resume.file, state.resume&&state.resume.file]];
  snap.opportunities.forEach((o,i)=>pairs.push([o.jdFile, state.opportunities[i]&&state.opportunities[i].jdFile]));
  for(const [copy,orig] of pairs){
    if(!copy||!orig||copy.data) continue;
    const bytes=await fileBytes(orig);
    if(bytes){ copy.data=bytes; delete copy.ref; }
  }
  const blob=new Blob([JSON.stringify(snap,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  const d=new Date(); a.download=`meanwhile-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
  a.click();
  devPrefs.lastExport=Date.now(); saveDev();
  if(view==="dashboard"||view==="work") render();
  toast("Backup downloaded");
}
function importFile(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=async()=>{ try{ const data=JSON.parse(r.result);
    if(!data.opportunities) throw 0;
    if(state.opportunities.length && !confirm("Replace your current data with this backup? (Export first if unsure.)")) return;
    state=migrate(data); persist();
    await migrateFilesToIDB();   // put any inlined attachments back in the file vault
    save(); render(); toast("Imported "+data.opportunities.length+" roles");
  }catch(e){ toast("⚠ That file didn't look like a Meanwhile backup"); } };
  r.readAsText(file);
}

/* ============================ COPY / TOAST ============================ */
function copy(text,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>toast(msg||"Copied"),()=>fallbackCopy(text,msg)); }
  else fallbackCopy(text,msg);
}
function fallbackCopy(text,msg){ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); toast(msg||"Copied");}catch(e){toast("Press ⌘/Ctrl+C to copy");} ta.remove(); }
let toastT;
function toast(msg){ const t=$("#toast"); t.innerHTML=`${I.check}<span>${esc(msg)}</span>`; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }

/* ============================ FILES (JD / résumé attachments) ============================
   Attachments used to be base64 inside the one localStorage key, where a single 2MB PDF ate
   more than half the 5MB budget and got pushed to the cloud on every keystroke-triggered save.
   The bytes now live in IndexedDB (hundreds of MB, same origin, same device) and `state` keeps
   only {name,type,size,ref}. Records with a legacy inline `data` still work and are migrated on
   boot. Exports re-inline the bytes so a backup file is still a complete backup. */
const IDB_NAME="meanwhile_files", IDB_STORE="files";
let idbPromise=null;
function idb(){
  if(idbPromise) return idbPromise;
  idbPromise=new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error("no IndexedDB"));
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error||new Error("IndexedDB blocked"));
  });
  return idbPromise;
}
function idbTx(mode,fn){ return idb().then(db=>new Promise((res,rej)=>{
  const t=db.transaction(IDB_STORE,mode), q=fn(t.objectStore(IDB_STORE));
  t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
})); }
const idbPut=(k,v)=>idbTx("readwrite",s=>s.put(v,k));
const idbGet=k=>idbTx("readonly",s=>s.get(k));
const idbDel=k=>idbTx("readwrite",s=>s.delete(k));
const idbKeys=()=>idbTx("readonly",s=>s.getAllKeys());

function readAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
// → {name,type,size,ref} with the bytes in IndexedDB; falls back to inline if IDB is unavailable
async function fileToData(file){
  const dataURL=await readAsDataURL(file);
  const meta={name:file.name,type:file.type||"application/octet-stream",size:file.size};
  try{ const ref="f_"+uid(); await idbPut(ref,dataURL); return Object.assign(meta,{ref}); }
  catch(e){ return Object.assign(meta,{data:dataURL}); }
}
// the actual bytes for a file record, wherever they live
async function fileBytes(f){
  if(!f) return "";
  if(f.data) return f.data;
  if(f.ref){ try{ return (await idbGet(f.ref))||""; }catch(e){ return ""; } }
  return "";
}
async function downloadData(f){
  const data=await fileBytes(f);
  if(!data){ toast("That file was attached on another device"); return; }
  const a=document.createElement("a"); a.href=data; a.download=(f&&f.name)||"file"; document.body.appendChild(a); a.click(); a.remove();
}
function fileSizeStr(n){ if(!n) return ""; return n<1024?n+" B":n<1048576?(n/1024).toFixed(0)+" KB":(n/1048576).toFixed(1)+" MB"; }
// every file record currently referenced anywhere in state
function allFileRecords(){
  const out=[];
  if(state.resume&&state.resume.file) out.push(state.resume.file);
  state.opportunities.forEach(o=>{ if(o.jdFile) out.push(o.jdFile); });
  return out.filter(Boolean);
}
// one-time move of legacy inline attachments into IndexedDB, then drop the fat from state
async function migrateFilesToIDB(){
  const legacy=allFileRecords().filter(f=>f.data&&!f.ref);
  if(!legacy.length) return;
  let moved=0;
  for(const f of legacy){
    try{ const ref="f_"+uid(); await idbPut(ref,f.data); f.ref=ref; delete f.data; moved++; }catch(e){ break; }
  }
  if(moved){ persist(); schedulePush(); }
}
// blobs whose record is gone (a cancelled form, a deleted role) don't get to squat forever
async function sweepOrphanFiles(){
  try{
    const keys=await idbKeys(); if(!keys||!keys.length) return;
    const live=new Set(allFileRecords().map(f=>f.ref).filter(Boolean));
    for(const k of keys){ if(!live.has(k)) await idbDel(k); }
  }catch(e){}
}
// generic file picker: bytes go to IndexedDB, the hidden form input carries only the metadata
async function pickFileInto(field, accept){
  const inp=document.createElement("input"); inp.type="file"; if(accept) inp.accept=accept;
  inp.onchange=async()=>{ const file=inp.files[0]; if(!file) return;
    if(file.size>12*1024*1024){ toast("⚠ File too big (max 12MB)"); return; }
    const f=await fileToData(file);
    const hidden=document.querySelector(`[name="${field}"]`); if(hidden) hidden.value=JSON.stringify(f);
    const lbl=document.querySelector(`[data-filename="${field}"]`); if(lbl) lbl.innerHTML=`📎 ${esc(f.name)} <span style="color:var(--faint)">${fileSizeStr(f.size)}</span> · <span data-clearfile="${field}" style="color:var(--bad);cursor:pointer">remove</span>`;
  };
  inp.click();
}
// contact photos stay inline (they're rendered in a dozen places) so they get shrunk to a thumbnail
function shrinkImage(dataURL, max){
  max=max||128;
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const s=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",0.72));
      }catch(e){ res(dataURL); }
    };
    img.onerror=()=>res(dataURL);
    img.src=dataURL;
  });
}

// in-app, and export a clean PDF via the browser print pipeline (no libraries). The structured
// data lives on state.resume.data (synced); resumeText() derives the plain text used by AI briefs.
function resumeText(){
  const d=state.resume&&state.resume.data;
  let s = (d && (d.name||d.summary||(d.experience&&d.experience.length))) ? resumeDerivedText(d)
        : (state.resume && state.resume.text && state.resume.text.trim()) ? state.resume.text.trim()
        : "[PASTE YOUR RESUME / SUMMARY HERE]";
  return s.length>4000 ? s.slice(0,4000)+"\n…(trimmed)" : s;  // keep prompts lean for free-tier limits/cost
}
function resumeDerivedText(d){
  const L=[]; if(d.name) L.push(d.name); if(d.title) L.push(d.title);
  const c=d.contact||{}; const cl=[c.email,c.phone,c.location,c.linkedin,c.website].filter(Boolean).join(" · "); if(cl) L.push(cl);
  if(d.summary){ L.push("","SUMMARY",d.summary); }
  if((d.experience||[]).length){ L.push("","EXPERIENCE"); d.experience.forEach(x=>{ const head=[x.role,x.company].filter(Boolean).join(" — "); const dt=[x.start,x.end].filter(Boolean).join("–"); L.push(head+(dt?"  ("+dt+")":"")+(x.location?"  · "+x.location:"")); (x.bullets||[]).forEach(b=>L.push("• "+b)); }); }
  if((d.education||[]).length){ L.push("","EDUCATION"); d.education.forEach(x=>{ const dt=[x.start,x.end].filter(Boolean).join("–"); L.push([x.degree,x.school].filter(Boolean).join(", ")+(dt?"  ("+dt+")":"")+(x.detail?" — "+x.detail:"")); }); }
  if((d.skills||[]).length){ L.push("","SKILLS",d.skills.join(", ")); }
  return L.join("\n");
}
function normalizeResume(d){
  d=d||{}; d.contact=d.contact||{};
  d.experience=Array.isArray(d.experience)?d.experience.map(x=>({role:x.role||"",company:x.company||"",location:x.location||"",start:x.start||"",end:x.end||"",bullets:Array.isArray(x.bullets)?x.bullets.filter(Boolean):(x.bullets?[String(x.bullets)]:[])})):[];
  d.education=Array.isArray(d.education)?d.education.map(x=>({school:x.school||"",degree:x.degree||"",detail:x.detail||"",start:x.start||"",end:x.end||""})):[];
  d.skills=Array.isArray(d.skills)?d.skills.filter(Boolean):(typeof d.skills==="string"?d.skills.split(/[,\n]/).map(s=>s.trim()).filter(Boolean):[]);
  d.name=d.name||""; d.title=d.title||""; d.summary=d.summary||""; d.template=d.template||"modern";
  return d;
}

  ["email","phone","location","linkedin","website"].forEach(k=>{ const x=g("rs-"+k); if(x!==undefined) d.contact[k]=x.trim(); });
  if((v=g("rs-summary"))!==undefined) d.summary=v.trim();
  (d.experience||[]).forEach((x,i)=>{ ["role","company","start","end","location"].forEach(k=>{ const val=g(`rs-exp-${i}-${k}`); if(val!==undefined) x[k]=val.trim(); }); const b=g(`rs-exp-${i}-bullets`); if(b!==undefined) x.bullets=b.split("\n").map(s=>s.replace(/^[-••\s]+/,"").trim()).filter(Boolean); });
  (d.education||[]).forEach((x,i)=>{ ["school","degree","detail","start","end"].forEach(k=>{ const val=g(`rs-edu-${i}-${k}`); if(val!==undefined) x[k]=val.trim(); }); });
  if((v=g("rs-skills"))!==undefined) d.skills=v.split(/[\n,]/).map(s=>s.trim()).filter(Boolean);
  const tpl=document.getElementById("rs-template"); if(tpl) d.template=tpl.value;
}

    const out=await aiCall(resumeParsePrompt()+(text?("\n\nRÉSUMÉ:\n"+text):""), doc||null);
    rsApplyParsed(aiParse(out)); toast("Résumé structured ✓");
  }catch(e){ toast("⚠ "+e.message); }
}
function rsUpload(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".pdf,.txt,.md,.markdown,.json,.doc,.docx,.rtf";
  inp.onchange=async()=>{ const file=inp.files[0]; if(!file) return;
    if(file.size>12*1024*1024){ toast("⚠ File too big (max 12MB)"); return; }
    const fd=await fileToData(file); state.resume=state.resume||{}; state.resume.file=fd; save();
    const name=file.name.toLowerCase();
    const isText=/\.(txt|md|markdown|json)$/.test(name)||/^text\//.test(file.type);
    const isPDF=name.endsWith(".pdf")||file.type==="application/pdf";
    if(isText){ const txt=await file.text(); rsAIParse(txt,null); }
    else if(isPDF){ const b64=((await fileBytes(fd)).split(",")[1])||""; rsAIParse(null,{data:b64,mime:"application/pdf"}); }
    else { toast("Stored the file. For DOCX, paste the text or export to PDF to auto-structure."); if(editorEl) spSetBody(resumeStudioBody()); }
  };
  inp.click();
}

function rsHTML(d){

  return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(d.name||"Résumé")}</title><style>${rsCSS(tpl)}</style></head>

    ${d.summary?`<div class="sec"><h2>Summary</h2><p class="summary">${esc(d.summary)}</p></div>`:""}

/* ============================ CALENDAR (.ics / Google) ============================ */
function pad2(n){ return String(n).padStart(2,"0"); }
function icsStamp(date,time,addMin){
  // date "YYYY-MM-DD", time "HH:MM" -> local time components (floating, no TZ) so it lands at the shown wall-clock time
  const [y,m,d]=date.split("-").map(Number); let [hh,mm]=(time||"09:00").split(":").map(Number);
  let dt=new Date(y,(m-1),d,hh||9,mm||0); if(addMin) dt=new Date(dt.getTime()+addMin*60000);
  return `${dt.getFullYear()}${pad2(dt.getMonth()+1)}${pad2(dt.getDate())}T${pad2(dt.getHours())}${pad2(dt.getMinutes())}00`;
}
function eventTitle(o,r){ return `${r.name||r.type||"Interview"} — ${o.company}`; }
function icsEsc(s){ return String(s).replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/;/g,"\\;").replace(/,/g,"\\,"); }
function eventDesc(o,r){ return [r.type?("Type: "+r.type):"", r.interviewers?("With: "+r.interviewers):"", r.link?("Link: "+r.link):"", o.role?("Role: "+o.role):"", r.prep?("Prep: "+r.prep):""].filter(Boolean).join("\n"); }
function findRound(rid){ for(const o of state.opportunities){ const r=(o.rounds||[]).find(x=>x.id===rid); if(r) return {o,r}; } return null; }
// A normalized calendar event {uid,title,date,time,desc(raw),location}
function roundEvent(o,r){ return {uid:r.id||uid(),title:eventTitle(o,r),date:r.date,time:r.time||"",desc:eventDesc(o,r),location:r.link||""}; }
// Resolve a data-ics/data-gcal key — a round id, or "opId|task" / "opId|offer" for non-round events
function eventFromKey(key){
  const fr=findRound(key); if(fr) return roundEvent(fr.o,fr.r);
  const [opId,kind]=String(key).split("|"); const o=state.opportunities.find(x=>x.id===opId); if(!o) return null;
  if(kind==="task" && o.nextActionDate) return {uid:opId+"-task",title:(o.nextActionLabel||"Next step")+" — "+o.company,date:o.nextActionDate,time:"",desc:o.role?("Role: "+o.role):"",location:o.nextMeetingLink||""};
  if(kind==="offer" && o.offer && o.offer.deadline) return {uid:opId+"-offer",title:"Offer decision — "+o.company,date:o.offer.deadline,time:"",desc:"Decide on the "+(o.role||"role")+" offer at "+o.company,location:""};
  return null;
}
// Edit/delete a calendar item directly from the calendar (round, next-step task, or offer deadline)
function calEditEvent(key){
  const fr=findRound(key);
  if(fr){ openId=fr.o.id; openEditor(roundForm(fr.r)); if(editorEl) editorEl.dataset.editId=fr.r.id; return; }
  const [opId]=String(key).split("|"); const o=state.opportunities.find(x=>x.id===opId);
  if(o) openDetail(o.id); // tasks/deadlines live on the role — open it to edit the next step / offer
}
function calDeleteEvent(key){
  const fr=findRound(key);
  if(fr){ if(confirm("Delete this interview from the calendar? The role stays — to keep it as history instead, edit it and set status to Cancelled.")){ fr.o.rounds=(fr.o.rounds||[]).filter(r=>r.id!==fr.r.id); fr.o.updatedAt=Date.now(); save(); render(); if(openId===fr.o.id && $("#drawer").classList.contains("show")) renderDrawer(); toast("Removed from calendar"); } return; }
  const [opId,kind]=String(key).split("|"); const o=state.opportunities.find(x=>x.id===opId); if(!o) return;
  if(kind==="task" && confirm("Clear this next-step reminder?")){ o.nextActionLabel=""; o.nextActionDate=""; o.updatedAt=Date.now(); save(); render(); toast("Cleared"); }
  else if(kind==="offer" && confirm("Clear the offer deadline?")){ o.offer=o.offer||{}; o.offer.deadline=""; o.updatedAt=Date.now(); save(); render(); toast("Cleared"); }
}
function buildICS(ev){ return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Meanwhile//Interview//EN","BEGIN:VEVENT",
  "UID:"+ev.uid+"@callback","SUMMARY:"+icsEsc(ev.title),"DTSTART:"+icsStamp(ev.date,ev.time),"DTEND:"+icsStamp(ev.date,ev.time,60),
  "DESCRIPTION:"+icsEsc(ev.desc||""), ev.location?("LOCATION:"+icsEsc(ev.location)):"",
  "BEGIN:VALARM","TRIGGER:-PT30M","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(ev.title),"END:VALARM","END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n"); }
function downloadEventICS(ev){
  if(!ev||!ev.date){ toast("Add a date first"); return; }
  const blob=new Blob([buildICS(ev)],{type:"text/calendar"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=ev.title.replace(/[^\w-]+/g,"_").slice(0,60)+".ics";
  document.body.appendChild(a); a.click(); a.remove(); toast("Calendar file downloaded — open it to add");
}
function googleCalEventUrl(ev){
  const p=new URLSearchParams({action:"TEMPLATE", text:ev.title,
    dates:icsStamp(ev.date,ev.time)+"/"+icsStamp(ev.date,ev.time,60), details:ev.desc||"", location:ev.location||""});
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
