<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Meanwhile</title>

<!-- PWA / "Add to Home Screen" -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Meanwhile" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0b0e" />
<link rel="icon" type="image/png" href="icon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />

<style>
:root{
  --bg:#0a0b0e; --bg2:#101216; --panel:#131519; --panel2:#191c22;
  --line:#23262e; --line2:#2f333c;
  --txt:#e9eaed; --muted:#9a9ea8; --faint:#666b75;
  --accent:#5e6ad2; --accent2:#8b93de; --accent3:#a6abe6;
  --good:#4ea381; --warn:#c6a45c; --bad:#d06b6b; --hot:#cf7273;
  --radius:15px; --radius-sm:11px;
  --shadow:0 14px 44px -18px rgba(0,0,0,.72);
  --grad:linear-gradient(180deg,#6b75d6,#5560c9);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  /* User text is arbitrary: one long unbroken word used to walk straight out of whatever card it
     landed in. break-word only breaks when a word genuinely cannot fit, so normal copy is unaffected. */
  overflow-wrap:break-word;
  background:
    radial-gradient(1100px 640px at 82% -16%, rgba(94,106,210,.07), transparent 60%),
    var(--bg);
  color:var(--txt);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  font-feature-settings:"cv02","cv03","ss01"; letter-spacing:-.005em;
}
::selection{background:rgba(94,106,210,.35)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--accent2);text-decoration:none}
input,select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  border-radius:var(--radius-sm);padding:11px 12px;outline:none;transition:border .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(94,106,210,.18)}
textarea{resize:vertical;min-height:80px;line-height:1.55}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px 2px;font-weight:600;letter-spacing:.02em}
.scroll::-webkit-scrollbar{width:10px;height:10px}
.scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:2px solid var(--bg)}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:230px;flex:0 0 230px;padding:20px 14px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,var(--bg2),rgba(16,18,22,.4));
  display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.brand .logo{width:36px;height:36px;flex:0 0 36px;border-radius:10px;overflow:hidden;display:grid;place-items:center}
.brand .logo img{width:36px;height:36px;object-fit:cover;border-radius:10px}
.brand .logo svg{width:22px;height:22px}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;color:var(--muted);font-weight:600;transition:.15s;width:100%;text-align:left}
.nav-btn svg{width:19px;height:19px;flex:0 0 19px;opacity:.85}
.nav-btn:hover{background:var(--panel);color:var(--txt)}
.nav-btn.active{background:rgba(94,106,210,.13);color:#fff;box-shadow:inset 0 0 0 1px rgba(94,106,210,.28)}
.nav-btn .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;min-width:20px;text-align:center}
.nav-btn .badge.alert{background:var(--hot)}
.side-spacer{flex:1}
.side-foot{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.mini-btn{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;color:var(--faint);font-size:13px;font-weight:600;transition:.15s}
.mini-btn:hover{background:var(--panel);color:var(--muted)}
.mini-btn svg{width:16px;height:16px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:16px 26px;
  background:linear-gradient(180deg,rgba(10,11,14,.92),rgba(10,11,14,.72));backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.view-title{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:9px;min-width:0}
.view-title .vt-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.vt-wrap{min-width:0}
.view-title .vt-ico{display:inline-flex;flex:0 0 auto}
.view-title .vt-ico svg{width:20px;height:20px;color:var(--accent3)}
.view-sub{color:var(--faint);font-size:12.5px;margin-top:1px}
.view-sub:empty{display:none}
.search{position:relative;flex:1;max-width:420px;margin-left:8px}
.search input{padding-left:38px;background:var(--panel)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--panel2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--line);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:rgba(208,107,107,.12)}
@media(max-width:620px){ .hide-sm{display:none} .topbar .btn{padding:10px 12px} }

.content{padding:24px 26px 90px;flex:1}
.content.pad0{padding:0 0 90px}

/* ---------- Cards / generic ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.stat-grid{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.grid-2{grid-template-columns:1fr 1fr}
@media(max-width:860px){ .grid-2{grid-template-columns:1fr} }
.stat{padding:18px;border-radius:var(--radius);background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);position:relative;overflow:hidden}
.stat .ico{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(94,106,210,.14);color:var(--accent3)}
.stat .ico svg{width:18px;height:18px}
.stat .num{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .lbl{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:6px}
.stat .sub{color:var(--faint);font-size:11.5px;margin-top:7px;line-height:1.45}
.stat.hot .ico{background:rgba(207,114,115,.16);color:var(--hot)}
.stat.hot .num{color:var(--hot)}
.stat[data-tile]{cursor:pointer}
.stat[data-tile]:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--shadow)}
.stat[data-tile]:active{transform:translateY(0)}
.stat .tile-go{position:absolute;right:14px;bottom:12px;color:var(--faint);font-size:15px;font-weight:800;opacity:0;transition:.15s}
.stat[data-tile]:hover .tile-go{opacity:1;color:var(--accent3)}

.section-head{display:flex;align-items:center;gap:10px;margin:26px 2px 14px}
.section-head h3{font-size:15px;font-weight:800;margin:0;letter-spacing:.01em}
.section-head .line{flex:1;height:1px;background:var(--line)}
.section-head .tag{font-size:11px;color:var(--faint);font-weight:700}

.panel{padding:18px}
.panel-title{font-weight:800;font-size:14px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.panel-title svg{width:16px;height:16px;color:var(--accent3)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;
  font-weight:700;background:var(--panel2);color:var(--muted);border:1px solid var(--line);
  max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%}
.tag-chip{background:rgba(94,106,210,.12);color:var(--accent3);border-color:rgba(94,106,210,.25)}

.empty{display:grid;place-items:center;text-align:center;padding:60px 20px;color:var(--faint)}
.empty .big{width:64px;height:64px;border-radius:18px;background:var(--panel);display:grid;place-items:center;margin-bottom:16px;box-shadow:var(--shadow)}
.empty .big svg{width:30px;height:30px;color:var(--accent3)}
.empty .big.brand{background:transparent;box-shadow:none;width:84px;height:84px}
.empty .big.brand img{width:84px;height:84px;border-radius:21px;box-shadow:var(--shadow)}
.welcome-feats{display:flex;flex-direction:column;gap:9px;margin-top:18px;width:100%;max-width:430px;text-align:left}
.wf{display:flex;align-items:center;gap:12px;width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:13px;padding:13px 14px;transition:.14s;text-align:left}
.wf:hover{border-color:var(--line2);background:var(--panel2);transform:translateY(-1px)}
.wf:active{transform:translateY(0) scale(.995)}
.wf.primary{border-color:rgba(94,106,210,.42);background:linear-gradient(160deg,rgba(94,106,210,.15),rgba(94,106,210,.06))}
.wf.primary:hover{border-color:var(--accent)}
.wf.done .wf-ico{background:rgba(78,163,129,.16);color:var(--good)}
.wf.done b{color:var(--muted);font-weight:700}
.wf-ico{width:34px;height:34px;border-radius:10px;background:rgba(94,106,210,.13);display:grid;place-items:center;flex:0 0 34px}
.wf-ico svg{width:18px;height:18px;color:var(--accent3)}
.wf-b{flex:1;min-width:0}
.wf b{font-size:13.5px;font-weight:750;display:block;color:var(--txt);line-height:1.35}
.wf small{font-size:12px;color:var(--muted);line-height:1.45;display:block;margin-top:2px}
.wf-go{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--faint);transition:.14s}
.wf:hover .wf-go{color:var(--accent2);transform:translateX(2px)}
.wf-link{margin-top:16px;font-size:12.5px;font-weight:700;color:var(--faint);padding:8px 12px;border-radius:9px}
.wf-link:hover{color:var(--accent2);background:var(--panel)}

/* ---------- Dashboard hero (the visual hook) ---------- */
.hero{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);background:linear-gradient(135deg,#16131f,#0c0b12);margin-bottom:18px}
.hero-aurora{position:absolute;inset:-45%;z-index:0;opacity:.9;filter:blur(22px);
  background:
   radial-gradient(38% 48% at 18% 28%, rgba(94,106,210,.50), transparent 62%),
   radial-gradient(40% 50% at 82% 16%, rgba(139,124,221,.40), transparent 62%),
   radial-gradient(52% 60% at 65% 95%, rgba(78,120,180,.32), transparent 62%);
  animation:aurora 17s ease-in-out infinite alternate}
@keyframes aurora{0%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,3%) scale(1.1)}100%{transform:translate(-3%,-2%) scale(1.05)}}
@media (prefers-reduced-motion:reduce){ .hero-aurora{animation:none} }
.hero-grain{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.6;
  background:radial-gradient(1px 1px at 22% 32%, rgba(255,255,255,.05), transparent),radial-gradient(1px 1px at 72% 62%, rgba(255,255,255,.04), transparent),radial-gradient(1px 1px at 48% 80%, rgba(255,255,255,.04), transparent)}
.hero-inner{position:relative;z-index:1;display:flex;align-items:center;gap:18px;padding:22px 24px}
.hero-main{flex:1;min-width:0}
.hero-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--accent3)}
.hero-eyebrow svg{width:14px;height:14px}
.hero-co{display:flex;align-items:center;gap:12px;margin-top:11px}
.hero-fav{width:46px!important;height:46px!important;flex:0 0 46px!important;border-radius:13px!important;font-size:18px!important}
.hero-name{font-size:24px;font-weight:850;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-role{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-when{font-size:12.5px;color:var(--accent3);font-weight:600;margin-top:10px}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.hero-btn{background:rgba(255,255,255,.06)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)!important;color:#fff!important}
.hero-count{flex:0 0 auto;text-align:center;padding-left:8px}
.hc-num{font-size:62px;font-weight:850;line-height:.9;letter-spacing:-.03em;background:linear-gradient(180deg,#ffffff,#aeb4ea);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 20px rgba(94,106,210,.55))}
.hc-num.now{font-size:38px}
.hc-num.clock{font-size:33px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hc-unit{font-size:10.5px;color:var(--accent3);font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.hero-tint{position:absolute;inset:-30%;z-index:0;filter:blur(26px);opacity:.9;mix-blend-mode:screen;pointer-events:none}
.hero-mark{position:absolute;right:-36px;top:50%;transform:translateY(-50%);width:170px;height:170px;border-radius:42px;z-index:0;opacity:.06;pointer-events:none}
@media(max-width:560px){ .hero-inner{padding:18px;gap:12px} .hc-num{font-size:50px} .hc-num.now{font-size:30px} .hc-num.clock{font-size:25px} .hero-name{font-size:20px} .hero-fav{width:40px!important;height:40px!important;flex-basis:40px!important} .hero-mark{width:128px;height:128px;right:-28px} }

/* Branded launch splash (installed app only — see media query) */
#splash{display:none;position:fixed;inset:0;z-index:9999;background:
  radial-gradient(900px 520px at 50% 22%, rgba(94,106,210,.10), transparent 60%), var(--bg);
  place-items:center;transition:opacity .45s ease,visibility .45s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.sp-inner{display:flex;flex-direction:column;align-items:center;gap:13px;animation:sppop .55s cubic-bezier(.2,.7,.2,1)}
#splash img{width:88px;height:88px;border-radius:23px;box-shadow:var(--shadow)}
.sp-name{font-size:27px;font-weight:850;letter-spacing:-.02em;color:var(--txt)}
.sp-tag{font-size:12.5px;color:var(--accent3);font-weight:600;letter-spacing:.05em}
@keyframes sppop{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
@media (display-mode:standalone){ #splash{display:grid} }
/* brand mark in the mobile top bar (the desktop sidebar logo is hidden there) */
.topbar-brand{display:none;width:38px;height:38px;border-radius:11px;flex:0 0 auto;cursor:pointer;transition:transform .12s}
.topbar-brand:active{transform:scale(.9)}
.empty h3{color:var(--txt);margin:0 0 6px;font-size:18px}

/* ---------- Kanban ---------- */
.board{display:flex;gap:14px;padding:18px 26px;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 270px;width:270px;background:linear-gradient(180deg,var(--bg2),rgba(16,18,22,.3));border:1px solid var(--line);border-radius:var(--radius);max-height:calc(100vh - 180px);display:flex;flex-direction:column}
.col.drop{border-color:var(--accent);box-shadow:0 0 0 3px rgba(94,106,210,.18)}
.col-head{padding:13px 14px 10px;display:flex;align-items:center;gap:9px;position:sticky;top:0}
.col-head .dot{width:9px;height:9px;border-radius:50%}
.col-head .nm{font-weight:800;font-size:13px}
.col-head .ct{margin-left:auto;color:var(--faint);font-size:12px;font-weight:700;background:var(--panel);padding:1px 8px;border-radius:999px}
.col-body{padding:4px 10px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;transition:.15s;position:relative}
.kcard:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--shadow)}
.kcard.dragging{opacity:.5}
.kcard{padding:14px}
.kcard .co{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
/* default avatar — sized so the favicon/initial always renders as a clean box, even in contexts (dashboard lists) with no override */
.fav{position:relative;width:36px;height:36px;border-radius:10px;flex:0 0 36px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;overflow:hidden}
.fav img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:14%}
.fav.has-img{background:#f7f8fa!important;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.fav.has-img > span{display:none}
.fav > span{position:absolute;inset:0;display:grid;place-items:center}
.kcard .fav{width:26px;height:26px;border-radius:8px;flex:0 0 26px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;overflow:hidden}
.kcard .fav img{width:100%;height:100%;object-fit:contain;padding:14%}
.kcard .cn{font-weight:800;font-size:13.5px;line-height:1.3}
.kcard .rl{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.4}
.kcard .meta{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.kcard .stars{color:var(--warn);font-size:11px;letter-spacing:1px}
.kcard .next{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--accent2);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.kcard .next svg{width:13px;height:13px}
.kcard .next.soon{color:var(--warn)}
.kcard .next.over{color:var(--bad)}
.kcard .flag{position:absolute;top:10px;right:10px;font-size:13px}
.flag.dot{width:8px;height:8px;border-radius:50%;top:12px;right:12px;box-shadow:0 0 0 3px var(--panel)}
.flag.dot.warn{background:var(--warn)} .flag.dot.good{background:var(--good)}
.mini-flag{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:1px;margin-left:5px}
.mini-flag.warn{background:var(--warn)} .mini-flag.good{background:var(--good)}

/* ---------- Table ---------- */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
thead th{text-align:left;padding:13px 14px;color:var(--faint);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:var(--bg2);border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
thead th:hover{color:var(--muted)}
tbody tr{border-bottom:1px solid var(--line);transition:.12s;cursor:pointer}
tbody tr:hover{background:var(--panel2)}
tbody td{padding:12px 14px;vertical-align:middle}
.cell-co{display:flex;align-items:center;gap:10px}
.cell-co .fav{width:30px;height:30px;border-radius:9px;flex:0 0 30px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;overflow:hidden}
.cell-co .fav img{width:100%;height:100%;object-fit:contain;padding:14%}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}

/* ---------- Charts ---------- */
.chart-grid{grid-template-columns:1.4fr 1fr}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .nm{width:120px;flex:0 0 120px;font-size:12.5px;color:var(--muted);font-weight:600;text-align:right}
.bar-track{flex:1;height:24px;background:var(--bg2);border-radius:7px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:7px;display:flex;align-items:center;padding-left:9px;font-size:11.5px;
  font-weight:800;color:#fff;min-width:24px;white-space:nowrap;overflow:hidden;text-overflow:clip;
  transition:width .6s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.legend-row{display:flex;align-items:center;gap:9px;font-size:13px}
.legend-row .dot{width:11px;height:11px;border-radius:4px;flex:0 0 11px}
.legend-row .v{margin-left:auto;font-weight:800;color:var(--muted)}

/* ---------- Timeline (Upcoming › swimlanes) ---------- */
.cal-toggle{display:inline-flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:16px}
.cal-toggle .seg{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:none;background:none;color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer}
.cal-toggle .seg svg{width:15px;height:15px}
.cal-toggle .seg.on{background:var(--accent);color:#fff}
/* month grid */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.cal-title{font-size:16px;font-weight:800;letter-spacing:-.01em;min-width:148px}
.cal-nav{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.cal-nav:hover{background:var(--line);color:var(--txt)}
.cal-nav svg{width:16px;height:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:10.5px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:2px 0 6px}
.cal-cell{min-height:88px;border:1px solid var(--line);border-radius:10px;padding:6px 6px 5px;background:var(--panel);display:flex;flex-direction:column;gap:4px;overflow:hidden}
.cal-cell.has{cursor:pointer}
.cal-cell.empty{background:transparent;border-color:transparent}
.cal-cell.has:hover{border-color:var(--line2)}
.cal-cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal-cell.sel{border-color:var(--accent3);box-shadow:inset 0 0 0 1px var(--accent3)}
.cal-dnum{font-size:12px;font-weight:700;color:var(--muted)}
.cal-cell.today .cal-dnum{color:var(--accent3)}
.cal-evs{display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-ev{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.55}
.cal-more{font-size:9.5px;color:var(--faint);font-weight:700;padding-left:2px}
.cal-dots{display:none;gap:3px;flex-wrap:wrap;margin-top:1px}
.cal-dot{width:5px;height:5px;border-radius:50%}
.cal-detail{margin-top:20px}
.cal-detail-h{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 2px 11px}
@media(max-width:720px){
  .cal-grid{gap:4px}
  .cal-cell{min-height:46px;padding:4px;border-radius:8px;gap:2px}
  .cal-evs{display:none}
  .cal-dots{display:flex}
  .cal-dnum{font-size:11px;text-align:center}
  .cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
}
.timeline{overflow:hidden}
.tl-legend{display:flex;flex-wrap:wrap;gap:13px;font-size:11.5px;color:var(--muted);margin:0 2px 14px;align-items:center}
.tl-legend span{display:inline-flex;align-items:center;gap:5px}
.tl-legend i.lg{width:11px;height:11px;border-radius:50%;display:inline-block}
.tl-legend i.lg.done{background:#9aa6c2}
.tl-legend i.lg.upcoming{background:transparent;border:2px solid #9aa6c2}
.tl-legend i.lg.applied{background:var(--muted)}
.tl-legend i.lg.cancelled{background:var(--faint);opacity:.5}
.tl-legend i.lg.offer{border:none;color:var(--warn);width:auto;height:auto;font-size:12px}
.tl-nowkey:before{content:"";width:0;height:13px;border-left:1.5px dashed var(--accent2);margin-right:4px}
.tl-axis{position:relative;height:18px;margin:0 11px 8px;border-bottom:1px solid var(--line)}
/* The tick is a zero-width anchor ON the date; only the label inside it moves, so an end-of-axis
   month can align inward without dragging its mark off the point it labels. */
.tl-tick{position:absolute;top:1px;width:0;height:0}
.tl-tick>span{position:absolute;left:0;top:0;transform:translateX(-50%);font-size:10.5px;color:var(--faint);font-weight:700;white-space:nowrap}
.tl-tick.at-start>span{transform:none}
.tl-tick.at-end>span{transform:translateX(-100%)}
.tl-tick:after{content:"";position:absolute;left:0;top:16px;width:1px;height:5px;background:var(--line)}
/* Everything plotted at 0–100% — dots, labels, the today line — is centred on its point, so both
   ends overhang. Inset the whole plotting area by that overhang, in one place, so they stay
   aligned with each other and inside the card. */
.tl-body{position:relative;margin:0 11px}
.tl-now{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--accent2);opacity:.45;z-index:0}
.tl-row{position:relative;padding:9px 0;border-bottom:1px solid var(--line);z-index:1}
.tl-row:last-child{border-bottom:none}
.tl-row.closed{opacity:.5}
.tl-head{display:flex;align-items:center;gap:8px;margin-bottom:11px;min-width:0}
.tl-swatch{width:11px;height:11px;border-radius:3px;flex:0 0 11px}
.tl-co{font-weight:800;font-size:13.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tl-role{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tl-track{position:relative;height:18px;margin-bottom:18px}
.tl-line{position:absolute;top:50%;transform:translateY(-50%);height:2.5px;border-radius:2px}
.tl-line.dashed{height:0;background:none}
.tl-dot{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;background:var(--c);box-shadow:0 0 0 3px var(--bg);z-index:2;display:grid;place-items:center;line-height:1}
.tl-dot.upcoming,.tl-dot.pending{background:var(--bg);border:2.5px solid var(--c)}
.tl-dot.pending{opacity:.65}
.tl-dot.applied{width:10px;height:10px}
.tl-dot.cancelled{background:var(--faint);opacity:.45;width:10px;height:10px;box-shadow:0 0 0 3px var(--bg)}
.tl-dot.task{width:9px;height:9px;background:var(--bg);border:2px solid var(--accent2)}
.tl-dot.offer{background:none;box-shadow:none;color:var(--warn);width:auto;height:auto;font-size:15px}
.tl-dot:hover{filter:brightness(1.18)}
.tl-lbl{position:absolute;top:calc(50% + 12px);transform:translateX(-50%);font-size:10px;color:var(--faint);
  white-space:nowrap;pointer-events:none;max-width:min(96px,38vw);overflow:hidden;text-overflow:ellipsis}
.tl-lbl.s{transform:none;text-align:left}
.tl-lbl.e{transform:translateX(-100%);text-align:right}
@media(max-width:720px){ .tl-lbl{display:none} .tl-track{margin-bottom:4px} .tl-role{display:none} }

/* ---------- Modal / Drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:100;opacity:0;pointer-events:none;transition:.2s}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;height:100dvh;width:min(560px,100vw);background:var(--bg2);border-left:1px solid var(--line);z-index:101;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;box-shadow:-30px 0 60px -20px rgba(0,0,0,.6)}
.drawer.show{transform:translateX(0)}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg2);z-index:5}
.drawer-body{padding:20px;overflow-y:auto;flex:1}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;background:var(--bg2)}
.x-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel);color:var(--muted)}
.x-btn:hover{background:var(--panel2);color:var(--txt)}
.x-btn svg{width:18px;height:18px}

.tabs{display:flex;gap:4px;padding:4px;background:var(--panel);border-radius:12px;margin-bottom:18px;overflow-x:auto}
.tab{padding:8px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab.active{background:var(--panel2);color:#fff;box-shadow:inset 0 0 0 1px var(--line2)}

.form-row{margin-bottom:14px}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

.rating-pick{display:flex;gap:6px}
.rating-pick .s{font-size:22px;cursor:pointer;color:var(--line2);transition:.1s}
.rating-pick .s.on{color:var(--warn)}

.sub-item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:11px;line-height:1.5}
.sub-item .si-head{display:flex;align-items:flex-start;gap:11px;margin-bottom:9px}
.sub-item .si-head .nm{font-weight:800;font-size:13.5px;line-height:1.4}
.sub-item .si-head .nm + div{margin-top:3px;line-height:1.45}
.sub-item .si-head .del{margin-left:auto;color:var(--faint);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:0 0 26px}
.sub-item .si-head .del:hover{color:var(--bad);background:rgba(208,107,107,.1)}
.sub-item .si-meta{color:var(--muted);font-size:12px;display:flex;gap:6px 14px;flex-wrap:wrap;line-height:1.6}
.add-sub{width:100%;padding:11px;border:1.5px dashed var(--line2);border-radius:12px;color:var(--muted);font-weight:700;font-size:13px;transition:.15s}
.add-sub:hover{border-color:var(--accent);color:var(--accent3);background:rgba(94,106,210,.06)}
.tab-empty{text-align:center;padding:30px 18px 24px}
.tab-empty .te-ico{width:48px;height:48px;border-radius:14px;background:rgba(94,106,210,.12);display:grid;place-items:center;margin:0 auto 13px;color:var(--accent3)}
.tab-empty .te-ico svg{width:23px;height:23px}
.tab-empty .te-title{font-weight:800;font-size:15px;margin-bottom:5px}
.tab-empty .te-sub{font-size:12.5px;color:var(--faint);max-width:290px;margin:0 auto;line-height:1.55}

.ai-box{background:linear-gradient(160deg,rgba(94,106,210,.1),rgba(94,106,210,.06));border:1px solid rgba(94,106,210,.3);border-radius:14px;padding:16px;margin-bottom:14px}
.ai-box .ai-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-weight:800;font-size:13.5px}
.ai-box .ai-head svg{width:18px;height:18px;color:var(--accent3)}
.ai-pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);white-space:pre-wrap;max-height:260px;overflow:auto;margin-bottom:10px}

/* A toast is a glance, not a document. Without a cap a raw provider error stretched to the full
   width of the phone and grew into a wall of JSON — so it is bounded in both directions, the text
   is left-aligned like a sentence, and the icon holds its size instead of being squashed. */
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--panel2);border:1px solid var(--line2);color:var(--txt);width:max-content;max-width:min(430px,calc(100vw - 28px));
  padding:12px 16px;border-radius:13px;font-weight:650;font-size:13.5px;line-height:1.5;text-align:left;
  box-shadow:var(--shadow);z-index:200;opacity:0;pointer-events:none;display:flex;align-items:flex-start;gap:10px;
  transition:opacity .25s,transform .25s}   /* NOT `all` — that animates the width on a rotate/resize */
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:17px;height:17px;flex:0 0 17px;margin-top:1px;color:var(--good)}
.toast span{min-width:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.toast.bad{border-color:rgba(208,107,107,.5);background:linear-gradient(160deg,rgba(208,107,107,.15),var(--panel2))}
.toast.bad svg{color:var(--bad)}
/* An offer to undo has to be tappable, so this one toast takes pointer events back */
.toast.act{pointer-events:auto}
.toast-act{flex:0 0 auto;margin:-4px -6px -4px 2px;padding:5px 11px;border-radius:9px;border:1px solid var(--line2);
  background:var(--panel);color:var(--accent3);font:inherit;font-weight:800;font-size:12.5px;cursor:pointer;transition:.12s}
.toast-act:hover{border-color:var(--accent2);color:var(--txt)}

/* A destructive choice: one button per outcome, each saying what it does. Above the sign-in gate. */
.choice-wrap{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;
  background:rgba(4,4,9,.72);backdrop-filter:blur(7px);
  padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));overflow:auto}
.choice-card{background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:22px 20px 18px;
  width:100%;max-width:430px;box-shadow:0 30px 70px rgba(0,0,0,.6);margin:auto}
.choice-card h3{margin:0 0 8px;font-size:19px;font-weight:850;letter-spacing:-.02em}
.choice-card p{margin:0 0 16px;font-size:13.5px;line-height:1.6;color:var(--muted)}
.choice-opts{display:flex;flex-direction:column;gap:9px}
.choice-opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line2);
  border-radius:14px;padding:13px 15px;cursor:pointer;color:var(--txt);font:inherit;transition:.14s}
.choice-opt:hover{border-color:var(--accent2);transform:translateY(-1px)}
.choice-opt .co-l{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.choice-opt .co-n{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.choice-opt.primary{border-color:rgba(94,106,210,.55);background:linear-gradient(150deg,rgba(94,106,210,.2),var(--panel2))}
.choice-opt.danger{border-color:rgba(208,107,107,.4)}
.choice-opt.danger:hover{border-color:rgba(208,107,107,.75)}
.choice-opt.danger .co-n{color:var(--bad)}
.choice-foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:15px}
.choice-note{font-size:11.5px;color:var(--faint);line-height:1.55;margin-top:11px;text-align:right}
@media(max-width:420px){
  .choice-card{padding:19px 16px 15px}
  .choice-foot{justify-content:stretch}
  .choice-foot .btn{flex:1 1 auto;justify-content:center}
  .choice-note{text-align:left}
}

.detail-hero{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.detail-hero .fav{width:48px;height:48px;border-radius:13px;flex:0 0 48px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;overflow:hidden}
.detail-hero .fav img{width:100%;height:100%;object-fit:contain;padding:14%}
.detail-hero h2{margin:0;font-size:19px;font-weight:850;letter-spacing:-.02em;line-height:1.3}
.detail-hero .rl{color:var(--muted);font-size:13.5px;margin-top:4px;line-height:1.4}
.kv{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;font-size:13.5px;margin:16px 0;line-height:1.5}
.kv dt{color:var(--faint);font-weight:600}
.kv dd{margin:0;font-weight:600;line-height:1.5}
.note-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:13.5px;line-height:1.6;color:var(--muted);white-space:pre-wrap;margin-bottom:12px}

.mobile-nav{display:none}

.pipe-bar{display:flex;align-items:center;gap:12px;padding:14px 26px 10px}

@media(max-width:860px){
  html,body{overflow-x:hidden;max-width:100vw}
  .sidebar{display:none}
  .chart-grid{grid-template-columns:1fr}
  /* breathing room top & bottom incl. iOS safe areas */
  .topbar{padding:calc(10px + env(safe-area-inset-top)) 16px 12px;gap:10px;flex-wrap:wrap}
  .content{padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
  .content.pad0{padding:0 0 calc(96px + env(safe-area-inset-bottom))}
  .topbar-brand{display:block}
  .view-title{font-size:18px}
  .view-sub{font-size:11.5px}
  .vt-wrap{flex:1 1 0}
  .view-title .vt-ico{display:none}
  .empty{padding:34px 18px}
  .empty .big.brand{width:68px;height:68px}
  .empty .big.brand img{width:68px;height:68px;border-radius:18px}
  .search{order:5;max-width:none;flex:1 1 100%;margin:2px 0 0}
  body.no-data .search{display:none}
  .btn.primary{padding:10px 14px}
  #settingsBtn{flex:0 0 auto}
  .form-2,.form-3{grid-template-columns:1fr}
  /* Pipeline stacks vertically — no sideways scrolling */
  .pipe-bar{padding:14px 16px 8px}
  .board{flex-direction:column;overflow-x:hidden;padding:12px 14px;gap:16px}
  .col{flex:1 1 auto;width:100%;max-width:100%;max-height:none}
  .col-body{max-height:none;overflow:visible}
  /* Cards view is a responsive grid (see renderCards) so nothing scrolls sideways */
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(16,18,22,.97);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}
  .mnav{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px;border-radius:10px;
    color:var(--faint);font-size:10px;font-weight:700;flex:1 1 0;min-width:0;overflow:hidden;
    white-space:nowrap;text-overflow:ellipsis}
  .mnav svg{width:21px;height:21px;flex:0 0 auto}
  @media(max-width:359px){ .mnav{font-size:9px;padding:5px 2px} .mnav svg{width:19px;height:19px} }
  .mnav.active{color:var(--accent3)}
  .drawer{width:100vw}
  .drawer-head{padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
  .drawer-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
  .section-head{margin:22px 2px 12px}
}
@media(max-width:380px){ .stat-grid{grid-template-columns:1fr 1fr} }

/* Role cards (mobile table replacement) */
.role-card{display:flex;align-items:flex-start;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px;cursor:pointer;transition:.15s}
.role-card:active{transform:scale(.99)}
.role-card .body{flex:1;min-width:0}
.role-card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.role-card .cn{font-weight:800;font-size:14.5px;line-height:1.35}
.role-card .rl{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.4}
.role-card .ln{display:flex;align-items:center;gap:8px 10px;margin-top:9px;flex-wrap:wrap;font-size:11.5px;color:var(--faint);line-height:1.5}

/* ---------- Job Cards view ---------- */
.cards-sorts{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch}
.job-card.closed{opacity:.6}
.job-card.closed:hover{opacity:.85}
/* min() so the column can go narrower than 310px rather than forcing the grid wider than a
   320px screen */
.job-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:14px}
.job-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:13px}
.job-card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--shadow)}
.job-card:active{transform:scale(.995)}
.jc-head{display:flex;align-items:center;gap:12px}
.jc-id{flex:1;min-width:0}
.jc-co{font-weight:850;font-size:16px;letter-spacing:-.01em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jc-role{color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jc-tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
.jc-tag.good{background:rgba(78,163,129,.16);color:var(--good)}
.jc-tag.warn{background:rgba(198,164,92,.16);color:var(--warn)}
.jc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.jc-stat{min-width:0}
.jc-stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:800}
.jc-stat .v{font-size:14.5px;font-weight:750;margin-top:5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jc-stat .v .pill{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jc-stat .v.sm{font-size:13px}
.jc-sub{font-size:11px;color:var(--faint);font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jc-contacts{display:flex;align-items:center;gap:8px;min-width:0;margin-top:5px}
.jc-avs{display:flex;align-items:center;flex:0 0 auto}
.jc-av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:#fff;border:2px solid var(--panel);overflow:hidden;position:relative;margin-left:-7px}
.jc-av:first-child{margin-left:0}
.jc-av img{width:100%;height:100%;object-fit:cover}
.jc-av.more{background:var(--panel2);color:var(--muted)}
.jc-cnames{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;font-weight:700;color:var(--muted)}
.jc-foot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.jc-foot .stars{font-size:12px}
.jc-dot{color:var(--faint)}
.jc-tagline{font-size:11px;color:var(--accent3);margin-top:3px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask-box{margin-bottom:18px}
.ask-chips{display:flex;gap:7px;flex-wrap:wrap}
.ask-chips .chip{cursor:pointer}
.ask-chips .chip:hover{border-color:var(--accent);color:var(--txt)}
.keysync{display:flex;align-items:flex-start;gap:9px;font-size:12px;color:var(--muted);line-height:1.55;
  background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin:-4px 2px 12px;cursor:pointer}
.keysync input{width:16px;height:16px;flex:0 0 16px;margin-top:1px;accent-color:var(--accent)}
.keysync b{color:var(--txt);font-weight:750}
.keysync i{color:var(--faint);font-style:normal}
.keysync.note{cursor:default;border-color:rgba(198,164,92,.3);background:rgba(198,164,92,.07)}
.keysync.note > span:first-child{flex:0 0 15px;color:var(--warn)}
.keysync.note svg{width:15px;height:15px}
.ai-kept{font-size:11.5px;color:var(--good);font-weight:700;line-height:1.5;margin:2px 0 8px}
.ai-kept:empty{display:none}
.ai-keylinks{font-size:12px;color:var(--muted);margin:-2px 2px 12px;line-height:1.7;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
.ai-keylinks a{color:var(--accent3);font-weight:700;white-space:nowrap}
.ai-subhead{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent3);margin:18px 0 9px;padding-top:14px;border-top:1px solid var(--line)}
.ai-subhead svg{width:15px;height:15px}

/* Next moves — unified action hub */
.move{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:11px 12px;border-radius:12px;cursor:pointer;transition:.12s}
.move:hover{background:var(--panel2)}
.move+.move{border-top:1px solid var(--line)}
.move-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 30px}
.move-ico svg{width:16px;height:16px}
.move-fav{width:28px!important;height:28px!important;flex:0 0 28px!important;border-radius:8px!important;font-size:11px!important}
.move-body{flex:1 1 130px;min-width:0}
.move-label{font-weight:750;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.move-co{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.move-due{font-size:11.5px;font-weight:800;flex:0 0 auto;white-space:nowrap}
.move-actions{display:flex;gap:6px;flex:0 0 auto}
@media(max-width:560px){ .move-actions{flex:1 1 100%;order:5;padding-left:41px} .move{gap:9px} }

/* ---------- Company brief (drawer) ---------- */
.brief-box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.brief-head{display:flex;align-items:center;gap:12px}
.brief-co{font-weight:850;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brief-tag{color:var(--accent3);font-size:12.5px;font-weight:600;margin-top:2px;font-style:italic;line-height:1.35}
.brief-dom{font-size:12px;margin-top:2px}
.brief-body{font-size:13px;line-height:1.62;color:var(--muted);white-space:pre-wrap;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.brief-meta{font-size:10px;color:var(--faint);margin-top:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.brief-empty{font-size:12px;color:var(--faint);margin-top:10px;line-height:1.5}

/* ---------- Storage alarm + data-at-risk banner ---------- */
#storageAlarm{position:fixed;top:0;left:0;right:0;z-index:120;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  padding:calc(9px + env(safe-area-inset-top)) 16px 9px;background:#4a1f22;border-bottom:1px solid #7d3339;color:#ffd9da;font-size:13px}
#storageAlarm .btn{background:#ffd9da;color:#4a1f22;font-weight:800}
.risk{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(160deg,rgba(198,164,92,.14),rgba(198,164,92,.06));
  border:1px solid rgba(198,164,92,.34);border-radius:var(--radius);padding:13px 15px;margin-bottom:16px}
.risk-ico{width:32px;height:32px;border-radius:10px;flex:0 0 32px;display:grid;place-items:center;background:rgba(198,164,92,.18);color:var(--warn)}
.risk-ico svg{width:17px;height:17px}
.risk-b{flex:1 1 220px;min-width:0}
.risk-t{font-weight:800;font-size:13.5px;line-height:1.4}
.risk-s{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.risk-a{display:flex;gap:7px;flex:1 1 auto;flex-wrap:wrap;min-width:0}
.meter{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}

/* ---------- Post-hire: 90-day mode / My Company ---------- */
.fab{position:fixed;right:22px;bottom:26px;z-index:45;display:flex;align-items:center;gap:9px;padding:14px 20px;border-radius:999px;
  background:var(--grad);color:#fff;font-weight:800;font-size:14.5px;box-shadow:0 12px 30px -8px rgba(94,106,210,.7),0 2px 6px rgba(0,0,0,.4);transition:.15s}
.fab:hover{filter:brightness(1.08);transform:translateY(-1px)}
.fab:active{transform:translateY(0) scale(.98)}
.fab svg{width:19px;height:19px}
/* Ask sits above Capture — same rail, opposite job, so a different colour rather than a
   second primary button competing with it. */
.fab-ask{bottom:84px;background:linear-gradient(150deg,#2f7d6b,#3f9b7f);
  box-shadow:0 12px 30px -8px rgba(63,155,127,.55),0 2px 6px rgba(0,0,0,.4)}
@media(max-width:860px){
  .fab{right:16px;bottom:calc(74px + env(safe-area-inset-bottom));padding:13px 17px;font-size:14px}
  .fab-ask{bottom:calc(130px + env(safe-area-inset-bottom))}
}

/* ---- where you left off ---- */
.recap{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:15px 16px;margin-bottom:14px}
.rc-head{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent3);flex-wrap:wrap}
.rc-head svg{width:13px;height:13px}
.rc-all{margin-left:auto;background:none;border:none;color:var(--accent3);font:inherit;font-size:11px;
  font-weight:800;letter-spacing:.04em;text-transform:none;cursor:pointer;padding:2px 6px;border-radius:6px;white-space:nowrap}
.rc-all:hover{background:var(--panel2);color:var(--txt)}
.rc-line{font-size:14px;color:var(--muted);margin-top:8px}
.rc-line b{color:var(--txt);font-weight:850}
.rc-notes{display:flex;flex-direction:column;gap:1px;margin-top:11px}
.rc-note{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;cursor:pointer;color:var(--txt);font:inherit;transition:.12s;min-width:0}
.rc-note:hover{border-color:var(--line2)}
.rn-t{display:block;font-size:12.5px;font-weight:700;line-height:1.4}
.rn-m{display:block;font-size:10.5px;color:var(--faint);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-people{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.rc-p{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:3px 11px 3px 3px;font-size:11.5px;font-weight:700;cursor:pointer;transition:.12s;max-width:100%}
.rc-p:hover{border-color:var(--line2)}
.rc-p .ent-ico{width:20px;height:20px;flex:0 0 20px;border-radius:7px;font-size:9px}

/* ---- your manager and your reports ---- */
.circ-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:11px;margin-bottom:18px}
.circ{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.circ-h{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:0;
  cursor:pointer;color:var(--txt);font:inherit;text-align:left;min-width:0}
.circ-h .ent-ico{width:32px;height:32px;flex:0 0 32px;border-radius:10px;font-size:12px}
.ci-b{min-width:0}
.ci-n{display:block;font-size:13.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-r{display:block;font-size:10.5px;color:var(--faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.circ-list{display:flex;flex-direction:column;gap:5px;margin-top:11px}
.circ-i{display:flex;align-items:center;gap:8px;width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:7px 9px;cursor:pointer;color:var(--txt);font:inherit;text-align:left;transition:.12s;min-width:0}
.circ-i:hover{border-color:var(--line2)}
.ci-d{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.ci-t{flex:1 1 0;min-width:0;font-size:11.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-a{flex:0 0 auto;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.circ-none{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.5}

/* ---- gone quiet ---- */
.quiet-list{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
.qt{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:11px 13px;min-width:0}
.qt-b{display:flex;align-items:center;gap:12px;flex:1 1 0;min-width:0;background:none;border:none;
  padding:0;cursor:pointer;color:var(--txt);font:inherit;text-align:left}
.qt-days{flex:0 0 auto;font-size:21px;font-weight:850;letter-spacing:-.03em;color:var(--warn);font-variant-numeric:tabular-nums;line-height:1}
.qt-days i{font-size:11px;font-style:normal;opacity:.7;margin-left:1px}
.qt-t{min-width:0}
.qt-n{display:block;font-size:13px;font-weight:750;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qt-m{display:block;font-size:10.5px;color:var(--faint);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qt .btn{flex:0 0 auto}

/* ---- the dashboard: pace strip, gauges, action tiles ---- */
.pace{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.pc-cell{background:var(--panel);padding:14px 16px;min-width:0;border:none;text-align:left;
  color:var(--txt);font:inherit;width:100%;cursor:pointer;transition:.12s}
.pc-cell:hover{background:var(--panel2)}
.pc-cell.pc-flat{cursor:default}
.pc-cell.pc-flat:hover{background:var(--panel)}
.pc-n{font-size:26px;font-weight:850;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.pc-l{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.pc-trend{display:block;font-weight:750;margin-top:2px}
.pc-trend.up{color:var(--good)} .pc-trend.down{color:var(--warn)}

.gg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px;margin-bottom:18px}
.gg{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:15px;
  padding:12px 10px 13px;text-align:center;cursor:pointer;transition:.14s;color:var(--txt);font:inherit;
  display:flex;flex-direction:column;align-items:center;min-width:0}
.gg:hover{border-color:var(--line2);transform:translateY(-2px)}
.gg-dial{width:100%;max-width:112px;height:auto;display:block}
.gg-num{font-family:inherit;font-size:25px;font-weight:850;letter-spacing:-.03em}
.gg-pc{font-size:12px;opacity:.65}
.gg-lab{margin-top:2px;font-size:11.5px;font-weight:750;line-height:1.35;max-width:100%}
.gg-sub{margin-top:4px;font-size:10.5px;color:var(--faint);line-height:1.4;max-width:100%}

/* ---- INSIGHTS: the company as a sphere ---- */
.gl-head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.gl-title{flex:1 1 200px;min-width:0}
.gl-title h2{margin:0;font-size:19px;font-weight:850;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gl-sub{font-size:12px;color:var(--faint);margin-top:3px;line-height:1.5}
/* flex:1 1 auto + min-width:0, NOT 0 0 auto — a row that cannot shrink never lets its own
   flex-wrap kick in, so five buttons walked straight off a 320px screen. */
.gl-acts{display:flex;gap:7px;flex-wrap:wrap;flex:1 1 auto;min-width:0;justify-content:flex-end}
.gl-acts .btn.on{box-shadow:inset 0 0 0 1px var(--accent2);color:var(--accent2)}
.gl-stage{position:relative;width:100%;height:min(62vh,560px);min-height:300px;border-radius:18px;
  overflow:hidden;background:radial-gradient(120% 100% at 50% 0%,#171a2b 0%,#0c0e15 60%,#08090d 100%);
  border:1px solid var(--line);touch-action:none;cursor:grab;contain:paint}
.gl-stage:active{cursor:grabbing}
#glCanvas{display:block;width:100%;height:100%}
.gl-hint{position:absolute;left:0;right:0;bottom:9px;text-align:center;font-size:10.5px;
  color:rgba(255,255,255,.34);pointer-events:none;padding:0 12px}
.gl-panel{position:absolute;top:12px;right:12px;width:min(268px,calc(100% - 24px));
  background:rgba(14,16,22,.93);border:1px solid var(--line2);border-radius:14px;padding:13px;
  backdrop-filter:blur(9px);max-height:calc(100% - 24px);overflow:auto}
.gl-x{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:8px;border:0;
  background:transparent;color:var(--faint);cursor:pointer;display:grid;place-items:center;padding:0}
.gl-x svg{width:14px;height:14px}
.gl-p-head{display:flex;gap:10px;align-items:center;padding-right:26px;min-width:0}
.gl-p-name{font-size:13.5px;font-weight:800;line-height:1.35;overflow-wrap:break-word}
.gl-p-type{font-size:11px;color:var(--faint);margin-top:2px}
.gl-p-list{margin-top:11px;display:flex;flex-direction:column;gap:2px}
.gl-p-row{display:flex;gap:8px;align-items:center;width:100%;padding:6px 7px;border-radius:8px;
  background:transparent;border:0;color:var(--txt);font:inherit;cursor:pointer;text-align:left;min-width:0}
.gl-p-row:hover{background:var(--panel2)}
.gl-p-row i{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.gl-p-row span{flex:1 1 auto;min-width:0;font-size:12px;font-weight:650;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl-p-row em{flex:0 0 auto;font-style:normal;font-size:10px;color:var(--faint)}
.gl-p-none{margin-top:11px;font-size:11.5px;color:var(--faint);line-height:1.6}
/* ---- duplicate review ---- */
.dup-list{display:flex;flex-direction:column;gap:16px;max-height:min(62vh,520px);overflow:auto;padding-right:2px}
.dup-group{display:flex;flex-direction:column;gap:10px}
.dup-head{font-size:10.5px;font-weight:850;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.dup-head b{color:var(--txt)}
.dup-pair{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px;min-width:0}
.dup-pair.cross{border-color:#c9a22740}
.dup-sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.dup-side{min-width:0;display:flex;flex-direction:column;gap:5px}
.dup-tag{font-size:9.5px;font-weight:850;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.dup-card{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:10px;color:var(--txt);font:inherit;cursor:pointer;min-width:0;transition:.12s}
.dup-card:hover{border-color:var(--line2)}
.dup-top{display:flex;gap:8px;align-items:center;min-width:0}
.dup-name{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:800;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dup-meta{margin-top:6px;font-size:11px;color:var(--muted);line-height:1.45}
.dup-body{margin-top:5px;font-size:11px;color:var(--faint);line-height:1.5}
.dup-stat{margin-top:7px;font-size:10px;color:var(--faint)}
.dup-why{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 2px}
.dup-tagline{font-size:10.5px;font-weight:650;color:var(--muted);background:var(--panel2);
  border-radius:999px;padding:4px 9px;max-width:100%;overflow-wrap:break-word}
.dup-tagline.warn{color:var(--warn);background:rgba(198,164,92,.13)}
.dup-acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.dup-acts .dup-no{margin-left:auto}
@media(max-width:560px){
  .dup-sides{grid-template-columns:1fr}
  .dup-acts .dup-no{margin-left:0}
}

.gl-time{display:flex;gap:11px;align-items:center;margin:11px 0 2px;min-width:0}
.gl-play{flex:0 0 auto;width:32px;height:32px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--txt);cursor:pointer;font-size:11px;line-height:1;padding:0}
.gl-play:hover{border-color:var(--line2)}
#glTime{flex:1 1 auto;min-width:0;accent-color:var(--accent2);height:22px}
.gl-tlab{flex:0 0 auto;font-size:11px;color:var(--faint);font-weight:700;
  min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
.gl-acts .btn[disabled]{opacity:.4;cursor:not-allowed}
.gl-legend{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 4px}
.gl-chip{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:11px;
  font-weight:700;cursor:pointer;transition:.12s;max-width:100%}
.gl-chip i{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.gl-chip b{color:var(--faint);font-weight:800}
.gl-chip.off{opacity:.36}
.gl-chip:hover{border-color:var(--line2)}
.gl-findings{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.gl-sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 15px;min-width:0}
.gl-sec h3{margin:0 0 4px;font-size:13.5px;font-weight:850;display:flex;gap:7px;align-items:center}
.gl-sec h3 svg{width:15px;height:15px;flex:0 0 15px;color:var(--accent2)}
.gl-finds{display:flex;flex-direction:column;gap:2px}
.gl-find{display:flex;gap:9px;align-items:center;width:100%;padding:7px;border-radius:10px;
  background:transparent;border:0;color:var(--txt);font:inherit;cursor:pointer;text-align:left;min-width:0}
.gl-find:hover{background:var(--panel2)}
.gl-fb{flex:1 1 auto;min-width:0}
.gl-fn{display:block;font-size:12.5px;font-weight:750;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl-fm{display:block;font-size:10.5px;color:var(--faint);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl-more{font-size:10.5px;color:var(--faint);padding:6px 7px}
@media(max-width:640px){
  .gl-stage{height:min(52vh,420px)}
  .gl-panel{top:auto;bottom:10px;left:10px;right:10px;width:auto;max-height:52%}
  .gl-hint{display:none}
}

/* The four week numbers. Four items in an auto-fit grid can never exceed four columns, so this is
   4-up on a laptop and 2-up on a phone with no media query. */
.wk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:11px;margin-bottom:18px}
.wk{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px 13px 13px;
  text-align:left;cursor:pointer;transition:.14s;color:var(--txt);font:inherit;
  display:flex;flex-direction:column;gap:3px;min-width:0}
.wk:hover{border-color:var(--line2);transform:translateY(-2px)}
.wk.hot{border-color:#cf727355;background:linear-gradient(180deg,#cf72730f,transparent)}
.wk-n{font-size:29px;font-weight:850;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.wk-l{font-size:12px;font-weight:800;line-height:1.35;max-width:100%}
.wk-s{font-size:10.5px;color:var(--faint);line-height:1.4;max-width:100%}

/* A report row shows the evidence, so it is taller and wordier than an entRow on purpose. */
.rep-list{display:flex;flex-direction:column}
.rep-row{display:flex;gap:10px;align-items:flex-start;padding:11px 10px;border-radius:12px;
  cursor:pointer;transition:.12s;min-width:0}
.rep-row:hover{background:var(--panel2)}
.rep-b{flex:1 1 auto;min-width:0}
.rep-t{font-size:13px;font-weight:750;line-height:1.45}
.rep-m{margin-top:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.rep-q{font-size:11.5px;color:var(--muted);line-height:1.5;max-width:100%}
.rep-q b{color:var(--txt);font-weight:800}
/* citations sit shoulder to shoulder in one line, so they need to look like separate things */
.rep-q .cite{display:inline-block;max-width:100%;margin:2px 4px 2px 0;padding:3px 9px;border-radius:999px;
  background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);font-size:11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.rep-w{font-size:10.5px;color:var(--faint);line-height:1.4;max-width:100%}
.rep-sec{font-size:10.5px;font-weight:850;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);padding:12px 10px 4px}
.rep-row .btn{flex:0 0 auto;align-self:center}

.act-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px;margin-bottom:18px}
.act{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;
  cursor:pointer;transition:.14s;color:var(--txt);font:inherit;display:block;min-width:0}
.act:hover{border-color:var(--line2);transform:translateY(-2px)}
.act.hot{border-color:rgba(208,107,107,.4);background:linear-gradient(155deg,rgba(208,107,107,.09),var(--panel))}
.act-n{display:block;font-size:25px;font-weight:850;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.act-l{display:block;font-size:12px;font-weight:750;margin-top:7px;line-height:1.35}
.act-s{display:block;font-size:10.5px;color:var(--faint);margin-top:4px;line-height:1.4}

/* ---- an objective now says when and how long ---- */
.obj-when{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ow-tag{font-size:10px;font-weight:850;letter-spacing:.07em;text-transform:uppercase;
  border:1px solid;border-radius:999px;padding:2px 8px;white-space:nowrap}
.ow-mins{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--faint);font-weight:700;white-space:nowrap}
.ow-mins svg{width:11px;height:11px}
.ow-add{background:none;border:none;color:var(--accent3);font:inherit;font-size:10.5px;font-weight:800;
  cursor:pointer;padding:2px 6px;border-radius:6px;white-space:nowrap;margin-left:auto}
.ow-add:hover{background:var(--panel2);color:var(--txt)}
.ow-on{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;color:var(--good);margin-left:auto;white-space:nowrap}
.ow-on svg{width:11px;height:11px}
.gg-sub b{color:var(--txt);font-weight:800}
@media(max-width:520px){
  .circ-grid{grid-template-columns:1fr}
  /* three stats over two columns leaves an empty cell — the odd one out takes the full width */
  .pace{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pc-cell:last-child{grid-column:1/-1}
  .gg-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .act-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ow-add,.ow-on{margin-left:0}
}

.work-hero{position:relative;overflow:hidden;border-radius:var(--radius);border:1px solid var(--line);background:linear-gradient(150deg,var(--panel),var(--panel2));padding:20px;margin-bottom:16px}
.work-hero .wh-glow{position:absolute;inset:0;pointer-events:none}
/* A grid rather than a flex row: on a phone the subtitle drops to its own full-width line
   instead of being squeezed between the logo and the ring and wrapping mid-phrase. */
.work-hero .wh-top{display:grid;position:relative;align-items:center;gap:2px 14px;
  grid-template-columns:auto minmax(0,1fr) auto;
  grid-template-areas:"fav name ring" "fav sub ring"}
.work-hero .wh-top > .fav{grid-area:fav}
.work-hero .wh-name{grid-area:name}
.work-hero .wh-sub{grid-area:sub}
.work-hero .wh-ring{grid-area:ring}
.work-hero .fav{width:52px;height:52px;border-radius:14px;flex:0 0 52px;display:grid;place-items:center;font-weight:800;font-size:21px;color:#fff;overflow:hidden;position:relative}
.work-hero .fav img{width:100%;height:100%;object-fit:contain;padding:14%}
/* min-width:0 matters: a grid item defaults to min-width:auto, so one long unbroken word would
   push straight through the column and under the ring. Clamped to two lines so a very long
   company name can never grow the row past the card either. */
.wh-name{font-size:21px;font-weight:850;letter-spacing:-.02em;line-height:1.2;min-width:0;
  overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wh-sub{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.45;min-width:0;overflow-wrap:anywhere}
/* The ring is a button — tapping it explains what the 90 days mean. The svg must scale with the
   box (it used to be a fixed 76px inside a 62px slot on phones, so the circle overflowed and the
   number inside sat off-centre). */
.wh-ring{margin-left:auto;flex:0 0 auto;position:relative;width:76px;height:76px;display:grid;
  place-items:center;background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit;
  border-radius:50%;-webkit-tap-highlight-color:transparent}
.wh-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.wh-ring .rin{position:relative;text-align:center;line-height:1}
.wh-ring .rn{display:block;font-size:21px;font-weight:850;line-height:1;font-variant-numeric:tabular-nums}
.wh-ring .rl{display:block;font-size:9px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;white-space:nowrap}
.wh-ring:active{transform:scale(.94)}
.wh-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px;position:relative}
@media(max-width:560px){
  .work-hero{padding:16px}
  .work-hero .wh-top{gap:3px 13px;grid-template-areas:"fav name ring" "sub sub sub"}
  .work-hero .wh-sub{margin-top:8px}
  .work-hero .fav{width:44px;height:44px;flex:0 0 44px;border-radius:12px;font-size:18px}
  .wh-name{font-size:17px}
  .wh-sub{font-size:12px;margin-top:2px}
  .wh-ring{width:58px;height:58px}
  .wh-ring .rn{font-size:16px}
  .wh-ring .rl{font-size:8px;margin-top:2px}
  .wh-actions{margin-top:13px;gap:7px}
}

.w-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin-bottom:18px}
.w-tile{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 12px;cursor:pointer;
  transition:.14s;min-width:0;text-align:left;color:var(--txt);font:inherit;display:block;width:100%}
.w-tile:hover{border-color:var(--line2);transform:translateY(-2px)}
.w-tile .n{font-size:23px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.w-tile .l{font-size:11px;font-weight:700;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-tile .d{font-size:10.5px;color:var(--faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- OVERVIEW AS A HOME PAGE ----
   The Work overview used to open with a button. It opens with something to read now: a line about
   where you are today, a quote, and a picture of your own map growing. Everything here is computed
   from the records — no decoration that claims something the notes don't say. */
.wov-brief{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);
  background:linear-gradient(150deg,#171a2b 0%,#141621 45%,var(--panel) 100%);padding:20px 20px 18px;margin-bottom:14px}
.wov-bloom{position:absolute;border-radius:50%;filter:blur(46px);pointer-events:none}
.wov-bloom.b1{width:230px;height:230px;top:-110px;right:-60px;background:rgba(94,106,210,.34)}
.wov-bloom.b2{width:190px;height:190px;bottom:-120px;left:-50px;background:rgba(139,147,222,.2)}
.wov-brief .bin{position:relative;z-index:1}
.wov-kicker{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--accent3);opacity:.9}
.wov-head{font-size:21px;font-weight:850;letter-spacing:-.025em;line-height:1.25;margin:7px 0 0;color:var(--txt)}
.wov-sub{font-size:13px;color:var(--muted);line-height:1.6;margin-top:6px}
.wov-quote{margin-top:16px;padding-top:15px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:12px;align-items:flex-start}
.wov-qmark{font-size:34px;line-height:.8;color:var(--accent3);opacity:.45;font-weight:800;flex:0 0 auto;margin-top:2px}
.wov-qt{min-width:0}
.wov-qt q{quotes:none;display:block;font-size:14.5px;line-height:1.6;color:#dfe1ea;font-style:italic}
.wov-qby{font-size:11.5px;font-weight:700;color:var(--faint);margin-top:6px;letter-spacing:.02em}

.wov-grow{margin-bottom:14px}
.wov-gtop{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:2px}
.wov-gn{font-size:30px;font-weight:850;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.wov-gl{font-size:12px;color:var(--muted);padding-bottom:3px;min-width:0}
.wov-gd{margin-left:auto;font-size:11.5px;font-weight:750;padding-bottom:3px;white-space:nowrap}
.wov-spark{width:100%;height:88px;display:block;margin-top:10px;overflow:visible}
.wov-gaxis{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:5px}
.wov-glegend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--faint);margin-top:9px}
.wov-glegend b{color:var(--muted);font-weight:750}

.wov-faces{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.wov-faces::-webkit-scrollbar{display:none}
.wov-face{flex:0 0 78px;width:78px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;
  padding:11px 7px 9px;text-align:center;cursor:pointer;transition:.14s}
.wov-face:hover{border-color:var(--line2);transform:translateY(-2px)}
.wov-face .ent-ico{width:36px;height:36px;flex:0 0 36px;border-radius:12px;font-size:13px;margin:0 auto}
.wov-face .fn{font-size:11px;font-weight:750;color:var(--txt);margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wov-face .fd{font-size:10px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wov-cov{display:flex;flex-direction:column;gap:9px}
.wov-crow{display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:10px;padding:4px 6px;transition:.12s;min-width:0}
.wov-crow:hover{background:var(--panel2)}
.wov-cname{flex:0 0 33%;max-width:33%;font-size:12.5px;font-weight:700;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wov-cbar{flex:1 1 0;min-width:0;height:9px;border-radius:6px;background:var(--line);overflow:hidden}
.wov-cfill{height:100%;border-radius:6px;transition:width .3s}
.wov-cn{flex:0 0 auto;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.wov-thin{color:var(--warn)}

.wov-know{border-radius:16px;border:1px solid rgba(198,164,92,.3);background:linear-gradient(150deg,rgba(198,164,92,.1),rgba(198,164,92,.03));padding:15px 16px;margin-bottom:14px;cursor:pointer;transition:.14s}
.wov-know:hover{border-color:rgba(198,164,92,.5)}
.wov-know .kh{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);display:flex;align-items:center;gap:7px}
.wov-know .kh svg{width:14px;height:14px;flex:0 0 14px}
.wov-know .kf{font-size:14.5px;line-height:1.55;color:var(--txt);margin-top:9px;font-weight:600}
.wov-know .km{font-size:11.5px;color:var(--faint);margin-top:7px}
@media(max-width:520px){
  .wov-head{font-size:18.5px}
  .wov-brief{padding:17px 16px 15px}
  .wov-cname{flex-basis:42%;max-width:42%}
}

/* The UA sheet hides [hidden] with display:none, but ANY author display rule beats it — and most
   rows here are display:flex. Without this the list filter sets .hidden on every non-matching row
   and nothing moves. It is the one place !important earns its keep. */
[hidden]{display:none!important}
/* ---- the search/sort bar that sits above any list ---- */
.lfilt{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 2px 10px}
.lf-box{flex:1 1 190px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;padding:0 10px;transition:.14s}
.lf-box:focus-within{border-color:var(--accent2);background:var(--panel2)}
.lf-box>svg{width:15px;height:15px;flex:0 0 15px;color:var(--faint)}
.lf-input{flex:1 1 0;min-width:0;background:none;border:none;outline:none;color:var(--txt);
  font:inherit;font-size:13.5px;font-weight:600;padding:9px 0}
.lf-input::placeholder{color:var(--faint);font-weight:500}
.lf-clear{flex:0 0 auto;background:none;border:none;cursor:pointer;color:var(--faint);padding:3px;display:grid;place-items:center;border-radius:6px}
.lf-clear:hover{color:var(--txt);background:var(--panel2)}
.lf-clear svg{width:13px;height:13px}
.lf-sorts{display:flex;gap:6px;flex-wrap:wrap}
.lf-sorts .chip{cursor:pointer;white-space:nowrap}
.lf-count{flex:0 0 auto;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.lf-none{flex:1 1 100%;font-size:13px;color:var(--muted);padding:14px 2px 4px;text-align:center}
.lf-reset{background:none;border:none;color:var(--accent3);font:inherit;font-weight:750;cursor:pointer;padding:0 2px}
/* a filtered tree is a flat list of matches — the indent guides describe a shape that is no
   longer on screen, so they come off while a search is running */
[data-lfz].lf-on .ent-row{margin-left:0!important}
[data-lfz].lf-on .ppl-rail{display:none}
@media(max-width:430px){ .lf-box{flex-basis:100%} }

.ent-row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;cursor:pointer;transition:.12s;min-width:0}
.ent-row:hover{background:var(--panel2)}
.ent-row+.ent-row{border-top:1px solid var(--line)}
.ent-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 30px;font-size:11px;font-weight:800;color:#fff;overflow:hidden;position:relative}
.ent-ico img{width:100%;height:100%;object-fit:cover}
.ent-ico svg{width:15px;height:15px}
.ent-body{flex:1;min-width:0}
.ai-models{margin-top:8px}
.ai-models .chip{cursor:pointer;max-width:100%}
.ai-models .chip.on{border-color:var(--accent);color:var(--accent3)}
.mode-list{display:flex;flex-direction:column;gap:8px}
.mode-opt{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel2);text-align:left;cursor:pointer;color:var(--txt);min-width:0}
.mode-opt.on{border-color:var(--accent);background:rgba(94,106,210,.1)}
.mode-opt b{display:block;font-size:13.5px;font-weight:800}
.mode-opt i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.mode-dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--line2);flex:0 0 15px;margin-top:2px}
.mode-opt.on .mode-dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--panel)}
#lockGate{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:24px;
  padding-top:calc(24px + env(safe-area-inset-top))}
.lock-card{width:100%;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:11px}
.lock-mark{width:56px;height:56px;border-radius:16px;margin:0 auto 4px}
.lock-card h2{margin:0;font-size:21px;font-weight:850;letter-spacing:-.02em}
.lock-card p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.lock-card input{width:100%;text-align:center;font-size:15px;padding:12px}
.lock-err{font-size:12.5px;color:var(--bad);font-weight:700;min-height:17px;line-height:1.4}
.lock-foot{font-size:11.5px;color:var(--faint);line-height:1.6;margin-top:6px}
.lock-warn{background:rgba(198,164,92,.12);border:1px solid rgba(198,164,92,.34);border-radius:12px;
  padding:11px 13px;font-size:12.5px;color:var(--muted);line-height:1.65}
.lock-warn b{color:var(--warn)}
.lock-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.add-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(130px,100%),1fr));gap:8px}
.add-tile{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel2);font-weight:700;font-size:13px;color:var(--txt);text-align:left;min-width:0}
.add-tile:hover{border-color:var(--accent);background:var(--panel)}
.add-tile .ai{display:grid;place-items:center;flex:0 0 20px}
.add-tile .ai svg{width:17px;height:17px}
.add-tile span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-wrap{display:flex;flex-direction:column;gap:7px;min-width:0}
.pick-new{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pick-new input{flex:1 1 150px;min-width:0}
.pick-find{display:flex;gap:8px;align-items:center;min-width:0}
/* Visually secondary to the select beneath it — it's how you find the answer, not the answer */
.pick-find input.pick-q{flex:1 1 auto;min-width:0;font-size:12.5px;padding:8px 11px}
.pick-q::-webkit-search-cancel-button{filter:invert(.6)}
.pick-count{flex:0 0 auto;font-size:11px;color:var(--faint);white-space:nowrap}
.ent-name{font-weight:750;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent-meta{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent-tail{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--faint);white-space:nowrap}
.st-pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
.ent-empty{text-align:center;padding:26px 18px;color:var(--faint);font-size:12.5px;line-height:1.6}

.cap-ta{min-height:150px;font-size:15px;line-height:1.6}
.cap-mic{display:flex;align-items:center;gap:8px;justify-content:center;padding:12px;border-radius:12px;border:1.5px dashed var(--line2);color:var(--muted);font-weight:700;font-size:13px;width:100%;transition:.15s}
.cap-mic:hover{border-color:var(--accent);color:var(--accent3)}
.cap-mic svg{width:18px;height:18px;flex:0 0 18px}
.cap-mic.rec{border-color:var(--hot);color:var(--hot);border-style:solid;background:rgba(207,114,115,.08)}
.cap-mic .pulse{width:9px;height:9px;border-radius:50%;background:var(--hot);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.cap-hint{font-size:11.5px;color:var(--faint);text-align:center;margin-top:9px;line-height:1.5}
/* photographing a note: the buttons, the thumbnails, and the full-size view */
.cap-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.cap-tool{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:11px;border:1.5px dashed var(--line2);color:var(--muted);font-weight:700;font-size:12.5px;transition:.15s;min-width:0}
.cap-tool:hover{border-color:var(--accent);color:var(--accent3)}
.cap-tool svg{width:17px;height:17px;flex:0 0 17px}
.cap-tool span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap-tool-hint{font-size:11.5px;color:var(--faint);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto}
.shot-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.shot-cell{position:relative;flex:0 0 auto}
.shot-thumb{width:74px;height:74px;object-fit:cover;border-radius:10px;border:1px solid var(--line2);background:var(--card2);cursor:zoom-in;display:block}
/* the bytes are on another device — say so rather than showing a broken frame */
.shot-thumb[data-shot-missing]{cursor:default;object-fit:contain;border-style:dashed;opacity:.85}
.shot-x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line2);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.shot-x svg{width:12px;height:12px}
.shot-x:hover{color:var(--bad);border-color:var(--bad)}
#editorOverlay .card.drop-on{outline:2px dashed var(--accent);outline-offset:-6px}
