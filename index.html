function filtered(){
  const q=searchQ.trim().toLowerCase();
  let list=state.opportunities.slice();
  if(activeFilter) list=list.filter(activeFilter.test);
  if(q){ list=list.filter(o=>{
    const hay=[o.company,o.role,o.location,o.notes,o.product,o.vibes,o.referrer,(o.tags||[]).join(" "),(o.people||[]).map(p=>p.name+" "+p.title).join(" ")].join(" ").toLowerCase();
    return hay.includes(q);
  }); }
  return list;
}

/* ---------------- DASHBOARD ---------------- */
function renderDashboard(){
  const ops=state.opportunities;
  if(!ops.length) return emptyState();
  const active=activeCount();
  const offers=ops.filter(o=>o.status==="offer").length;
  const interviewing=ops.filter(o=>["recruiter","hm","technical","onsite"].includes(o.status)).length;
  const applied=ops.filter(o=>o.status!=="wishlist").length;
  const advanced=ops.filter(o=>["hm","technical","onsite","offer","hired"].includes(o.status)).length;
  const respRate=applied?Math.round(advanced/applied*100):0;
  const followups=ops.filter(needsFollowup);
  const week=ops.map(o=>({o,e:nextEvent(o)})).filter(x=>x.e&&x.e.du>=0&&x.e.du<=7).sort((a,b)=>a.e.du-b.e.du);
  const avgExc=ops.filter(o=>o.excitement).length? (ops.reduce((s,o)=>s+(+o.excitement||0),0)/ops.filter(o=>o.excitement).length).toFixed(1):"—";

  const stat=(num,lbl,icon,cls,tile)=>`<div class="stat ${cls||''}" ${tile?`data-tile="${tile}" role="button" tabindex="0"`:""}><div class="ico">${icon}</div><div class="num">${num}</div><div class="lbl">${lbl}</div>${tile?`<div class="tile-go">→</div>`:""}</div>`;

  let html=riskBanner()+dashHero(ops);
  html+=`<div class="grid stat-grid">
    ${stat(interviewing,"Interviewing",I.user,"","interviewing")}
    ${stat(offers,"Offers",I.trophy,"","offers")}
    ${stat(avgExc==="—"?"—":avgExc+"★","Avg fit",I.spark,"")}
    ${stat(respRate+"%","Advance",I.board,"","advance")}
  </div>`;

  // Compare competing offers (only surfaces once ≥2 offers are in play)
  html+=scorecardTeaser();

  // If the hero is busy with the job search, your company still gets a way in
  const heroIsWork = employers().length && !ops.some(o=>{const e=nextEvent(o); return e&&e.du>=0;}) && !offers;
  if(!heroIsWork) html+=workStrip();

  // Next moves — the unified, prioritized action hub
  html+=renderMovesHub(ops);

  // Pipeline funnel
  html+=`<div class="section-head"><h3>Pipeline</h3><div class="line"></div><span class="tag">${active} active</span></div>`;
  html+=`<div class="card panel">${funnelChart()}</div>`;

  return html;
}

/* The dashboard hero — the app's visual hook. Adapts to your search:
   1) a LIVE countdown to your next interview, 2) offers on the table, or 3) momentum.
   Aurora is tinted by the next company's color, with a subtle Meanwhile watermark. */
function heroShell(inner, tint){
  const t = tint ? `<div class="hero-tint" style="background:radial-gradient(52% 62% at 26% 26%, ${tint}5c, transparent 62%)"></div>` : "";
  return `<div class="hero"><div class="hero-aurora"></div>${t}<img src="icon.png" class="hero-mark" alt="" aria-hidden="true"/><div class="hero-grain"></div><div class="hero-inner">${inner}</div></div>`;
}
function heroCountParts(ms){
  if(ms<=0) return {num:"Now",unit:"go time",cls:"now"};
  const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s/60)%60, sec=s%60, pad=n=>String(n).padStart(2,"0");
  return {num:`${h}:${pad(m)}:${pad(sec)}`, unit:"to go", cls:"clock"};
}
let heroTimer=null;
function armHeroCountdown(){
  if(heroTimer){ clearInterval(heroTimer); heroTimer=null; }
  const node=document.getElementById("heroCount"); if(!node) return;
  const deadline=+node.dataset.deadline; if(!deadline) return;
  const tick=()=>{
    const n=document.getElementById("heroCount"); if(!n){ clearInterval(heroTimer); heroTimer=null; return; }
    const left=deadline-Date.now(), p=heroCountParts(left);
    const numEl=n.querySelector(".hc-num"), unitEl=n.querySelector(".hc-unit");
    if(numEl){ numEl.textContent=p.num; numEl.className="hc-num "+(p.cls||""); }
    if(unitEl) unitEl.textContent=p.unit;
    // once it passes, advance the hero to the next event (only if nothing's open)
    if(left<-1000 && view==="dashboard" && !editorEl && !$("#drawer").classList.contains("show")){ clearInterval(heroTimer); heroTimer=null; render(); }
  };
  tick(); heroTimer=setInterval(tick,1000);
}
function dashHero(ops){
  const up = ops.map(o=>({o,e:nextEvent(o)})).filter(x=>x.e&&x.e.du>=0).sort((a,b)=>a.e.du-b.e.du);
  const offers = ops.filter(o=>o.status==="offer");

  if(up.length){
    const {o,e}=up[0];
    const tint=colorFor(o.company);
    const target = e.time ? (()=>{ const d=new Date(e.date+"T"+e.time); return isNaN(d)?null:d.getTime(); })() : null;
    const left = target!=null ? target-Date.now() : null;
    const live = left!=null && left < 24*3600*1000 && left > -60*60*1000;  // tick within the final 24h
    let countInner, countAttr="";
    if(live){ const p=heroCountParts(left); countInner=`<div class="hc-num ${p.cls}">${p.num}</div><div class="hc-unit">${p.unit}</div>`; countAttr=`id="heroCount" data-deadline="${target}"`; }
    else { const num=e.du===0?"Today":e.du===1?"1":String(e.du); const unit=e.du===0?"go time":e.du===1?"day to go":"days to go"; countInner=`<div class="hc-num${e.du===0?" now":""}">${num}</div><div class="hc-unit">${unit}</div>`; }
    const when = fmtDateTime(e.date,e.time)||fmtDate(e.date);
    const inner=`
      <div class="hero-main">
        <div class="hero-eyebrow">${I.clock}<span>Next up</span></div>
        <div class="hero-co">${favHTML(o,"hero-fav")}
          <div style="min-width:0"><div class="hero-name">${esc(o.company)}</div><div class="hero-role">${esc(e.label)}${o.role?` · ${esc(o.role)}`:""}</div></div>
        </div>
        <div class="hero-when">${esc(when)}</div>
        <div class="hero-actions">
          <button class="btn primary sm" data-open="${o.id}">Open role</button>
          <button class="btn ghost sm hero-btn" data-gen-hero="${o.id}">${I.ai} Prep me</button>
          ${e.link?`<a class="btn ghost sm hero-btn" href="${esc(safeUrl(e.link))}" target="_blank" rel="noopener">${I.link} Join</a>`:""}
        </div>
      </div>
      <div class="hero-count" ${countAttr}>${countInner}</div>`;
    return heroShell(inner, tint);
  }

  if(offers.length){
    const multi=offers.length>1;
    const inner=`
      <div class="hero-main">
        <div class="hero-eyebrow">${I.trophy}<span>${multi?"On the table":"You've got an offer"}</span></div>
        <div class="hero-name" style="font-size:22px">${multi?`${offers.length} offers to weigh`:esc(offers[0].company)}</div>
        <div class="hero-role">${multi?"Score them side by side and decide with confidence.":`${esc(offers[0].role||"Offer")} — make the call.`}</div>
        <div class="hero-actions">
          ${multi?`<button class="btn primary sm" data-act="open-scorecard">${I.trophy} Compare offers</button>`:`<button class="btn primary sm" data-open="${offers[0].id}">Open offer</button>`}
        </div>
      </div>
      <div class="hero-count"><div class="hc-num">${offers.length}</div><div class="hc-unit">${multi?"offers":"offer"}</div></div>`;
    return heroShell(inner, "#4ea381");
  }

  // nothing pending in the search, but you've got a job — the day-to-day leads instead
  const emp=employers();
  if(emp.length) return workHeroCard(emp[0]);

  // momentum: active roles but nothing scheduled — a prompt, not another count
  const active=ops.filter(o=>stage(o.status).active && o.status!=="wishlist").length;
  const nudges=ops.filter(needsFollowup).length;
  const head = nudges ? `${nudges} ${nudges===1?"role needs":"roles need"} a nudge`
            : active ? "Nothing scheduled"
            : "Let's line up your first interview";
  const sub = nudges ? "A quick follow-up keeps them warm and top of mind."
            : active ? "Add an interview or paste a job link to keep the momentum going."
            : "Paste a job posting, recruiter email or invite — I'll set up the rest.";
  const inner=`
    <div class="hero-main hero-prompt">
      <div class="hero-eyebrow">${I.spark}<span>Your search</span></div>
      <div class="hero-name" style="font-size:23px">${head}</div>
      <div class="hero-role" style="max-width:48ch;white-space:normal">${sub}</div>
      <div class="hero-actions">
        <button class="btn primary sm" data-act="smart-paste">${I.ai} Smart add</button>
        ${nudges?`<button class="btn ghost sm hero-btn" data-tile="nudge">Review follow-ups</button>`:`<button class="btn ghost sm hero-btn" data-act="add">＋ Add role</button>`}
      </div>
    </div>`;
  return heroShell(inner);
}

/* ---- "Is this actually safe?" — the app should answer that without being asked ----
   Everything lives in this browser's storage. Clearing site data wipes it, and iOS Safari bins
   script storage for sites you haven't opened in 7 days unless they're on the home screen. So if
   there's no cloud sync and no recent backup, say so plainly instead of letting a year of notes
   sit one tap from gone. */
function backupRisk(){
  if(!state.opportunities.length) return null;          // nothing to lose yet
  if(syncOn()) return null;                             // synced to a database they own
  if((devPrefs.riskSnoozed||0) > Date.now()-7*86400000) return null;
  const last=devPrefs.lastExport||0;
  const days=last?Math.floor((Date.now()-last)/86400000):null;
  if(days!=null && days<14) return null;
  const notes=W().captures.length, ppl=state.opportunities.reduce((n,o)=>n+(o.people||[]).length,0);
  return {days, never:!last, notes, ppl};
}
function riskBanner(){
  const r=backupRisk(); if(!r) return "";
  const what=[state.opportunities.length+" "+(state.opportunities.length===1?"role":"roles"), r.ppl?r.ppl+" people":"", r.notes?r.notes+" notes":""].filter(Boolean).join(", ");
  return `<div class="risk">
    <div class="risk-ico">${I.bell}</div>
    <div class="risk-b">
      <div class="risk-t">${r.never?"Nothing is backed up":`Your last backup was ${r.days} days ago`}</div>
      <div class="risk-s">${esc(what)} live only in this browser. Clearing your browsing data — or leaving the site untouched for a week on an iPhone — would take it with them.</div>
    </div>
    <div class="risk-a">
      <button class="btn primary sm" data-act="export">${I.copy} Back up now</button>
      <button class="btn ghost sm" data-act="settings">☁ Turn on sync</button>
      <button class="btn ghost sm" data-act="risk-snooze" title="Remind me in a week">Later</button>
    </div></div>`;
}

/* Safari evicts site data for sites left untouched for about a week, and IndexedDB — where every
   photo lives — goes with it. A granted persistence request exempts the origin. It is a request,
   not a guarantee (browsers grant it on their own criteria, typically once a site looks "used"),
   so the answer is recorded and shown rather than assumed. */
async function askPersistentStorage(){
  try{
    if(!navigator.storage||!navigator.storage.persist) return;
    if(navigator.storage.persisted && await navigator.storage.persisted()){ devPrefs.persisted=true; saveDev(); return; }
    devPrefs.persisted = await navigator.storage.persist();
    saveDev();
  }catch(e){}
}

      ${syncOn()?"<b>Cloud sync is on</b>, so your own database holds a copy — that's your safety net.":"<b>Cloud sync is off.</b> A backup file or sync is the only thing standing between you and a cleared browser."}
    </div>

/* Encryption lives with the data section, because that is what it is about — not "security
   settings" in the abstract, but whether these particular notes are readable by anyone else. */
/* The passphrase lock has been retired in favour of accounts: a login does the same job without
   the failure mode where a forgotten passphrase means the data is gone forever. The machinery to
   OPEN a sealed vault stays forever — deleting it would strand anyone who turned it on — but it
   can no longer be switched on, and anyone still holding one is offered the way out. */
function lockBox(){
  if(!lockKey) return "";
  return `<div class="lock-row" style="border-top:1px solid var(--line);padding-top:12px;margin-top:14px">
    <div style="flex:1 1 220px;min-width:0">

      <div style="font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:3px">This is the old protection, from before accounts.
        Your account password now guards your notes, and unlike a passphrase it can be reset if you forget it.
        Turning this off keeps everything exactly as it is — you just stop being asked for the passphrase.</div>
    </div>
    <button class="btn ghost sm" data-act="lock-off">Turn it off</button>
  </div>`;
}

/* ---- Next moves: one prioritized action queue across every role ---- */
function nextMoves(ops){
  const moves=[];
  ops.forEach(o=>{
    const st=stage(o.status);
    if(!st.active && o.status!=="offer") return; // skip closed/rejected
    (o.rounds||[]).forEach(r=>{
      if(r.date && r.status!=="done" && r.status!=="cancelled"){ const du=daysUntil(r.date); if(du!=null && du>=0 && du<=14) moves.push({o,type:"interview",rid:r.id,label:r.name||r.type||"Interview",du,date:r.date,time:r.time}); }
      if(r.status==="done" && r.date && !r.thanked){ const du=daysUntil(r.date); if(du!=null && du<=0 && du>=-2) moves.push({o,type:"thanks",rid:r.id,label:`Thank-you · ${r.name||r.type||"interview"}`,du:0.4,date:r.date}); }
    });
    if(o.nextActionDate){ const du=daysUntil(o.nextActionDate); if(du!=null && du<=14) moves.push({o,type:"task",label:o.nextActionLabel||"Next step",du,date:o.nextActionDate}); }
    if(o.offer&&o.offer.deadline){ const du=daysUntil(o.offer.deadline); if(du!=null && du<=21) moves.push({o,type:"offer",label:"Decide on offer",du,date:o.offer.deadline}); }
    if(needsFollowup(o)) moves.push({o,type:"followup",label:"Follow up — gone quiet",du:9000,quiet:daysSince(o.updatedAt)});
  });
  return moves.sort((a,b)=>a.du-b.du);
}
const MOVE_META={
  interview:{ico:()=>I.cal,col:"var(--accent3)"},
  thanks:{ico:()=>I.ai,col:"var(--good)"},
  task:{ico:()=>I.check,col:"var(--accent2)"},
  offer:{ico:()=>I.trophy,col:"var(--warn)"},
  followup:{ico:()=>I.bell,col:"var(--hot)"},
};
function moveActions(m){
  const o=m.o;
  if(m.type==="interview") return `<button class="btn sm ghost" data-gen-hero="${o.id}">${I.ai} Prep</button>`;
  if(m.type==="thanks") return `<button class="btn sm ghost" data-gen-ty="${m.rid}">${I.ai} Write</button><button class="btn sm ghost" data-thanked="${m.rid}" title="Mark sent">✓</button>`;
  if(m.type==="task") return `<button class="btn sm ghost" data-task-done="${o.id}">✓ Done</button>`;
  if(m.type==="offer") return state.opportunities.filter(x=>x.status==="offer").length>1?`<button class="btn sm ghost" data-act="open-scorecard">Compare</button>`:"";
  if(m.type==="followup") return `<button class="btn sm ghost" data-followup="${o.id}">${I.ai} Draft</button>`;
  return "";
}
function renderMovesHub(ops){
  const moves=nextMoves(ops);
  if(!moves.length) return `<div class="section-head"><h3>Next moves</h3><div class="line"></div></div>
    <div class="card panel" style="text-align:center;color:var(--faint);font-size:13px;padding:24px">🎉 You're all caught up — nothing needs you right now.</div>`;
  let h=`<div class="section-head"><h3>Next moves</h3><div class="line"></div><span class="tag">${moves.length}</span></div><div class="card panel" style="padding:5px">`;
  h+=moves.map(m=>{
    const md=MOVE_META[m.type]||MOVE_META.task;
    const overdue = m.du<0;
    const due = m.type==="followup" ? `${m.quiet}d quiet`
             : m.type==="thanks" ? "Send today"
             : overdue ? `${Math.abs(Math.round(m.du))}d ago`
             : m.du===0 ? "Today" : relDays(m.du);
    const dueCol = overdue?'var(--bad)':m.du===0?'var(--warn)':m.type==="followup"?'var(--hot)':'var(--accent2)';
    return `<div class="move" data-open="${m.o.id}">
      <div class="move-ico" style="color:${md.col};background:${md.col}1f">${md.ico()}</div>
      ${favHTML(m.o,'move-fav')}
      <div class="move-body"><div class="move-label">${esc(m.label)}</div><div class="move-co">${esc(m.o.company)}${m.o.role?` · ${esc(m.o.role)}`:""}</div></div>

/* ---------------- TABLE ---------------- */
function isMobile(){ return window.matchMedia("(max-width:860px)").matches; }
function sortRoles(list){
  const {key,dir}=tableSort;
  return list.sort((a,b)=>{
    let va,vb;
    if(key==="stage"){ va=allStages().findIndex(s=>s.id===a.status); vb=allStages().findIndex(s=>s.id===b.status); }
    else if(key==="next"){ va=(nextEvent(a)||{du:99999}).du; vb=(nextEvent(b)||{du:99999}).du; }
    else if(key==="excitement"){ va=+a.excitement||0; vb=+b.excitement||0; }
    else { va=(a[key]||"").toString().toLowerCase(); vb=(b[key]||"").toString().toLowerCase(); }
    if(va<vb) return -dir; if(va>vb) return dir; return 0;
  });
}
function compRange(o){ if(!o.compMin&&!o.compMax) return ""; if(o.compMin&&o.compMax) return fmtMoney(o.compMin)+"–"+fmtMoney(o.compMax); return fmtMoney(o.compMin||o.compMax); }

/* Search reaches into everything you know about the places you've worked, not just the roles */
function searchWork(q){
  q=q.trim().toLowerCase(); if(q.length<2) return [];
  const T=q.split(/\s+/).filter(Boolean);
  const out=[];
  employers().forEach(o=>{
    ["person","project","problem","system","department","team","process","decision","question","info","capture"].forEach(t=>{
      entAll(t,o.id).forEach(r=>{
        const hay=[entName(t,r),entRowMeta(t,r),r.text,r.description,r.note,r.notes,r.reason,r.answer,(r.expertise||[]).join(" ")].filter(Boolean).join(" ").toLowerCase();
        const score=T.filter(x=>hay.includes(x)).length;
        if(score) out.push({t,r,o,score});
      });
    });
  });
  return out.sort((a,b)=>b.score-a.score).slice(0,24);
}
function renderCards(){
  const all=sortRoles(filtered());
  const found=searchQ?searchWork(searchQ):[];
  const foundHTML = found.length ? `<div class="section-head"><h3>From your companies</h3><div class="line"></div><span class="tag">${found.length}</span></div>
    <div class="card panel" style="padding:5px;margin-bottom:18px">${found.map(f=>entRow(f.t,f.r,{meta:[ENT[f.t].label,f.o.company,entRowMeta(f.t,f.r)].filter(Boolean).join(" · ")})).join("")}</div>` : "";
  if(!all.length) return foundHTML+`<div class="empty"><div class="big">${I.cards}</div><h3>${searchQ?(found.length?"No matching roles":"No matches"):"No roles yet"}</h3><p>${searchQ?"Try a different search.":"Add a role to get started."}</p></div>`;
  if(foundHTML) return foundHTML+`<div class="section-head"><h3>Roles</h3><div class="line"></div></div>`+renderCardsGrid(all);
  return renderCardsGrid(all);
}
function renderCardsGrid(all){
  // a job you took isn't "closed" — it stays visible, badged Employee
  const isLive=o=>stage(o.status).active||o.status==="hired";
  const closedN=all.filter(o=>!isLive(o)).length;
  const list=cardsShowClosed?all:all.filter(isLive);
  const sorts=[["updatedAt","Recent"],["next","Next call"],["excitement","Fit"],["company","A–Z"],["stage","Stage"]];
  const sortChips=sorts.map(([k,l])=>`<span class="chip ${tableSort.key===k?'tag-chip':''}" data-sort="${k}" style="cursor:pointer;white-space:nowrap">${l}${tableSort.key===k?(tableSort.dir>0?" ↑":" ↓"):""}</span>`).join("");

  return chips+`<div class="job-grid">${list.map(jobCard).join("")}</div>`;
}

/* ---------------- CALENDAR / UPCOMING ---------------- */
function calEvents(){
  const events=[];
  state.opportunities.forEach(o=>{
    (o.rounds||[]).forEach(r=>{ if(r.date && r.status!=="cancelled"){ events.push({o,rid:r.id,date:r.date,time:r.time,label:r.name||r.type,type:"Interview",link:r.link,done:r.status==="done"}); } });
    if(o.nextActionDate) events.push({o,date:o.nextActionDate,time:"",label:o.nextActionLabel||"Next step",type:"Task",link:o.nextMeetingLink});
    if(o.offer&&o.offer.deadline) events.push({o,date:o.offer.deadline,time:"",label:"Offer decision deadline",type:"Deadline"});
  });
  events.sort((a,b)=> (a.date+(a.time||"99:99")).localeCompare(b.date+(b.time||"99:99")));
  return events;
}
function calToggle(){
  const seg=(id,label,icon)=>`<button class="seg ${calMode===id?'on':''}" data-calmode="${id}">${icon} ${label}</button>`;

}
function renderCalendar(){
  if(calMode==="timeline") return calToggle()+renderTimeline();

/* ---------------- MONTH GRID ---------------- */
function ymd(y,m,d){ return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
function todayYMD(){ const n=new Date(); return ymd(n.getFullYear(),n.getMonth(),n.getDate()); }
const chevL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>';
const chevR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 18 6-6-6-6"/></svg>';
function renderMonth(){
  const events=calEvents();
  const byDay={}; events.forEach(e=>{ (byDay[e.date]=byDay[e.date]||[]).push(e); });
  const cur = calCursor || (()=>{ const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),1); })();
  const y=cur.getFullYear(), m=cur.getMonth();
  const startDow=new Date(y,m,1).getDay(), daysIn=new Date(y,m+1,0).getDate();
  const tStr=todayYMD();

  const dow=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="cal-dow">${d}</div>`).join("");
  const totalCells=Math.ceil((startDow+daysIn)/7)*7;

  for(let i=0;i<totalCells;i++){
    const dn=i-startDow+1;
    if(dn<1||dn>daysIn){ cells+=`<div class="cal-cell empty"></div>`; continue; }
    const ds=ymd(y,m,dn), list=(byDay[ds]||[]);
    const chips=list.slice(0,3).map(e=>{ const c=e.type==="Interview"?"#a6abe6":e.type==="Deadline"?"#cf7273":"#8b93de"; return `<div class="cal-ev" style="background:${c}22;color:${c}" title="${esc(e.o.company)} · ${esc(e.type)}: ${esc(e.label)}">${esc(e.o.company)}</div>`; }).join("");
    const more=list.length>3?`<div class="cal-more">+${list.length-3} more</div>`:"";
    const dots=list.slice(0,5).map(e=>`<span class="cal-dot" style="background:${cssCol(stage(e.o.status).color)}"></span>`).join("");
    cells+=`<div class="cal-cell${ds===tStr?' today':''}${ds===calSel?' sel':''}${list.length?' has':''}" data-calday="${ds}">
      <div class="cal-dnum">${dn}</div>
      <div class="cal-evs">${chips}${more}</div>
      <div class="cal-dots">${dots}</div>
    </div>`;
  }

  const header=`<div class="cal-head">
    <button class="cal-nav" data-calnav="-1" title="Previous month">${chevL}</button>
    <div class="cal-title">${cur.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div>
    <button class="cal-nav" data-calnav="1" title="Next month">${chevR}</button>
    <button class="btn ghost sm" data-calnav="0" style="margin-left:6px">Today</button>
  </div>`;

  // detail panel for the selected day (or today)
  const dDate = calSel || tStr;

  const longDate = new Date(dDate+'T00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  let detail="";
  if(dList.length){
    detail=`<div class="cal-detail"><div class="cal-detail-h">${longDate}</div>`+dList.map(e=>{
      const d=daysUntil(e.date), c=stage(e.o.status).color;
      const ck=e.rid||(e.type==="Task"?e.o.id+"|task":e.type==="Deadline"?e.o.id+"|offer":"");
      return `<div class="sub-item" data-open="${e.o.id}" style="cursor:pointer;display:flex;align-items:center;gap:11px">
        <span class="pill" style="background:${c}22;color:${c}"><span class="dot" style="background:${c}"></span>${e.type}</span>
        <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:13.5px">${esc(e.label)}</div>
          <div style="color:var(--muted);font-size:12px;margin-top:2px">${esc(e.o.company)}${e.time?" · "+fmtDateTime(e.date,e.time).split("· ")[1]:""}${e.link?` · <a href="${esc(safeUrl(e.link))}" target="_blank" rel="noopener">join</a>`:""}${ck&&d>=0?` · <span data-ics="${ck}" style="color:var(--accent2);cursor:pointer;font-weight:700">+ cal</span> · <span data-gcal="${ck}" style="color:var(--accent2);cursor:pointer;font-weight:700">Google ↗</span>`:""}${ck?` · <span data-cal-edit="${ck}" style="color:var(--accent3);cursor:pointer;font-weight:700">edit</span> · <span data-cal-del="${ck}" style="color:var(--bad);cursor:pointer;font-weight:700">delete</span>`:""}</div>
        </div></div>`;
    }).join("")+`</div>`;

  }

  return `<div class="calendar">${header}<div class="cal-grid">${dow}${cells}</div>${detail}</div>`;
}

/* ---------------- TIMELINE (per-job swimlanes) ---------------- */
function tlMs(d){ if(!d) return null; const t=new Date(d.length<=10? d+'T00:00': d).getTime(); return isNaN(t)?null:t; }
function tlNodes(o){
  const ns=[];
  if(o.appliedDate){ const t=tlMs(o.appliedDate); if(t!=null) ns.push({t,kind:'applied',label:'Applied',date:o.appliedDate}); }
  (o.rounds||[]).forEach(r=>{ const t=tlMs(r.date); if(t!=null) ns.push({t,kind:'round',status:r.status||'',label:r.name||r.type||'Round',date:r.date,rid:r.id}); });
  if(o.offer&&o.offer.deadline){ const t=tlMs(o.offer.deadline); if(t!=null) ns.push({t,kind:'offer',label:'Offer decision',date:o.offer.deadline}); }
  if(o.nextActionDate){ const t=tlMs(o.nextActionDate); if(t!=null) ns.push({t,kind:'task',label:o.nextActionLabel||'Next step',date:o.nextActionDate}); }
  ns.sort((a,b)=>a.t-b.t);
  return ns;
}
function renderTimeline(){
  const rows=state.opportunities.map(o=>({o,ns:tlNodes(o)})).filter(x=>x.ns.length);
  if(!rows.length) return `<div class="empty"><div class="big">${I.cal}</div><h3>Nothing to chart yet</h3><p>Add an applied date or interview rounds to your roles and they'll appear as timelines here.</p></div>`;
  rows.sort((a,b)=> a.ns[0].t - b.ns[0].t);

  const today=new Date().setHours(0,0,0,0);
  let min=Infinity, max=-Infinity;
  rows.forEach(x=>x.ns.forEach(n=>{ if(n.t<min)min=n.t; if(n.t>max)max=n.t; }));
  min=Math.min(min,today); max=Math.max(max,today);
  if(min===max){ min-=7*864e5; max+=7*864e5; }
  const PAD=3, span=max-min;
  const X=t=> PAD + (t-min)/span*(100-2*PAD);
  const todayX=X(today);

  const n=rows.length;
  rows.forEach((row,i)=> row.color=`hsl(${Math.round(i*360/n)},42%,62%)`);  // unique but desaturated hue per job

  // month axis ticks
  let ticks="", cur=new Date(new Date(min).getFullYear(), new Date(min).getMonth(), 1);
  if(cur.getTime()<min) cur=new Date(cur.getFullYear(), cur.getMonth()+1, 1);
  while(cur.getTime()<=max){
    // The tick MARK sits exactly on its date; the label is what would hang off the ends, so the
    // first and last ones align inward instead of centring. Insetting the axis is not an option —
    // it would slide the months out of line with the dots they label.
    const pct=X(cur.getTime());
    const edge = pct<7 ? " at-start" : pct>93 ? " at-end" : "";
    ticks+=`<div class="tl-tick${edge}" style="left:${pct}%"><span>${cur.toLocaleDateString(undefined,{month:'short'})}${cur.getMonth()===0?" '"+String(cur.getFullYear()).slice(2):""}</span></div>`;
    cur=new Date(cur.getFullYear(), cur.getMonth()+1, 1);
  }

  const rowHTML=rows.map(row=>{
    const o=row.o, c=row.color, st=stage(o.status), closed=!st.active;
    const x1=X(row.ns[0].t), x2=X(row.ns[row.ns.length-1].t), solidEnd=Math.min(x2,todayX);
    let lines="";
    if(solidEnd>x1) lines+=`<div class="tl-line" style="left:${x1}%;width:${solidEnd-x1}%;background:${c}"></div>`;
    if(x2>todayX){ const ds=Math.max(x1,todayX); lines+=`<div class="tl-line dashed" style="left:${ds}%;width:${x2-ds}%;border-top:2px dashed ${c}"></div>`; }
    const dots=row.ns.map(nd=>{
      const px=X(nd.t), future=nd.t>today;
      let cls="tl-dot";
      if(nd.kind==='offer') cls+=" offer";
      else if(nd.kind==='task') cls+=" task";
      else if(nd.kind==='applied') cls+=" applied";
      else cls += nd.status==='done'?" done" : nd.status==='cancelled'?" cancelled" : future?" upcoming":" pending";
      return `<span class="${cls}" style="left:${px}%;--c:${c}" data-open="${o.id}" title="${esc(nd.label)} · ${esc(fmtDate(nd.date))}">${nd.kind==='offer'?'◆':''}</span>`
        // a label centred on a dot near either end would hang off the track and get shaved,
        // so the outer ones anchor to their dot instead of straddling it
        + `<span class="tl-lbl${px>78?" e":px<22?" s":""}" style="left:${px}%">${esc(nd.label)}</span>`;
    }).join("");
    return `<div class="tl-row${closed?' closed':''}">
      <div class="tl-head">
        <span class="tl-swatch" style="background:${c}"></span>
        <span class="tl-co" data-open="${o.id}">${esc(o.company)}</span>
        ${o.role?`<span class="tl-role">${esc(o.role)}</span>`:""}
        <span class="pill" style="margin-left:auto;background:${cssCol(st.color)}22;color:${cssCol(st.color)}"><span class="dot" style="background:${cssCol(st.color)}"></span>${esc(st.name)}</span>
      </div>
      <div class="tl-track">${lines}${dots}</div>
    </div>`;
  }).join("");

  const legend=`<div class="tl-legend">
    <span><i class="lg done"></i>done</span>
    <span><i class="lg upcoming"></i>upcoming</span>
    <span><i class="lg applied"></i>applied</span>
    <span><i class="lg cancelled"></i>cancelled</span>
    <span><i class="lg offer">◆</i>offer</span>
    <span class="tl-nowkey">today</span>
  </div>`;

  return `<div class="timeline">${legend}
    <div class="tl-axis">${ticks}</div>
    <div class="tl-body"><div class="tl-now" style="left:${todayX}%"></div>${rowHTML}</div>
  </div>`;
}

function pipelineContext(){
  const ops=state.opportunities;
  const act=ops.filter(o=>stage(o.status).active && o.status!=="wishlist");
  const L=[`Today is ${todayYMD()}. I'm tracking ${ops.length} processes — ${act.length} active.`,""];
  if(act.length){
    L.push("ACTIVE PROCESSES:");
    act.slice().sort((a,b)=>{const ea=nextEvent(a),eb=nextEvent(b);return (ea?ea.du:9999)-(eb?eb.du:9999);}).forEach(o=>{
      const e=nextEvent(o);
      L.push(`- ${o.company}${o.role?` (${o.role})`:""} | stage: ${stage(o.status).name}`+
        (e?` | next: ${e.label} ${fmtDate(e.date)} (${relDays(e.du)})`:` | nothing scheduled, ${daysSince(o.updatedAt)||0}d quiet`)+
        (compRange(o)?` | comp ${compRange(o)}`:"")+(o.excitement?` | fit ${o.excitement}/5`:"")+(o.source?` | via ${o.source}`:""));
      if((o.people||[]).length) L.push(`    contacts: ${o.people.map(p=>p.name+(p.title?` (${p.title})`:"")).join(", ")}`);
    });
  }
  const offers=ops.filter(o=>o.status==="offer");
  if(offers.length){ L.push("","OFFERS:"); offers.forEach(o=>{ const f=o.offer||{}; L.push(`- ${o.company}${o.role?` (${o.role})`:""}: ${[f.base&&("base "+f.base),f.bonus&&("bonus "+f.bonus),f.equity&&("equity "+f.equity)].filter(Boolean).join(", ")||compRange(o)||"details TBD"}${f.deadline?` | decide by ${fmtDate(f.deadline)}`:""}`); }); }
  return L.join("\n");
}

function funnelChart(){
  const max=Math.max(1,...activeStages().map(s=>state.opportunities.filter(o=>o.status===s.id).length));
  return activeStages().map(s=>{
    const n=state.opportunities.filter(o=>o.status===s.id).length;
    return `<div class="bar-row" style="cursor:default"><div class="nm">${esc(s.name)}</div><div class="bar-track"><div class="bar-fill" style="width:${n?Math.max(n/max*100,8):0}%;background:${cssCol(s.color)}">${n||""}</div></div></div>`;
  }).join("");
}
function donut(data){
  const total=data.reduce((s,d)=>s+d.value,0)||1;
  let a=-90, cx=70,cy=70,r=54,sw=24;
  const segs=data.map((d,i)=>{
    const frac=d.value/total; const len=frac*360; const col=colorFor(d.label+i);
    const large=len>180?1:0;
    const a2=a+len;
    const x1=cx+r*Math.cos(a*Math.PI/180), y1=cy+r*Math.sin(a*Math.PI/180);
    const x2=cx+r*Math.cos(a2*Math.PI/180), y2=cy+r*Math.sin(a2*Math.PI/180);
    a=a2;
    return `<path d="M${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="${sw}"/>`;
  }).join("");
  const legend=data.sort((a,b)=>b.value-a.value).map((d,i)=>`<div class="legend-row"><span class="dot" style="background:${colorFor(d.label+data.indexOf(d))}"></span><span>${esc(d.label)}</span><span class="v">${d.value}</span></div>`).join("");
  return `<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap"><svg viewBox="0 0 140 140" width="140" height="140" style="flex:0 0 140px">${segs}<text x="70" y="66" text-anchor="middle" fill="#e7ecf6" font-size="26" font-weight="800">${total}</text><text x="70" y="84" text-anchor="middle" fill="#6b7795" font-size="11" font-weight="700">total</text></svg><div class="legend" style="flex:1;min-width:140px">${legend}</div></div>`;
}

/* ============================ OFFER SCORECARD ============================ */
// A weighted decision matrix across competing offers. Criteria + weights are global
// (state.scorecard.criteria); per-offer ratings live in state.scorecard.scores[opId][critId].
// Lazily initialised so it only persists once the user actually touches it.
function defaultCriteria(){ return [
  {id:"c_comp",    name:"Compensation",      weight:25},
  {id:"c_growth",  name:"Role & growth",     weight:20},
  {id:"c_team",    name:"Team & manager",    weight:15},
  {id:"c_culture", name:"Culture & values",  weight:15},
  {id:"c_wlb",     name:"Work–life balance", weight:15},
  {id:"c_mission", name:"Mission & product", weight:10},
]; }
function getScorecard(){
  if(!state.scorecard || typeof state.scorecard!=="object") state.scorecard={};
  if(!Array.isArray(state.scorecard.criteria) || !state.scorecard.criteria.length) state.scorecard.criteria=defaultCriteria();
  if(!state.scorecard.scores || typeof state.scorecard.scores!=="object") state.scorecard.scores={};
  return state.scorecard;
}
function scOffers(){ return state.opportunities.filter(o=>o.status==="offer"); }
function scScore(opId, critId){ return ((getScorecard().scores[opId])||{})[critId]||0; }
function scSet(opId, critId, v){ const sc=getScorecard(); (sc.scores[opId]=sc.scores[opId]||{})[critId]=v; }
// weighted average on a 1-5 scale across the criteria that have actually been rated
function scResult(o){
  const sc=getScorecard(); let wsum=0, sum=0, rated=0;
  sc.criteria.forEach(c=>{ const r=scScore(o.id,c.id), w=Math.max(0,+c.weight||0); if(r>0){ wsum+=w; sum+=w*r; rated++; } });
  return { avg: wsum? sum/wsum : 0, rated, total: sc.criteria.length };
}

// Gradient call-to-action shown on Dashboard & Insights once ≥2 offers are in play.
function scorecardTeaser(){
  const offers=scOffers(); if(offers.length<2) return "";
  const top=offers.map(o=>({o,r:scResult(o)})).sort((a,b)=>b.r.avg-a.r.avg)[0];
  const lead = top.r.avg ? `<b style="color:var(--accent3)">${esc(top.o.company)}</b> is ahead at ${top.r.avg.toFixed(1)}/5` : `Score them on what actually matters to you`;
  return `<div class="ai-box" data-act="open-scorecard" role="button" tabindex="0" style="cursor:pointer">
    <div class="ai-head">${I.trophy} ${offers.length} offers on the table — compare them side by side</div>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">A weighted decision matrix scores every offer on the things you care about, so the right call gets obvious. ${lead}.</div>
    <button class="btn primary sm" data-act="open-scorecard">${I.spark} Open offer scorecard</button>
  </div>`;
}

      return `<div class="card panel" style="margin-bottom:12px">

    <div style="font-size:11.5px;color:var(--faint);margin-top:8px;text-align:center">Paste into any AI to pressure-test your scores and get a recommendation.</div>`;
  }
  return h;

  L.push("");
  L.push(`## My priorities (weight = how much it matters)`);
  sc.criteria.forEach(c=>L.push(`- ${c.name}: ${Math.round(Math.max(0,+c.weight||0)/totW*100)}%`));
  L.push("");
  offers.map(o=>({o,r:scResult(o)})).sort((a,b)=>b.r.avg-a.r.avg).forEach(({o,r})=>{
    L.push(`## ${o.company}${o.role?" — "+o.role:""}  (my weighted score: ${r.avg?r.avg.toFixed(1)+"/5":"unscored"})`);
    sc.criteria.forEach(c=>{ const v=scScore(o.id,c.id); L.push(`- ${c.name}: ${v?v+"/5":"—"}`); });
    const det=[];
    if(o.offer&&o.offer.base) det.push(`base ${o.offer.base}`);
    if(o.offer&&o.offer.bonus) det.push(`bonus ${o.offer.bonus}`);
    if(o.offer&&o.offer.equity) det.push(`equity ${o.offer.equity}`);
    if(!det.length && (o.compMin||o.compMax)) det.push(`comp ${[o.compMin,o.compMax].filter(Boolean).join("–")}`);
    if(o.location) det.push(o.location);
    if(o.workMode) det.push(o.workMode);
    if(det.length) L.push(`- Details: ${det.join(", ")}`);
    if(o.offer&&o.offer.deadline) L.push(`- Decision deadline: ${fmtDate(o.offer.deadline)}`);
    if(o.offer&&o.offer.notes) L.push(`- Offer notes: ${o.offer.notes}`);
    if(o.vibes) L.push(`- My read on them: ${o.vibes}`);
    L.push("");
  });
  L.push(`Which would you choose, and what am I underweighting or missing?`);
  return L.join("\n");
}

/* ============================ POST-HIRE (90-day mode → My Company) ============================
   Meanwhile doesn't stop at "hired". The same Company/People records you built while interviewing
   become your map of the place once you're inside. Everything here lives on state.work — plain
   arrays, so it syncs, exports and backs up exactly like the rest of the app.

   The shape:   COMPANY (an existing opportunity, status "hired")
                  ├── people (o.people — the SAME records you met while interviewing)
                  ├── departments / systems / processes / decisions / projects / problems / questions
                  ├── captures  ("what happened?" notes — the only thing you actually type)
                  └── links     (the relationship graph: who knows what, what affects what)

   The rule that makes it work: you capture once, in your own words, and the AI does the
   bookkeeping — resolving names against records that already exist, never silently merging
   an ambiguous person, and citing the note it learned each thing from. */

function W(){ state.work = state.work || {}; WORK_LISTS.forEach(k=>{ if(!Array.isArray(state.work[k])) state.work[k]=[]; }); return state.work; }
/* A HOLE in one of these arrays used to take the whole app down — every render walks them, and
   `x.opId` on a null throws before anything is drawn. A null gets in from a half-written sync, an
   older build, or a hand-edited backup; a blank screen is never the right answer to one. */
function wOf(k,opId){ return W()[k].filter(x=>x&&x.opId===opId); }
function wFind(k,id){ return W()[k].find(x=>x&&x.id===id); }
function wAdd(k,rec){ rec.id=rec.id||uid(); rec.at=rec.at||Date.now(); W()[k].push(rec); return rec; }

/* One registry so every entity type gets lists, detail views, forms and graph nodes for free.
   People are the exception on purpose — they stay on o.people so a person you met in an
   interview is literally the same record as the colleague you work with. */
/* Big companies are stacks of legal entities and brands: Mendix is inside Siemens Digital
   Industries Software, which is inside Siemens. Knowing where you actually sit — and which
   name on an email belongs to which part — is half of understanding a large employer. */
/* Not everyone you need to remember still works here. A predecessor is the clearest case: you
   inherit their projects, their decisions and half your open questions are really about them, so
   they must exist as a full record — but they report to nobody and putting them in the live org
   chart is a lie about how the place works today. They come off the chart, not out of the app. */
const PERSON_STANDING=["Here","Left the company","Predecessor — had my role","Changed team","Not an employee"];
function personHere(p){ return !p||!p.standing||p.standing==="Here"; }
function standingShort(p){ return personHere(p)?"":(p.standing==="Predecessor — had my role"?"predecessor":p.standing==="Not an employee"?"external":p.standing==="Changed team"?"moved on":"left"); }
/* Knowledge bites. Not projects, not decisions, not people — just the small true things you
   pick up and would otherwise forget: that Altare used to own a product you sell, that the
   Tuesday sync is really a pricing review, that "ICX" means one thing to sales and another to
   support. Atomic, taggable, and joinable to anything else in the map.

   They are deliberately kept OUT of the general AI context. A pile of trivia in every prompt
   drags the model toward whatever it happens to contain; these are reference material, pulled
   in when a question actually touches them. See `bitesFor()`. */
const BITE_KINDS=["Fact","Term or acronym","History","Naming or branding","Unwritten rule","Gotcha","Preference","Number","Other"];
const ORG_KINDS=["Parent company","Business group","Division","Subsidiary","Brand or product company","Joint venture","Acquired company","Other"];
const ENT = {
  person:    {list:"people",      icon:I.user,     col:"#6d8bc4", label:"Person",     plural:"People",         name:r=>r.name},
  project:   {list:"projects",    icon:I.project,  col:"#8a72bd", label:"Project",    plural:"Projects",       name:r=>r.name},
  problem:   {list:"problems",    icon:I.problem,  col:"#cf7273", label:"Problem",    plural:"Problems",       name:r=>r.title},
  bite:      {list:"bites",       icon:I.spark,    col:"#5b9c97", label:"Knowledge bite",plural:"Knowledge bites", name:r=>r.fact},
  org:       {list:"orgs",        icon:I.building, col:"#c9a227", label:"Organization",plural:"Organizations", name:r=>r.name},
  department:{list:"departments", icon:I.people,   col:"#bf8a4f", label:"Department", plural:"Departments",    name:r=>r.name},
  team:      {list:"teams",       icon:I.people,   col:"#7c9cc4", label:"Team",       plural:"Teams",          name:r=>r.name},
  info:      {list:"infos",       icon:I.info,     col:"#9b8ec4", label:"Company info",plural:"Company info",  name:r=>r.title},
  system:    {list:"systems",     icon:I.system,   col:"#5b9c97", label:"System",     plural:"Systems",        name:r=>r.name},
  process:   {list:"processes",   icon:I.process,  col:"#5b86b3", label:"Process",    plural:"Processes",      name:r=>r.name},
  decision:  {list:"decisions",   icon:I.decision, col:"#a874a0", label:"Decision",   plural:"Decisions",      name:r=>r.title},
  question:  {list:"questions",   icon:I.question, col:"#c6a45c", label:"Question",   plural:"Open questions", name:r=>r.q},
  capture:   {list:"captures",    icon:I.note,     col:"#7c828f", label:"Note",       plural:"Notes",          name:r=>capTitle(r)},
};
const ENT_TYPES = Object.keys(ENT);
function opById(id){ return state.opportunities.find(o=>o.id===id); }
function entAll(type,opId){ if(type==="person"){ const o=opById(opId); return (o&&o.people)||[]; } return wOf(ENT[type].list,opId); }
/* A type that isn't in ENT is not a crash. It arrives from a record written by an older build,
   a half-finished conversion, or an AI citation that named something imaginary — none of which
   should be able to blank the screen. Every lookup below tolerates one. */
function entGet(type,id){
  if(type==="person"){ for(const o of state.opportunities){ const p=(o.people||[]).find(x=>x.id===id); if(p) return p; } return null; }
  return ENT[type] ? wFind(ENT[type].list,id) : null;
}
function entOpId(type,id){
  if(type==="person"){ const o=state.opportunities.find(o=>(o.people||[]).some(p=>p.id===id)); return o?o.id:null; }
  if(!ENT[type]) return null;
  const r=wFind(ENT[type].list,id); return r?r.opId:null;
}
function entName(type,rec){ return (rec&&ENT[type])?((ENT[type].name(rec)||"").toString()||"Untitled"):""; }
function entLabel(type,id){ const r=entGet(type,id); return r?entName(type,r):"(deleted)"; }
function entIcoHTML(type,rec,big){

  if(!c) return `<div class="ent-ico" style="${sz}background:var(--panel);color:var(--faint)">?</div>`;

  return `<div class="ent-ico" style="${sz}background:${c.col}26;color:${c.col}">${c.icon}</div>`;
}
function entDelete(type,id){
  if(type==="person"){ const o=opById(entOpId(type,id)); if(o){ o.people=(o.people||[]).filter(p=>p.id!==id); o.updatedAt=Date.now(); } }
  else { const k=ENT[type].list; W()[k]=W()[k].filter(x=>x&&x.id!==id); }
  const w=W(); w.links=w.links.filter(l=>!((l.st===type&&l.sid===id)||(l.tt===type&&l.tid===id)));
}

/* ---- The relationship graph. A flat link list, not a graph database — the app has no backend
   to host one, and at personal scale a filtered array is faster than any query language. ---- */
const REL_LABEL={KNOWS:"knows",OWNS:"owns",WORKS_IN:"works in",INVOLVED_IN:"involved in",AFFECTS:"affects",
  USES:"uses",HELPED_SOLVE:"helped solve",DEPENDS_ON:"depends on",PART_OF:"part of",ANSWERS:"answers",
  REPORTS_TO:"reports to",WORKS_WITH:"works with",RELATES_TO:"relates to",MENTIONS:"mentions"};
const REL_TYPES=Object.keys(REL_LABEL);
function addLink(opId,st,sid,rel,tt,tid,conf,via){
  if(!sid||!tid||(st===tt&&sid===tid)) return null;
  const w=W();
  const ex=w.links.find(l=>l.opId===opId&&l.st===st&&l.sid===sid&&l.rel===rel&&l.tt===tt&&l.tid===tid);
  if(ex){ ex.conf=Math.max(ex.conf||0,conf==null?0.9:conf); if(via&&!(ex.via||[]).includes(via)) ex.via=(ex.via||[]).concat(via); ex.seen=(ex.seen||1)+1; return ex; }
  return wAdd("links",{opId,st,sid,rel,tt,tid,conf:conf==null?0.9:conf,via:via?[via]:[],seen:1});
}
function linksOf(type,id){ return W().links.filter(l=>l&&((l.st===type&&l.sid===id)||(l.tt===type&&l.tid===id))); }
// links as seen from one entity: {rel, dir, type, id, conf, via}
function relatedTo(type,id,skipMentions){
  return linksOf(type,id).filter(l=>!(skipMentions&&l.rel==="MENTIONS")).map(l=>{
    const out = l.st===type&&l.sid===id;
    return {rel:l.rel, dir:out?"out":"in", type:out?l.tt:l.st, id:out?l.tid:l.sid, conf:l.conf, via:l.via||[], link:l};
  }).filter(r=>entGet(r.type,r.id));
}
function relatedOfType(type,id,wantType,rels){
  return relatedTo(type,id,true).filter(r=>r.type===wantType&&(!rels||rels.includes(r.rel)));
}
// every capture that mentions (or established something about) this entity — the evidence trail
function evidenceFor(type,id){
  const ids=new Set();
  linksOf(type,id).forEach(l=>{ if(l.st==="capture") ids.add(l.sid); (l.via||[]).forEach(v=>ids.add(v)); });
  return [...ids].map(i=>wFind("captures",i)).filter(Boolean).sort((a,b)=>b.at-a.at);
}
function evidenceHTML(list,label){
  if(!list.length) return "";
  return `<div class="evd">${label?`<span style="font-size:11px;color:var(--faint);font-weight:700;align-self:center">${esc(label)}</span>`:""}${
    list.slice(0,6).map(c=>`<span class="e" data-cite="capture|${c.id}">${esc(fmtDate(ymdOf(c.at)))} note</span>`).join("")}</div>`;
}
function ymdOf(ts){ const d=new Date(ts); return ymd(d.getFullYear(),d.getMonth(),d.getDate()); }

/* ---- Lifecycle: interested → applied → interviewing → offer → hired. Same Company record. ---- */
function employers(){ return state.opportunities.filter(o=>o.status==="hired"); }
function workOp(){ const e=employers(); if(!e.length) return null; return e.find(o=>o.id===workOpId)||e[0]; }
function hireDay(o){ const s=o.hired&&o.hired.startDate; if(!s) return null; const du=daysUntil(s); return du==null?null:(du>0?-du:1-du); }
function workTitle(o){ return (o.hired&&o.hired.title)||o.role||"your role"; }

/* ---- Career timeline: one chronology per company, pre-hire and post-hire in the same list ---- */
function careerTimeline(o){

/* ============================ QUICK CAPTURE ============================
   The one thing the user has to do. Talk or type what happened; Meanwhile files it. */
function capTitle(c){ const t=(c.text||"").trim().replace(/\s+/g," "); return t.length>62?t.slice(0,62)+"…":(t||"Note"); }
let capOpId=null, capRec=null, capBase="", capEditId=null, capPrefill="", capShots=[];
function openCapture(opId, editId){
  const emp=employers(); if(!emp.length){ toast("Mark a role as hired first"); return; }
  capEditId = editId || null;
  const ex = capEditId ? wFind("captures",capEditId) : null;

/* ---- Photos on a note ----
   The fastest note is the one you don't type. A phone camera pointed at a whiteboard, a
   notebook page or a printed org chart is a note; so is ⌘V of a screenshot on a laptop. The
   picture goes to the model to be read AND stays on the note, because a transcription is not
   the same thing as being able to look at the original again. */
function capShotStrip(){
  if(!capShots.length) return "";
  return `<div class="shot-strip" id="capShots">${capShots.map((s,i)=>`<div class="shot-cell">
      ${shotThumb(s,`data-capcrop="${i}"`)}
      <button class="shot-crop" data-capcrop="${i}" title="Crop">${I.crop}</button>
      <button class="shot-x" data-capshotdel="${i}" title="Remove">${I.x}</button>
    </div>`).join("")}</div>`;
}
function capShotBar(){
  if(!engineReadsImages()) return "";
  const touch = matchMedia("(pointer:coarse)").matches;
  const n=capShots.length, room=SHOT_LIMIT-n;
  if(!room) return `<div class="cap-tools"><span class="cap-tool-hint">${SHOT_LIMIT} pictures on this note — the most it can read at once. Tap one to crop it.</span></div>`;
  return `<div class="cap-tools">
    ${touch?`<button class="cap-tool" data-act="cap-camera">${I.camera}<span>${n?"Another photo":"Photo"}</span></button>`:""}
    <button class="cap-tool" data-act="cap-image">${I.image}<span>${touch?"Library":n?"Add another":"Add a picture"}</span></button>
    <span class="cap-tool-hint">${n?`${n} on this note · ${room} more · tap one to crop`:(touch?"":"or paste a screenshot / drop one in")}</span>
  </div>`;
}
// one picker for both buttons; `cam` asks the phone for the camera rather than the library
function capPickImages(cam){
  pickImages(cam, async files=>{
    for(const f of files){
      if(capShots.length>=SHOT_LIMIT){ toast(`Up to ${SHOT_LIMIT} pictures per note`); break; }
      capShots.push(await imgToShot(f));
    }
    capRedrawShots();
  });
}
function pickImages(cam, done){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*"; inp.multiple=!cam;
  if(cam) inp.setAttribute("capture","environment");
  inp.onchange=async()=>{
    const files=[...(inp.files||[])].filter(isImageFile);
    if(!files.length) return;
    const big=files.find(f=>f.size>25*1024*1024);
    if(big){ toast("⚠ That picture is too big (max 25MB)"); return; }
    toast(files.length>1?`Reading ${files.length} pictures…`:"Reading the picture…");
    try{ await done(files); }catch(e){ toast("⚠ Couldn't read that picture"); }
  };
  inp.click();
}
// redraw just the strip so a half-typed note isn't lost to a re-render
// redraw just the strip and its bar, so a half-typed note isn't lost to a full re-render
function capRedrawShots(){
  const host=document.getElementById("capShotHost"); if(!host) return;
  host.innerHTML=capShotStrip()+capShotBar();
  hydrateShots(host);
}
// ⌘V of a screenshot, and drag-and-drop onto the modal — both land in the same place
function capArmDrop(){
  const box=editorEl&&editorEl.querySelector(".card"); if(!box||box.dataset.shotBound) return;
  box.dataset.shotBound="1";
  const take=async files=>{
    const imgs=[...files].filter(isImageFile); if(!imgs.length) return false;
    for(const f of imgs){ if(capShots.length>=SHOT_LIMIT){ toast(`Up to ${SHOT_LIMIT} pictures per note`); break; } capShots.push(await imgToShot(f)); }
    capRedrawShots(); return true;
  };
  box.addEventListener("paste",async e=>{
    if(!engineReadsImages()) return;
    const files=[...((e.clipboardData||{}).files||[])];
    if(files.length && await take(files)) e.preventDefault();
  });
  box.addEventListener("dragover",e=>{ if(engineReadsImages()){ e.preventDefault(); box.classList.add("drop-on"); } });
  box.addEventListener("dragleave",()=>box.classList.remove("drop-on"));
  box.addEventListener("drop",async e=>{
    box.classList.remove("drop-on");
    if(!engineReadsImages()) return;
    const files=[...((e.dataTransfer||{}).files||[])];
    if(files.length){ e.preventDefault(); await take(files); }
  });
}
function captureBody(){
  const emp=employers(); const o=opById(capOpId)||emp[0];
  const voice = !!(window.SpeechRecognition||window.webkitSpeechRecognition);
  const editing = !!capEditId;
  return `<div style="display:flex;align-items:center;gap:11px;margin-bottom:10px">

function capStopVoice(){

function capVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast("Voice isn't supported here — use your keyboard's mic key"); return; }
  if(capRec){ capStopVoice(); return; }
  const ta=document.getElementById("capText"); if(!ta) return;
  capBase=ta.value?ta.value.replace(/\s*$/,"")+" ":"";
  let r; try{ r=new SR(); }catch(e){ toast("Voice isn't available here"); return; }
  r.continuous=true; r.interimResults=true; r.lang=navigator.language||"en-US";
  let done="";

/* ============================ AI EXTRACTION ============================ */
/* The capture agent's contract. It doesn't just fill in records — it can come back with
   questions, propose changes to things you already have, close open questions, and suggest a
   next step. Everything it proposes is reviewed before anything is written. */
const CAPTURE_SCHEMA=`{
 "summary": "",              // one short line describing what happened
 "understood": [""],         // 2-5 short bullets: what you took from the note, in my words
 "people":      [{"name":"","title":"","department":"","team":"","expertise":[""],"note":""}],
 "departments": [{"name":""}],
 "systems":     [{"name":"","note":""}],
 "projects":    [{"name":"","status":"","note":""}],
 "problems":    [{"title":"","status":"","note":""}],
 "processes":   [{"name":"","note":""}],
 "decisions":   [{"title":"","madeBy":"","date":"","reason":""}],
 "teams":       [{"name":"","department":"","lead":""}],
 "info":        [{"title":"","kind":"","summary":""}],   // a product, a recurring meeting, an acronym
 "bites":       [{"fact":"","kind":"","tags":[""],"source":""}],  // one small TRUE thing worth remembering
 "met":         [""],        // names of people this note says I actually SPOKE WITH — not merely mentioned
 "questions":   [""],        // NEW open questions the note raises but doesn't answer
 "relationships":[{"from":"","fromType":"person","rel":"KNOWS","to":"","toType":"system","confidence":0.9}],
 "ask_me":   [{"ask":"","why":"","options":[""]}],                     // what you need me to clarify
 "updates":  [{"type":"project","name":"","set":{"status":""},"why":""}], // change something already on record
 "answers":  [{"question":"","answer":"","why":""}],                   // an open question this note answers
 "tasks":    [{"label":"","date":"YYYY-MM-DD","why":""}],              // a next step for me
 "advice":   [""]            // 0-2 short suggestions that aren't records
}`;
/* Two fields the schema gained late, because both were quietly missing and both matter:
   - bites were never extracted at all, so the knowledge layer only ever filled up by hand
   - "met" separates the people you SPOKE WITH from the people a note merely talks about, which
     is the difference between "I engaged 6 people this week" and "6 names came up" */
const CAPTURE_EXTRA=`
KNOWLEDGE BITES ("bites") — the small true things a new starter keeps re-learning. One sentence
each, standing on its own without the note around it: what a name used to mean, an unwritten rule,
a number that matters, a gotcha, who a nickname refers to. Extract them whenever the note contains
one; two or three from a rich note is normal, none from a thin one is fine. Never invent one, and
never restate something already recorded above. "kind" is one of: ${BITE_KINDS.join(", ")}.

WHO I ACTUALLY SPOKE WITH ("met") — list ONLY people this note says I had a real exchange with:
a meeting, a call, a 1:1, a standup, a hallway conversation, a message thread. Someone the note
merely talks ABOUT does not belong here. If it isn't clear, leave them out.`;
/* The names already on record, so the agent reuses one instead of creating a near-duplicate.
   `bite` is deliberately NOT in here: a bite is a fact, not a name, and listing "AMS means
   Americas, not application managed services" under "use these EXACT names" is nonsense that also
   drags a pile of trivia into every extraction. Bites have their own block — see glossaryText. */
function knownEntitiesText(opId){
  const L=[];
  ENT_TYPES.filter(t=>t!=="capture"&&t!=="question"&&t!=="bite").forEach(t=>{
    const names=entAll(t,opId).map(r=>entName(t,r)).filter(Boolean).slice(0,120);
    if(names.length) L.push(`${ENT[t].plural.toUpperCase()} already on record: ${names.join(", ")}`);
  });
  return L.length?("\nUse these EXACT names when the note refers to one of them:\n"+L.join("\n")+"\n"):"";
}
/* ---- THE APP LEARNS, AND THIS IS WHERE IT SHOWS ----
   Write down once that AMS means Americas and every note after it should be read that way. That
   only happens if the definitions are actually in the prompt AND the model is told what to do with
   them. Both halves were missing: bites reached the model as if they were entity names, with no
   instruction attached, so whether an acronym got expanded was luck.

   Every term/acronym/naming bite goes in — those are what let it read the note at all, and there
   are never many — plus any other bite the note's own words touch. Capped, because a glossary
   longer than the note is no longer a glossary. */
const GLOSS_KINDS=/term|acronym|naming|branding|unwritten|gotcha/i;
const GLOSS_MAX=28;
/* Its own stop list, not the search one: `STOP` is declared far below this and a const does not
   hoist (the TDZ trap this file has been bitten by four times). It also has to be stricter — a
   bite matching a note because they both contain "the" would put every bite in every prompt. */
const GLOSS_STOP=new Set(("the a an and or of to for in on at is are was were be been it its this that "+
  "with from by as we our you your they their he she his her not no but if then than so "+
  "have has had do does did can will would should could may might must about into over under "+
  "here there when what which who how why all any some each other more most new now day days").split(" "));
function glossaryText(opId,text){
  const all=entAll("bite",opId); if(!all.length) return "";
  const keyWords=s=>norm(s||"").split(" ").filter(w=>w.length>2&&!GLOSS_STOP.has(w));
  const words=new Set(keyWords(text));
  const touches=b=>keyWords([b.fact,(b.tags||[]).join(" "),b.source].filter(Boolean).join(" "))
    .some(w=>words.has(w));
  const pick=[];
  const take=b=>{ if(b&&b.fact&&!pick.includes(b)) pick.push(b); };
  all.filter(b=>GLOSS_KINDS.test(b.kind||"")).forEach(take);
  all.filter(touches).forEach(take);
  if(!pick.length) return "";
  return `\nWHAT I ALREADY KNOW — my own recorded notes, treat these as true:\n`+
    pick.slice(0,GLOSS_MAX).map(b=>`- ${b.fact}${b.source?` (from ${b.source})`:""}`).join("\n")+
    `\nRead the note THROUGH these: expand any acronym or internal name they define rather than treating it as something new, and never propose a "bite" for something already listed here.\n`;
}
// the open questions already on record — so the agent can close one instead of asking it again
function openQuestionsText(opId){
  const q=wOf("questions",opId).filter(x=>x.status==="Open").map(x=>x.q);
  return q.length?`\nOPEN QUESTIONS I've already recorded (if this note answers one, put it in "answers" using its exact wording):\n- ${q.join("\n- ")}\n`:"";
}
/* With pictures attached the job grows a first step — read them — and the schema grows a
   "transcript" so what it saw is written down verbatim and kept on the note. Everything after
   that is the same pipeline: the same records, the same review screen, the same guards. */
function shotRules(n){
  if(!n) return "";
  return `
--- ${n===1?"THERE IS A PICTURE":`THERE ARE ${n} PICTURES`} ATTACHED ---
Read ${n===1?"it":"them"} first. ${n>1?"Treat them as one note — they may be pages of the same thing.\n":""}It could be a page of handwriting, a whiteboard or flipchart, a printed or projected slide, an org chart, a screenshot of a directory / chat / email, a business card, or a badge.
- "transcript": write out everything legible, verbatim, keeping the layout's meaning (bullets stay bullets, a table stays rows). If a word is genuinely unreadable put [?] rather than guessing it. This is the note's permanent text, so it matters more than being brief.
- Then extract records from what you read exactly as you would from typed text.
- If it is an ORG CHART or a directory: read EVERY box or row, not just the top. Each becomes a person with their title. Every connecting line from a person up to their boss is a REPORTS_TO relationship (from the report, to the manager). A labelled band, column or swimlane is usually a department; a box grouping people inside one is usually a team.
- If it is a BUSINESS CARD or badge: one person, with their title, company, email and phone in "note".
- If it is a SLIDE or diagram of process or architecture: the boxes are usually systems or processes and the arrows between them are relationships.
- Do not describe the picture ("a photo of a whiteboard with blue marker"). Read what it says.
- Never invent something that is not legible. If the picture is too blurry or dark to read, say so in "summary" and return empty arrays.
--- END PICTURES ---
`;
}
function capturePrompt(o,text,answered,nShots){
  const prior = (answered&&answered.length)
    ? `\n--- I ANSWERED YOUR QUESTIONS ---\n${answered.map(a=>`Q: ${a.ask}\nA: ${a.answer}`).join("\n")}\n--- END ---\nUse these answers. Don't ask them again. Only ask something new if it genuinely blocks a decision.\n`
    : "";
  const schema = nShots
    ? CAPTURE_SCHEMA.replace('{\n "summary"','{\n "transcript": "",         // everything legible in the picture(s), written out verbatim\n "summary"')
    : CAPTURE_SCHEMA;
  return `You are the organizational memory of one person and you are about to file a note for them. Today is ${todayYMD()}. They work at ${o.company}${o.hired&&o.hired.title?` as ${o.hired.title}`:""}.
${mePrompt(o)}${knownEntitiesText(o.id)}${glossaryText(o.id,text)}${openQuestionsText(o.id)}${prior}
Your job: read the note, work out what it means for what they already know, and propose what to record. They review everything before it is saved, so propose confidently — but never invent.

Rules:
- Only use what the note actually says or clearly implies. Never invent people, systems, owners, reporting lines, project status, dates or opinions. If something is unstated and it matters, ASK instead of guessing.
- Names: use the note's wording, but if it clearly refers to something already on record, reuse that exact name.
- "status" for projects must be one of: ${PROJECT_STATUS.join(", ")}. For problems: ${PROBLEM_STATUS.join(", ")}.
- Pick the right bucket. A "project" is a piece of work with people and an end. A recurring meeting (QBR, standup), a product or product family, an acronym, a policy — those are "info", with "kind" one of: ${INFO_KINDS.join(", ")}. If in doubt between project and info, choose info: it's for things to know rather than things to do.
- "teams" are groups inside a department (e.g. "GTM Americas" inside Sales). Only when the note names one.
- relationships: fromType/toType must each be one of person, project, problem, department, system, process, decision. rel must be one of ${REL_TYPES.filter(r=>r!=="MENTIONS").join(", ")}. confidence 0-1: 0.9+ only when the note states it outright, 0.5-0.8 when inferring.
- ask_me: at most 3, only where the answer changes what gets recorded — an ambiguous person, an owner who's implied but not named, a project that might be one they already have. Give 2-4 short "options" when there's an obvious set to pick from. Ask nothing if the note is clear.
- updates: only for records already on record, and only when the note clearly says something changed (a project became blocked, a problem got solved). Name the exact record. Say why.
- answers: only for open questions listed above, and only when the note genuinely answers one.
- tasks: at most 1, only if the note implies something THEY need to do next. Resolve relative dates to YYYY-MM-DD.
- advice: at most 2, one line each — what's worth chasing, who's worth talking to. Only from what's here.
- Leave arrays empty rather than guessing. Return ONLY the JSON object, no markdown.
${shotRules(nShots||0)}
${schema}

--- THE NOTE ---
${text||(nShots?"(no typed text — everything is in the picture"+(nShots>1?"s":"")+")":"")}
--- END ---`;
}

/* ---- Entity resolution. The hard part: "Mike", "Mike Smith" and an existing Mike Smith are
   probably one person — but "probably" is not good enough to merge silently, so anything
   short of a confident match is surfaced for the user to confirm. ---- */
function norm(s){ return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim(); }
const NICK={mike:"michael",mick:"michael",mickey:"michael",bob:"robert",bobby:"robert",rob:"robert",robbie:"robert",bill:"william",billy:"william",will:"william",jim:"james",jimmy:"james",jamie:"james",dave:"david",dan:"daniel",danny:"daniel",chris:"christopher",matt:"matthew",tom:"thomas",tommy:"thomas",tony:"anthony",nick:"nicholas",steve:"steven",stephen:"steven",sue:"susan",suzie:"susan",liz:"elizabeth",beth:"elizabeth",betty:"elizabeth",kate:"katherine",katie:"katherine",kathy:"katherine",cathy:"catherine",jen:"jennifer",jenny:"jennifer",becky:"rebecca",sam:"samuel",alex:"alexander",sasha:"alexander",andy:"andrew",drew:"andrew",ben:"benjamin",ed:"edward",eddie:"edward",greg:"gregory",joe:"joseph",joey:"joseph",ken:"kenneth",larry:"lawrence",pat:"patricia",patty:"patricia",pete:"peter",ray:"raymond",ron:"ronald",tim:"timothy",vicky:"victoria",abby:"abigail",maggie:"margaret",peggy:"margaret",meg:"margaret",nate:"nathaniel",gabe:"gabriel",zach:"zachary",jess:"jessica",mandy:"amanda",sandy:"sandra",terry:"terence",charlie:"charles",chuck:"charles",frank:"franklin",hank:"henry",jack:"john",johnny:"john",tina:"christina",christie:"christina"};
function canonName(n){ return norm(n).split(" ").map(w=>NICK[w]||w).filter(Boolean); }
// how confidently are these the same person? 1 = certain, 0 = no
function personMatch(a,b){
  const A=canonName(a), B=canonName(b);
  if(!A.length||!B.length) return 0;
  if(A.join(" ")===B.join(" ")) return 1;
  const af=A[0], bf=B[0], al=A.length>1?A[A.length-1]:"", bl=B.length>1?B[B.length-1]:"";
  if(af!==bf) return 0;                       // different first names → different people
  if(al&&bl) return al===bl?1:0;              // both have surnames: they decide it
  if(al&&bl==="") return 0.7;                 // "Mike" vs "Mike Smith" — likely, not certain
  if(bl&&al==="") return 0.7;
  return 0.7;
}
function samePerson(a,b){ return personMatch(a,b)>=1; }
const SYS_ALIAS={sfdc:"salesforce","salesforce com":"salesforce","sales force":"salesforce",ns:"netsuite","net suite":"netsuite",gcal:"google calendar",gsheet:"google sheets",gsheets:"google sheets",teams:"microsoft teams","ms teams":"microsoft teams",hs:"hubspot",sf:"salesforce",ee:"employee engagement"};
function canonThing(n){ const k=norm(n); return SYS_ALIAS[k]||k.replace(/\b(inc|llc|the|a|an)\b/g,"").replace(/s$/,"").trim(); }
// → {rec, conf, candidates:[recs]} — conf 1 = certain match, 0.7 = probable (ask), 0 = new
function resolveEnt(type,name,opId){
  const pool=entAll(type,opId);
  if(!name||!pool.length) return {rec:null,conf:0,candidates:[]};
  if(type==="person"){
    const scored=pool.map(p=>({p,s:personMatch(p.name,name)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
    if(!scored.length) return {rec:null,conf:0,candidates:[]};
    if(scored[0].s>=1) return {rec:scored[0].p,conf:1,candidates:[scored[0].p]};
    const probable=scored.filter(x=>x.s>=0.7).map(x=>x.p);
    // more than one plausible Mike → never guess; make the user pick
    return {rec:probable.length===1?probable[0]:null, conf:probable.length===1?0.7:0, candidates:probable};
  }
  const key=canonThing(name);
  const hit=pool.find(r=>canonThing(entName(type,r))===key);
  if(hit) return {rec:hit,conf:1,candidates:[hit]};
  // "Salesforce reporting" vs "Salesforce": related, probably not the same record → suggest
  const near=pool.filter(r=>{ const k=canonThing(entName(type,r)); return k&&key&&(k.startsWith(key+" ")||key.startsWith(k+" ")); });
  return {rec:null,conf:0,candidates:near};
}

let capPlan=null;   // the reviewable extraction: {opId, text, summary, items:[], rels:[]}
async function capExtract(){
  capReadOp(); capStopVoice();
  const ta=document.getElementById("capText"); const text=(ta?ta.value:"").trim();
  if(!text && !capShots.length){ toast("Write, dictate or photograph something first"); return; }
  const o=opById(capOpId); if(!o) return;
  if(aiEngine()==="paste"||aiEngine()==="off"){
    capSaveRaw();
    toast(capShots.length?"Photo saved — connect an AI in Settings to read it":"Saved — connect an AI in Settings to auto-organize notes");
    return;
  }
  const btn=editorEl&&editorEl.querySelector('[data-act="cap-go"]');
  if(btn){ btn.textContent=capShots.length?"Reading the picture…":"Reading…"; btn.disabled=true; }

/* Round two: you answered its questions, so it reads the note again knowing what it didn't.
   This is the whole point — it asks, you tell it, and the plan gets better before anything is saved. */
let capAnswered=[];
async function capRefine(){
  const p=capPlan; if(!p) return;
  const o=opById(p.opId); if(!o) return;
  const answered=(p.asks||[]).map(q=>{
    const el=document.querySelector(`[data-ansfor="${q.id}"]`);
    return {ask:q.ask, answer:((el&&el.value)||q.answer||"").trim()};
  }).filter(a=>a.answer);
  if(!answered.length){ toast("Answer at least one, or skip"); return; }
  capAnswered=capAnswered.concat(answered);
  const btn=editorEl&&editorEl.querySelector('[data-act="cap-refine"]');
  if(btn){ btn.textContent="Re-reading with your answers…"; btn.disabled=true; }
  try{
    // the pictures go back in too — the answers are extra context, not a replacement for them
    const docs=await shotDocs(p.shots||[]);
    const out=await aiCall(capturePrompt(o,p.text,capAnswered,docs.length),docs,{maxTokens:docs.length?4000:3000});
    const next=buildPlan(o,p.text,aiParse(out),p.shots);
    next.answeredLog=capAnswered.slice();
    capPlan=next;
    capReview();
  }catch(err){
    if(btn){ btn.innerHTML=`${I.ai} Answer &amp; re-read`; btn.disabled=false; }
    toast("⚠ "+err.message);
  }
}
// turn the model's JSON into a reviewable plan, resolved against what already exists
function buildPlan(o,text,d,shots){
  // Everything below reads the model's reply as a list. A model that returns a string, an object
  // or a number where an array belongs would otherwise throw straight out of here — and a thrown
  // buildPlan means the whole note is refused, which is the one outcome a capture must never have.
  // nullish entries are dropped too: a model that pads a list with nulls would otherwise throw on
  // the first one, and losing the whole note to a stray null is not a trade worth making
  const L=v=>(Array.isArray(v)?v:(v==null||v===""?[]:[v])).filter(x=>x!=null);
  d=(d&&typeof d==="object"&&!Array.isArray(d))?d:{};
  const items=[]; const seen={};
  const add=(type,name,rec,extra)=>{
    if(!name||!String(name).trim()) return;
    name=String(name).trim();
    const key=type+"|"+canonThing(name);
    if(seen[key]) return seen[key];
    const r=resolveEnt(type,name,o.id);
    // What the checkbox and the dropdown default to. A certain match just merges; a probable one
    // merges but says so; a genuinely ambiguous person is left unticked until you pick.
    let choice="new", on=true;
    if(r.conf>=1) choice="id:"+r.rec.id;
    else if(r.rec&&r.conf>=0.7) choice="id:"+r.rec.id;
    else if(type==="person"&&r.candidates.length>1){ choice=""; on=false; }
    const it={type,name,rec:r.rec,conf:r.conf,candidates:r.candidates,fields:rec||{},extra:extra||"",on,choice};
    items.push(it); seen[key]=it; return it;
  };
  L(d.people).forEach(p=>add("person",p.name,{title:p.title||"",department:p.department||"",team:p.team||"",expertise:p.expertise||[],notes:p.note||""}));
  L(d.departments).forEach(x=>add("department",x.name||x,{}));
  L(d.systems).forEach(x=>add("system",x.name||x,{note:x.note||""}));
  L(d.projects).forEach(x=>add("project",x.name||x,{status:x.status||"Unknown",note:x.note||""}));
  L(d.problems).forEach(x=>add("problem",x.title||x.name||x,{status:x.status||"Discovered",description:x.note||""}));
  L(d.processes).forEach(x=>add("process",x.name||x,{note:x.note||""}));
  L(d.decisions).forEach(x=>add("decision",x.title||x,{madeBy:x.madeBy||"",date:x.date||"",reason:x.reason||""}));

function capFinalText(p){

// run the proposed non-record operations. Same rule as everything else: only what was ticked.
function applyOps(o,plan,capId){

    if(!op.on) return;
    if(op.kind==="update"){
      const rec=entGet(op.type,op.id); if(!rec) return;
      if(op.set.status&&op.set.status!==rec.status){ rec.prevStatus=rec.status; rec.statusAt=Date.now();
        if(op.set.status==="Solved") rec.solvedAt=Date.now(); }
      Object.assign(rec,op.set); rec.fromCapture=rec.fromCapture||capId;
      addLink(o.id,"capture",capId,"MENTIONS",op.type,op.id,1,capId); n++;
    }
    else if(op.kind==="answer"){
      const q=wFind("questions",op.id); if(!q) return;

function capApply(){

  const cap=existing
    ? Object.assign(existing,{text,shots,summary:p.summary||existing.summary,editedAt:Date.now(),entities:existing.entities||[]})
    : wAdd("captures",{opId:o.id,text,shots,summary:p.summary,entities:[]});

  p.items.forEach(it=>{

    if(useId) rec=entGet(it.type,useId);

    // (a person's department, say), and we're not about to file two copies of Finance.
    if(!rec){ const again=resolveEnt(it.type,it.name,o.id); if(again.rec&&again.conf>=1) rec=again.rec; }
    if(!rec) rec=createEnt(it.type,o.id,it.name,it.fields,cap.id);
    else mergeEnt(it.type,rec,it.fields);
    if(!rec) return;
    resolved[key]={t:it.type,id:rec.id};
    if(!cap.entities.some(e=>e.t===it.type&&e.id===rec.id)) cap.entities.push({t:it.type,id:rec.id});
    addLink(o.id,"capture",cap.id,"MENTIONS",it.type,rec.id,1,cap.id);
  });

    if(r.on===false) return;
    const a=resolved[r.fromType+"|"+canonThing(r.from)], b=resolved[r.toType+"|"+canonThing(r.to)];
    if(a&&b) addLink(o.id,a.t,a.id,r.rel,b.t,b.id,r.conf,cap.id);

    const r=resolved["person|"+canonThing(n)];

/* ========================= INSIGHTS: THE COMPANY AS A SPHERE =========================
   Everything else in the post-hire half is a list or a number. This is the one place you SEE the
   shape of what you know — every person, team, system, decision and open question as a point on a
   globe, every relationship as an arc across it, and the clusters and bridges that no list can
   show you. The graph has existed since the first day of the post-hire work; it had just never
   been looked at.

   Canvas rather than the SVG used elsewhere because this one animates — 400 nodes and 900 arcs at
   60fps is not something the DOM should be asked to do. */

/* --- putting them on a sphere -----------------------------------------------------------------
   Two steps. A Fibonacci spiral spreads the points evenly (that even scatter is what makes the
   reference images read as a globe rather than a clump), ordered by cluster so a department starts
   as a band. Then a short relaxation pulls linked nodes together and pushes crowded ones apart —
   ON the sphere, by renormalising back to the surface after every nudge, which is what keeps it a
   globe instead of collapsing into a ball of string. */
const GLOBE_ITERS=90;
function globeLayout(g){
  const N=g.nodes.length; if(!N) return;
  const order=g.nodes.slice().sort((a,b)=>a.cluster<b.cluster?-1:a.cluster>b.cluster?1:(a.name<b.name?-1:1));
  const gold=Math.PI*(3-Math.sqrt(5));
  order.forEach((n,i)=>{
    const y=N===1?0:1-(i/(N-1))*2, r=Math.sqrt(Math.max(0,1-y*y)), th=gold*i;
    n.x=Math.cos(th)*r; n.y=y; n.z=Math.sin(th)*r;

  const norm=n=>{ const d=Math.hypot(n.x,n.y,n.z)||1; n.x/=d; n.y/=d; n.z/=d; };
  /* Fruchterman–Reingold, run on the sphere: repulsion between EVERY pair, attraction along edges,
     renormalised to the surface after each step. Repulsion has to be global — a version that only
     pushed apart nodes already close together could not hold a connected graph open, and the whole
     company collapsed into one bright clump on one side of the globe. `k` is the ideal spacing:
     the sphere's area shared out between N points. */
  const k=Math.sqrt(4*Math.PI/N), k2=k*k;
  let temp=0.32;

    g.nodes.forEach(n=>{ n.fx=0; n.fy=0; n.fz=0; });
    for(let i=0;i<N;i++){ const a=g.nodes[i];

function globeRGBA(hex,a){
  const h=String(hex||"").replace("#","");
  const v=h.length===3?h.split("").map(c=>c+c).join(""):h.slice(0,6);
  const n=parseInt(v,16);
  if(!isFinite(n)) return `rgba(140,150,170,${a})`;
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
/* The cage: a few meridians and parallels, barely there. Without it a sparse map is just dots in
   space; with it you can tell you are looking at a rotating sphere. */
function globeDrawCage(ctx,cx,cy0,R,cy,sy,cp,sp){
  ctx.lineWidth=0.6;
  const P=(x,y,z)=>{ const X=x*cy-z*sy, Z=x*sy+z*cy, Y=y*cp-Z*sp, Z2=y*sp+Z*cp;
    const s=GLOBE_FOV/(GLOBE_FOV+Z2); return {x:cx+X*R*s,y:cy0+Y*R*s,z:Z2}; };
  for(let m=0;m<6;m++){ const a=m*Math.PI/6;
    ctx.beginPath();
    for(let i=0;i<=48;i++){ const t=i/48*Math.PI*2;
      const p=P(Math.cos(t)*Math.cos(a),Math.sin(t),Math.cos(t)*Math.sin(a));
      ctx.strokeStyle=`rgba(130,160,235,${0.07+0.10*(1-(p.z+1)/2)})`;
      if(i===0) ctx.moveTo(p.x,p.y); else { ctx.lineTo(p.x,p.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
    }
  }
  for(let k=1;k<4;k++){ const y=-1+k*0.5, r=Math.sqrt(Math.max(0,1-y*y));
    ctx.beginPath();
    for(let i=0;i<=48;i++){ const t=i/48*Math.PI*2;
      const p=P(Math.cos(t)*r,y,Math.sin(t)*r);
      ctx.strokeStyle=`rgba(130,160,235,${0.055+0.085*(1-(p.z+1)/2)})`;
      if(i===0) ctx.moveTo(p.x,p.y); else { ctx.lineTo(p.x,p.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
    }
  }
}
/* An arc is slerped between the two points and lifted off the surface, so it curves the way the
   reference images do instead of cutting a dull straight chord through the middle. */
function globeDrawArc(ctx,e,cx,cy0,R,cy,sy,cp,sp,rot,P,on,near){
  const a=e.a,b=e.b;
  const dot=Math.max(-1,Math.min(1,a.x*b.x+a.y*b.y+a.z*b.z));
  const om=Math.acos(dot);
  const steps=om<0.35?6:om<1.2?14:22;
  const col=e.kind==="suggest"?"#c6a45c":e.kind==="collab"?"#9b8ec4":globeNodeColor(a);
  const base=e.kind==="suggest"?0.5:e.kind==="collab"?0.4:0.34;
  ctx.beginPath();
  if(e.kind==="suggest") ctx.setLineDash([3,4]); else ctx.setLineDash([]);
  let lastZ=0;
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    let x,y,z;
    if(om<1e-4){ x=a.x; y=a.y; z=a.z; }
    else { const s=Math.sin(om), w1=Math.sin((1-t)*om)/s, w2=Math.sin(t*om)/s;
           x=a.x*w1+b.x*w2; y=a.y*w1+b.y*w2; z=a.z*w1+b.z*w2; }
    const lift=1+GLOBE_LIFT*Math.sin(Math.PI*t)*Math.min(1,om);
    const d=Math.hypot(x,y,z)||1;
    const r=rot({x:x/d*lift,y:y/d*lift,z:z/d*lift},cy,sy,cp,sp);
    const q=P(r); lastZ=r.z;
    if(i===0) ctx.moveTo(q.sx,q.sy); else ctx.lineTo(q.sx,q.sy);

  const depth=1-(lastZ+1)/2;

  ctx.lineWidth=(e.kind==="suggest"?1:Math.min(2.2,0.7+e.n*0.35))*(on?1:0.6);
