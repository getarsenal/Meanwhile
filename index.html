  return h+`</div>`;
}

/* ============================ ASK MEANWHILE ============================
   Not a general chatbot: it answers from your records, cites the note each claim came from,
   and is told to say "I don't have anything on that" rather than fill the gap with invention. */
/* Bites stay out of the general context on purpose. Dumping every scrap of trivia into every
   prompt pulls the model toward whatever the pile happens to contain — the user's own example
   was a defunct brand name that should be findable, not influential. So they are retrieved:
   matched against the question, and only then handed over, cited like everything else. */
function bitesFor(o,q,cap){
  const all=entAll("bite",o.id);
  if(!all.length) return [];
  const T=terms(q||"");
  if(!T.length) return [];
  const score=b=>{
    const hay=norm([b.fact,(b.tags||[]).join(" "),b.kind,b.note,b.source].filter(Boolean).join(" "));
    return T.reduce((n,t)=>n+(hay.includes(t)?1:0),0);
  };
  return all.map(b=>({b,s:score(b)})).filter(x=>x.s>0)
    .sort((a,b)=>b.s-a.s).slice(0,cap||12).map(x=>x.b);
}
function workRefs(o,q){
  const refs={}; const L=[]; let n={};
  const key=t=>({person:"p",project:"pr",problem:"pb",department:"d",team:"tm",system:"s",process:"pc",decision:"dc",question:"q",info:"in",capture:"c",bite:"kb",org:"g"})[t];
  const reg=(t,rec)=>{ const k=key(t); n[k]=(n[k]||0)+1; const id=k+n[k]; refs[id]={t,id:rec.id}; return id; };
  ["person","department","team","system","project","problem","process","decision","question","info"].forEach(t=>{
    const list=entAll(t,o.id); if(!list.length) return;
    L.push("",ENT[t].plural.toUpperCase()+":");
    list.forEach(rec=>{
      const id=reg(t,rec);
      let line=`[${id}] ${entName(t,rec)}`;
      const m=entRowMeta(t,rec); if(m) line+=` — ${m}`;
      L.push(line.length>240?line.slice(0,240)+"…":line);
    });
  });
  const hits = bitesFor(o,q);
  if(hits.length){
    L.push("","KNOWLEDGE BITES that touch this question:");
    hits.forEach(bt=>{ const id=reg("bite",bt);
      L.push(`[${id}] ${bt.fact}${bt.kind?` (${bt.kind})`:""}${(bt.tags||[]).length?` #${bt.tags.join(" #")}`:""}`); });
  }
  const caps=wOf("captures",o.id).sort((a,b)=>b.at-a.at).slice(0,40);
  if(caps.length){
    L.push("","MY NOTES (newest first):");
    caps.forEach(c=>{ const id=reg("capture",c); const t=(c.text||"").replace(/\s+/g," "); L.push(`[${id}] ${fmtDate(ymdOf(c.at))}: ${t.length>420?t.slice(0,420)+"…":t}`); });
  }
  const links=W().links.filter(l=>l&&l.opId===o.id&&l.rel!=="MENTIONS");
  if(links.length){
    L.push("","WHAT I'VE RECORDED ABOUT HOW THINGS CONNECT:");
    links.slice(0,120).forEach(l=>{
      const a=entGet(l.st,l.sid), b=entGet(l.tt,l.tid); if(!a||!b) return;
      L.push(`- ${entName(l.st,a)} ${REL_LABEL[l.rel]||l.rel} ${entName(l.tt,b)}${l.conf<0.75?" (inferred, low confidence)":""}`);
    });
  }
  return {refs,text:L.join("\n")};
}
function askWorkPrompt(o,q,ctx){
  const day=hireDay(o);
  return `You are the organizational memory of one person — ${getProfile().name||"the user"}${o.hired&&o.hired.title?`, ${o.hired.title}`:""} at ${o.company}${day>0?`, ${day} days in`:""}. Everything below is what THEY have personally recorded. Today is ${todayYMD()}.

${ctx.text}

---
Answer their question using only the records above.

Hard rules:
- Cite your sources inline with the bracket ids exactly as they appear, e.g. [p2] or [c7]. Every specific claim needs at least one.
- Distinguish what is recorded from what you're inferring. Say "You recorded…", "Based on three notes…", "This appears to be…".
- If the records don't cover it, say so plainly and suggest who they could ask or what to find out. Never invent people, owners, reporting lines, dates, project status, company politics or anyone's opinions.
- Be concise and concrete. Lead with the answer. No preamble, no headings unless it genuinely helps.

Question: ${q}`;
}
let askRefs={};
// a citation reads as a name for a record and as a date for a note — never a wall of note text
function citeLabel(t,id){
  if(t==="bite"){ const b=entGet("bite",id); return b?clip(b.fact,42):""; }
  if(t==="capture"){ const c=wFind("captures",id); return c?`${fmtDate(ymdOf(c.at))} note`:""; }
  return entLabel(t,id);
}
function citeHTML(text){
  return esc(text).replace(/\[([a-z]{1,2}\d{1,3})\]/g,(m,id)=>{
    const r=askRefs[id]; if(!r) return m;
    const label=citeLabel(r.t,r.id); if(!label) return m;
    return `<span class="cite" data-cite="${r.t}|${r.id}">${esc(label)}</span>`;
  });
}
/* ---- Ask history ----
   A question you asked last week is often the one you want again, and re-asking costs a call and
   loses the wording. The last ASK_KEEP land on state.work.asks so they sync like everything else.
   Answers are trimmed: this is one localStorage key that gets pushed to the vault on every save. */
const ASK_KEEP=10, ASK_MAX=4000;
/* Answers you have already read are a convenience for THIS device, not part of the record of the
   company — and at ten entries of four thousand characters they were the single largest block in a
   document that gets re-uploaded on every save. So they live in devPrefs now. Anything already
   filed in the synced document is taken over on load rather than thrown away. */
function askStore(){ if(!Array.isArray(devPrefs.asks)) devPrefs.asks=[]; return devPrefs.asks; }
function absorbAsks(){
  const w=state.work; if(!w||!Array.isArray(w.asks)||!w.asks.length) return;
  const mine=askStore(), have=new Set(mine.map(x=>x.id));
  w.asks.forEach(x=>{ if(x&&x.id&&!have.has(x.id)) mine.push(x); });
  w.asks=[];                      // out of the synced document for good
  saveDev();
}
function askLog(o,q,a){
  if(!o||!q||!a) return;
  absorbAsks();
  let list=askStore();
  // asking the same thing again replaces the old entry rather than stacking a near-duplicate
  list=list.filter(x=>!(x.opId===o.id && canonThing(x.q)===canonThing(q)));
  // Date.now() ties inside one millisecond, and a tie makes "keep the newest ten" arbitrary —
  // the same reason save() forces rev strictly upward.
  const last=list.reduce((m,x)=>Math.max(m,+x.at||0),0);
  list.push({id:uid(),opId:o.id,at:Math.max(Date.now(),last+1),q:String(q).slice(0,300),a:String(a).slice(0,ASK_MAX)});
  const mine=list.filter(x=>x.opId===o.id).sort((x,y)=>y.at-x.at);
  const keep=new Set(mine.slice(0,ASK_KEEP).map(x=>x.id));
  devPrefs.asks=list.filter(x=>x.opId!==o.id||keep.has(x.id));
  saveDev();
}
function askHistory(o){ absorbAsks(); return askStore().filter(x=>x&&x.opId===o.id).sort((a,b)=>b.at-a.at); }
function askHistoryHTML(o){

}

/* ---- "Who do I ask?" — ranked in JS from the graph so the evidence is always real.
   The AI only phrases the recommendation; it can't add a person who isn't in your records. ---- */
const STOP=new Set("the a an of for to in on at is are was were do does did i my me we our you your it this that what who how why when which and or but with about into from can should would could".split(" "));
function terms(q){ return norm(q).split(" ").filter(w=>w.length>2&&!STOP.has(w)); }
function whoToAsk(o,q){
  const T=terms(q); if(!T.length) return [];
  const hit=s=>{ const n=norm(s); return T.filter(t=>n.includes(t)).length; };
  const out=[];
  // never send you to someone who has left — their knowledge is in your notes, not at their desk
  (o.people||[]).filter(p=>personHere(p)&&!isMe(o,p)).forEach(p=>{
    let score=0; const why=[];
    const rel=relatedTo("person",p.id,true);
    rel.forEach(r=>{
      const nm=entLabel(r.type,r.id); const h=hit(nm); if(!h) return;
      const w=({OWNS:5,KNOWS:4,HELPED_SOLVE:5,INVOLVED_IN:3,WORKS_IN:2,USES:2}[r.rel]||2)*(r.conf||1);
      score+=w*h;
      why.push(`${r.dir==="out"?(REL_LABEL[r.rel]||r.rel):"linked to"} ${nm}${r.conf<0.75?" — though that one's inferred":""}`);
    });
    (p.expertise||[]).forEach(x=>{ const h=hit(x); if(h){ score+=3*h; why.push(`you recorded them as knowing ${x}`); } });
    if(p.title&&hit(p.title)){ score+=2; why.push(`their title is ${p.title}`); }
    if(p.deptId&&hit(entLabel("department",p.deptId))){ score+=2; why.push(`they're in ${entLabel("department",p.deptId)}`); }
    const caps=evidenceFor("person",p.id).filter(c=>hit(c.text));
    if(caps.length){ score+=1.6*caps.length; why.push(caps.length===1?"one of your notes mentions them alongside this":`${caps.length} of your notes mention them alongside this`); }
    if(score>0) out.push({p,score,why:[...new Set(why)],caps});
  });
  return out.sort((a,b)=>b.score-a.score).slice(0,4);
}

/* ---- "What am I missing?" — every gap below is computed from the records, so each one is
   a fact about your notes, not a guess about the company. ---- */
function knowledgeGaps(o){
  const g=[]; const ppl=(o.people||[]);
  const add=(icon,col,title,why,act)=>g.push({icon,col,title,why,act});
  wOf("systems",o.id).forEach(s=>{
    const knowers=relatedOfType("system",s.id,"person",["KNOWS","OWNS"]).length
      + linksOf("system",s.id).filter(l=>l.st==="person"&&(l.rel==="KNOWS"||l.rel==="OWNS")).length;
    if(!s.ownerId&&!knowers) add(I.system,ENT.system.col,`Nobody owns ${entName("system",s)}`,`You've referenced ${entName("system",s)} but haven't recorded who owns it or who knows it well.`,{t:"who",q:entName("system",s)});
  });
  wOf("projects",o.id).forEach(p=>{
    if(!p.ownerId&&!relatedOfType("project",p.id,"person",["OWNS"]).length)
      add(I.project,ENT.project.col,`${entName("project",p)} has no clear owner`,`You've mentioned this project but haven't recorded who owns it.`,{t:"who",q:entName("project",p)});
  });
  wOf("problems",o.id).filter(p=>p.status==="Discovered"||p.status==="Investigating").forEach(p=>{
    const age=daysSince(p.at);
    if(age>=14) add(I.problem,ENT.problem.col,`"${entName("problem",p)}" has been open ${age} days`,`Still ${p.status.toLowerCase()} with no recorded outcome.`,{t:"ent",type:"problem",id:p.id});
  });
  // departments your work depends on but you barely talk to
  wOf("departments",o.id).forEach(d=>{
    const people=ppl.filter(p=>p.deptId===d.id).length;
    const deps=W().links.filter(l=>l&&l.opId===o.id&&((l.st==="department"&&l.sid===d.id)||(l.tt==="department"&&l.tid===d.id))&&l.rel!=="MENTIONS"&&l.rel!=="WORKS_IN").length;
    if(deps>=2&&people===0) add(I.people,ENT.department.col,`You don't know anyone in ${entName("department",d)}`,`${deps} things you've recorded touch ${entName("department",d)}, but you haven't met anyone there.`,{t:"who",q:entName("department",d)});
  });
  const openQ=wOf("questions",o.id).filter(q=>q.status==="Open"&&daysSince(q.at)>=7);
  if(openQ.length>=3) add(I.question,ENT.question.col,`${openQ.length} questions have been open over a week`,`Oldest: "${entName("question",openQ.sort((a,b)=>a.at-b.at)[0])}"`,{t:"tab",tab:"knowledge"});
  // interview contacts who've gone quiet since you joined
  const started=o.hired&&o.hired.startDate?new Date(o.hired.startDate+"T00:00").getTime():0;
  const quiet=ppl.filter(p=>{ const ints=personInteractions(p).filter(x=>x.at>started); return started&&!ints.length; });
  if(quiet.length&&hireDay(o)>=14) add(I.user,"#6d8bc4",`${quiet.length} ${quiet.length===1?"person":"people"} from your interviews you haven't caught up with`,quiet.slice(0,4).map(p=>p.name).join(", "),{t:"tab",tab:"people"});
  if(hireDay(o)>=7&&wOf("captures",o.id).length<3) add(I.note,"#7c828f","Your map is still mostly empty",`A note after each meeting is all it takes — that's what everything else here is built from.`,{t:"cap"});
  return g;
}
function gapHTML(g){

/* ---- 30 / 60 / 90-day reviews. The numbers and lists are computed; the AI writes the read
   on top of them. Saved so you can look back at who you were on day 30. ---- */
function reportData(o,day){
  const start=o.hired&&o.hired.startDate?new Date(o.hired.startDate+"T00:00").getTime():o.createdAt;
  const until=start+day*86400000;
  const inWin=r=>r.at<=until;
  const d={day,people:(o.people||[]).filter(p=>!p.at||p.at<=until),caps:wOf("captures",o.id).filter(inWin)};
  ["project","problem","department","system","process","decision","question"].forEach(t=>{ d[t]=wOf(ENT[t].list,o.id).filter(inWin); });
  d.solved=d.problem.filter(p=>p.status==="Solved");
  d.openQ=d.question.filter(q=>q.status==="Open");
  d.gaps=knowledgeGaps(o);
  return d;
}
function reportText(o,day){
  const d=reportData(o,day);
  const L=[`# Day ${day} at ${o.company}`,``,
    `Role: ${workTitle(o)}${o.hired&&o.hired.startDate?` · started ${fmtDate(o.hired.startDate)}`:""}`,
    `Notes captured: ${d.caps.length}`,``,
    `## People (${d.people.length})`,
    ...d.people.map(p=>`- ${p.name}${p.title?` — ${p.title}`:""}${p.deptId?` · ${entLabel("department",p.deptId)}`:""}${(p.expertise||[]).length?` · knows ${p.expertise.join(", ")}`:""} · ${personInteractions(p).length} interactions`),
    ``,`## Departments (${d.department.length})`, ...d.department.map(x=>`- ${entName("department",x)}`),
    ``,`## Projects (${d.project.length})`, ...d.project.map(x=>`- ${entName("project",x)} [${x.status}]${x.ownerId?` · owner ${entLabel("person",x.ownerId)}`:" · owner not recorded"}`),
    ``,`## Problems (${d.problem.length}, ${d.solved.length} solved)`, ...d.problem.map(x=>`- ${entName("problem",x)} [${x.status}]`),
    ``,`## Systems (${d.system.length})`, ...d.system.map(x=>`- ${entName("system",x)}${x.ownerId?` · owner ${entLabel("person",x.ownerId)}`:""}`),
    ``,`## Processes (${d.process.length})`, ...d.process.map(x=>`- ${entName("process",x)}`),
    ``,`## Decisions recorded (${d.decision.length})`, ...d.decision.map(x=>`- ${entName("decision",x)}${x.reason?` — ${x.reason}`:""}`),
    ``,`## Still open (${d.openQ.length})`, ...d.openQ.map(x=>`- ${entName("question",x)}`),
    ``,`## Gaps in what I've recorded`, ...d.gaps.map(g=>`- ${g.title}: ${g.why}`),
  ];
  return L.join("\n");
}
function reportPrompt(o,day){
  const ninety = day>=90;
  return `${reportText(o,day)}

---
Everything above is what I personally recorded during my first ${day} days at ${o.company}. Write my ${ninety?"90-day map":`day-${day} review`} from it — plain text, no markdown headers heavier than a single line, warm but direct, written to me as "you".

${ninety?`Cover, in this order: how I understand the organization; the people who matter most to my role and what each knows; how the departments actually interact; how important work gets done; the systems I depend on and who owns them; the major projects affecting me; the problems I found; what I helped solve; where I could have impact; what I still don't understand; and what I should focus on next.`
: `Cover: what I've learned, who I now know and how well, what I've discovered about how the place works, what I'm still missing, which relationships to strengthen, and what to focus on in the next 30 days.`}

Rules: use only what's above. Don't invent people, projects, problems or opinions. Where my records are thin, say so — "you haven't recorded anything about X yet" is a useful finding. Be specific: name the actual people, systems and projects.`;
}
async function openReport(day){
  const o=workOp(); if(!o) return;
  day=+day;
  const saved=wOf("reports",o.id).find(r=>r.day===day);
  const title=day>=90?"Your 90-day map":`Day ${day} review`;
  const shell=body=>`<div style="display:flex;align-items:center;gap:11px;margin-bottom:12px">
    <div style="width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center">${day>=90?I.trophy:I.map}</div>
    <div style="min-width:0"><h2 style="margin:0;font-size:18px;font-weight:850">${esc(title)}</h2><div style="font-size:12.5px;color:var(--faint)">${esc(o.company)} · ${esc(workTitle(o))}</div></div>
    <button class="x-btn" data-act="cancel-editor" style="margin-left:auto">${I.x}</button></div>${body}`;
  const d=reportData(o,day);
  const numbers=`<div class="w-tiles" style="margin-bottom:14px">
    ${[[d.people.length,"People"],[d.department.length,"Departments"],[d.project.length,"Projects"],[d.problem.length,"Problems"],[d.system.length,"Systems"],[d.openQ.length,"Open questions"]]
      .map(([n,l])=>`<div class="w-tile" style="cursor:default"><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`).join("")}</div>`;
  if(saved){
    openEditor(shell(numbers+`<div class="ai-pre" style="white-space:pre-wrap;max-height:none">${esc(saved.text)}</div>
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost sm" data-act="report-copy">${I.copy} Copy</button><button class="btn ghost sm" data-report-regen="${day}">↻ Regenerate</button></div>`));
    aiGenText=saved.text; return;
  }
  if(aiEngine()==="paste"||aiEngine()==="off"){
    openEditor(shell(numbers+`<div class="ai-pre" style="white-space:pre-wrap;max-height:none">${esc(reportText(o,day))}</div>
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost sm" data-act="report-copy">${I.copy} Copy the full prompt</button></div>
      <div class="cap-hint">Paste that into any AI to get the written review — or connect one in Settings for a single tap.</div>`));
    aiGenText=reportPrompt(o,day); return;
  }
  openEditor(shell(numbers+`<div id="repBody" class="ai-pre" style="white-space:pre-wrap;min-height:140px;max-height:none">Reading back through your ${day} days…</div><div id="repFoot" style="display:flex;gap:8px;margin-top:12px"></div>`));
  try{
    const out=await aiCall(reportPrompt(o,day),null,{json:false,maxTokens:2600});
    const text=(out||"").trim(); aiGenText=text;
    wAdd("reports",{opId:o.id,day,text}); save();
    const b=document.getElementById("repBody"); if(b) b.textContent=text||"(no response)";
    const f=document.getElementById("repFoot"); if(f) f.innerHTML=`<button class="btn ghost sm" data-act="report-copy">${I.copy} Copy</button><button class="btn ghost sm" data-act="cancel-editor">Close</button>`;
  }catch(e){
    const b=document.getElementById("repBody"); if(b) b.textContent="⚠ "+e.message+"\n\nThe raw numbers are above — try again, or switch engine in Settings.";
    const f=document.getElementById("repFoot"); if(f) f.innerHTML=`<button class="btn ghost sm" data-act="cancel-editor">Close</button>`;
  }
}

function buildBrief(o){
  const L=[];
  L.push(`# Interview brief — ${o.company}${o.role?` (${o.role})`:""}`);
  L.push("");
  if(getProfile().name) L.push(`- Candidate (me): ${getProfile().name}${getProfile().headline?` — ${getProfile().headline}`:""}`);
  L.push(`- Stage: ${stage(o.status).name}`);
  if(o.source) L.push(`- How I got here: ${o.source}${o.referrer?` (via ${o.referrer})`:""}`);
  if(o.workMode||o.location) L.push(`- Setup: ${[o.workMode,o.location].filter(Boolean).join(", ")}`);
  if(o.compMin||o.compMax) L.push(`- Comp target: ${(o.compMin?fmtMoney(o.compMin):"")}${o.compMax?"–"+fmtMoney(o.compMax):""}${o.compNotes?` (${o.compNotes})`:""}`);
  if(o.excitement) L.push(`- My excitement: ${o.excitement}/5`);
  const e=nextEvent(o); if(e) L.push(`- Next: ${e.label} on ${fmtDateTime(e.date,e.time)||fmtDate(e.date)}`);
  if(o.jobUrl) L.push(`- Job post: ${o.jobUrl}`);
  if((o.tags||[]).length) L.push(`- Tags: ${o.tags.join(", ")}`);
  if(o.product){ L.push(""); L.push(`## Company / product`); L.push(o.product); }
  if(o.vibes){ L.push(""); L.push(`## Vibes / culture read`); L.push(o.vibes); }
  if(o.notes){ L.push(""); L.push(`## My notes`); L.push(o.notes); }
  if((o.people||[]).length){ L.push(""); L.push(`## People I'm meeting`); o.people.forEach(p=>{ L.push(`- ${p.name}${p.title?` — ${p.title}`:""}${p.linkedin?` · ${p.linkedin}`:""}`); if(p.notes) L.push(`  notes: ${p.notes}`); }); }
  if((o.rounds||[]).length){ L.push(""); L.push(`## Interview rounds so far`); o.rounds.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(r=>{ L.push(`- ${r.name||r.type||"Round"}${r.date?` (${fmtDate(r.date)})`:""}${r.status==="done"?" — done":""}${r.rating?` — went ${r.rating}/5`:""}`); if(r.debrief) L.push(`  debrief: ${r.debrief}`); }); }
  if(o.jd){ L.push(""); L.push(`## Job description`); L.push(o.jd.length>4000?o.jd.slice(0,4000)+"\n…(trimmed)":o.jd); }
  else if(o.jdFile){ L.push(""); L.push(`## Job description`); L.push(`(attached as file: ${o.jdFile.name})`); }
  return L.join("\n");
}

function snapshotEditor(){
  if(!editorEl) return;
  editorEl.querySelectorAll("input,textarea,select").forEach(el=>{
    if(el.type==="file"||el.type==="button") return;
    el.dataset.initial = el.type==="checkbox"||el.type==="radio" ? (el.checked?"1":"") : (el.value||"");
  });

function editorDirty(){
  if(!editorEl) return false;
  return [...editorEl.querySelectorAll("input,textarea,select")].some(el=>{
    if(el.type==="file"||el.type==="button"||el.dataset.initial===undefined) return false;
    const now = el.type==="checkbox"||el.type==="radio" ? (el.checked?"1":"") : (el.value||"");
    return now !== el.dataset.initial;
  });
}
function tryCloseEditor(){
  if(!editorDirty()) return closeEditor();

/* ---------------- SETTINGS / SYNC PANEL ---------------- */
/* One table, owned per account. Row-level security is what makes this safe to share with
   colleagues: the policies compare auth.uid() to the row's owner, so Postgres itself refuses to
   hand anyone somebody else's notes — it is not a check the app could forget to make.
   The old code-based table and its two functions are left alone so existing vaults keep working. */
const SYNC_SQL = `-- Run this once in Supabase: Dashboard > SQL Editor > New query > paste > Run

-- Your notes, one row per account.
create table if not exists user_vaults (
  user_id    uuid primary key references auth.users(id) on delete cascade,
  doc        jsonb       not null,
  rev        bigint      not null default 0,
  updated_at timestamptz not null default now()
);

alter table user_vaults enable row level security;

-- Postgres enforces this, not the app: you can only ever touch your own row.
drop policy if exists "read own vault"   on user_vaults;
drop policy if exists "insert own vault" on user_vaults;
drop policy if exists "update own vault" on user_vaults;
drop policy if exists "delete own vault" on user_vaults;

create policy "read own vault"   on user_vaults for select
  using (auth.uid() = user_id);
create policy "insert own vault" on user_vaults for insert
  with check (auth.uid() = user_id);
create policy "update own vault" on user_vaults for update
  using (auth.uid() = user_id) with check (auth.uid() = user_id);
create policy "delete own vault" on user_vaults for delete
  using (auth.uid() = user_id);

-- Nothing is readable without a signed-in user.
revoke all on user_vaults from anon;
grant select, insert, update, delete on user_vaults to authenticated;`;

/* Two-factor was, until now, enforced only by this app: the policies above check auth.uid() and
   nothing else, so a password alone yields an aal1 token that can read and write the vault
   straight over the REST API without ever seeing the code prompt. This makes Postgres enforce it.

   It is deliberately separate and optional. It affects ONLY accounts that have a verified factor
   (everyone else takes the `else true` branch untouched), and the last line of the block is the
   one-liner that puts it back exactly as it was — because this is the one change in here that
   could lock someone out of their own notes, and the way back should not need looking up. */
const MFA_SQL = `-- Optional: make two-factor real at the database level, not just in the app.
-- Safe for accounts without 2FA — they are unaffected. Run AFTER the setup SQL above.

create or replace function public.mw_mfa_ok() returns boolean
  language sql stable security definer set search_path = public, auth as $$
  select case
    when exists (select 1 from auth.mfa_factors f
                 where f.user_id = auth.uid() and f.status = 'verified')
    then coalesce(auth.jwt() ->> 'aal', 'aal1') = 'aal2'
    else true
  end;

/* An invite link carries the project details in the URL fragment, so a colleague opens one link
   and lands on the sign-in screen instead of being asked to paste a key. Fragments are never sent
   to a server, and the anon key is public by design — the row-level policies are what protect the
   data. It's stripped from the address bar immediately either way. */
function readInviteLink(){
  const m=/[#&]s=([A-Za-z0-9+/=_-]+)/.exec(location.hash||"");
  if(!m) return;
  try{
    const j=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")))));
    if(j&&j.u&&j.k&&/^https?:\/\//.test(j.u)&&!sync.url){ sync.url=j.u; sync.key=j.k; saveSync(); }
  }catch(e){}
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
}
function inviteLink(){
  if(!authReady()) return "";
  const payload=btoa(unescape(encodeURIComponent(JSON.stringify({u:sync.url,k:sync.key}))))
    .replace(/\+/g,"-").replace(/\//g,"_");
  return location.origin+location.pathname+"#s="+payload;
}

/* Called before every auth request so a freshly-typed project is saved first. The login screen's
   sign-in view has no project fields on it — there, "nothing to read" means "use what's stored",
   not "the user left it blank". */
function saveProjectCfg(){
  const u=document.querySelector('#syncUrl'), k=document.querySelector('#syncKeyInput');
  if(!u&&!k){
    if(authReady()) return true;
    acctErr("Add your project URL and key first."); return false;
  }
  let url=((u&&u.value)||"").trim(), key=((k&&k.value)||"").trim();
  if(!url && refFromKey(key)) url="https://"+refFromKey(key)+".supabase.co";   // the key knows
  if(!url||!key){ acctErr("Both the project URL and the anon key are needed."); return false; }
  const bad=projectUrlProblem(url) || keyProblem(url,key);
  if(bad){ acctErr(bad); return false; }
  url=url.replace(/\/+$/,"").replace(/\/rest\/v1$/,"");   // paste-friendly
  sync.url=url; sync.key=key; delete sync.builtIn;   // an explicit choice beats the built-in one
  saveSync();
  return true;
}
/* The old sync setup checked this and the rewrite dropped it, which let a dashboard URL through
   and turned every sign-in into an unexplained 401. Say which mistake it is, not "invalid". */
function projectUrlProblem(url){
  if(!/^https?:\/\//i.test(url)) return "That URL should start with https://";
  if(/supabase\.com\/dashboard|supabase\.com\/project/i.test(url))
    return "That's the dashboard address. You want the API one — Project Settings → API → Project URL. It looks like https://abcdefgh.supabase.co";
  if(/\s/.test(url)) return "There's a space in that URL — re-copy it.";
  return "";
}
/* The anon key is a JWT that names its own project, its role and its expiry — so most of the ways
   it can be wrong are answerable here, offline, before a single request goes out. That beats
   round-tripping to Supabase for a 401 that only says "invalid". */
function jwtBody(tok){
  try{
    const p=String(tok).split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
    return JSON.parse(decodeURIComponent(escape(atob(p+"===".slice((p.length+3)%4)))));
  }catch(e){ return null; }
}
/* The anon key carries its own project ref, so a mistyped URL is not just detectable — it is
   correctable without asking. One doubled character in a 20-character ref is invisible to read
   back and sends every request to a project that isn't yours. */
function refFromKey(key){ const c=jwtBody(String(key||"").trim()); return (c&&c.ref)||""; }
function suggestedRef(){
  const kEl=document.getElementById("syncKeyInput"), uEl=document.getElementById("syncUrl");
  const k=((kEl&&kEl.value)||sync.key||"").trim();
  const u=((uEl&&uEl.value)||sync.url||"").trim();
  const r=refFromKey(k);
  return (r && r!==projectRef(u)) ? r : "";
}
function projectRef(url){ return (String(url||"").match(/^https?:\/\/([a-z0-9-]+)\.supabase\./i)||[])[1]||""; }
function keyProblem(url,key){
  key=String(key||"").trim();
  if(!key) return "Paste the anon key as well.";
  if(/\s/.test(key)) return "That key has a space or a line break in it — select it again and re-copy, without the surrounding text.";
  if(/^sb_secret_/i.test(key)) return "That's the SECRET key. It must never go in an app — anyone could read everyone's notes with it. Use the publishable one instead, and roll that secret in the dashboard.";
  if(/^sb_publishable_/i.test(key)) return "";      // new-style key; nothing to introspect, let the network decide
  const c=jwtBody(key);
  // An unrecognised format is NOT a blocking error. Supabase has already changed key formats once,
  // and this check must never be the reason a perfectly good setup is refused — let the server say.
  if(!c) return "";
  if(c.role==="service_role") return "That's the service_role key — it bypasses every access rule and must never go in an app. Take the one labelled anon public, and roll the service key in your dashboard.";
  if(c.role && c.role!=="anon") return `That key's role is “${c.role}”. You want the one labelled anon public.`;
  const want=projectRef(url), got=c.ref||"";
  if(want && got && want!==got) return `That key belongs to project “${got}”, but the URL points at “${want}”. They have to be the same project — most likely one of the two was copied from a different project.`;
  if(c.exp && c.exp*1000 < Date.now()) return "That key has expired. Generate a fresh anon key in Project Settings → API.";
  return "";
}
/* A one-tap answer to "why won't it let me in". Checks the two things that can be wrong,
   separately, and names which one it is. */
async function testConnection(){
  const u=document.querySelector('#syncUrl'), k=document.querySelector('#syncKeyInput');
  const url=((u&&u.value)||sync.url||"").trim().replace(/\/+$/,"");
  const key=((k&&k.value)||sync.key||"").trim();
  if(!url||!key){ acctErr("Fill in both boxes first, then tap this."); return; }
  const bad=projectUrlProblem(url) || keyProblem(url,key);
  if(bad){ acctErr(bad); toast("⚠ "+bad.slice(0,90)); return; }
  acctErr("Checking…");
  let res;
  try{
    res=await fetch(url+"/auth/v1/settings",{headers:{apikey:key,Authorization:"Bearer "+key}});
  }catch(e){ acctErr("Couldn't reach "+url.replace(/^https?:\/\//,"")+" at all. Check the URL, and that you're online."); return; }
  const raw=await res.text();
  const txt=raw.slice(0,200);
  // A paused project still resolves, but the platform answers with an HTML page rather than the
  // API. Free projects pause themselves after a stretch of no traffic — which is exactly what
  // "it worked on Friday" looks like from here.
  if(!res.ok && (/^\s*</.test(raw) || [502,503,504,540].includes(res.status))){
    acctErr("The project isn't answering — it looks paused or asleep. Open your Supabase dashboard: a paused project shows a Restore button, and free projects pause themselves after a week or so without traffic. Restore it and try again.");
    toast("⚠ The project looks paused");
    return;
  }
  if(res.ok){
    let j=null; try{ j=JSON.parse(txt); }catch(e){}
    sync.url=url; sync.key=key; saveSync();
    const mail=j&&j.external&&j.external.email!==false;
    acctErr("");
    toast("✓ Connected"+(mail?"":" — but email sign-in is turned off in this project"));
    if(authGateUp()) authSet("signin"); else openSettings();
    return;
  }
  const say=m=>{ acctErr(m); toast("⚠ "+m.slice(0,90)); };
  if(res.status===401||res.status===403){
    /* A well-formed anon key, for this very project, that the project now refuses. Nothing about
       the key is wrong — so something changed at the other end. These are the two that do it, and
       both look like "it worked on Friday". */
    const c=jwtBody(key);
    if(c && c.role==="anon" && (!c.ref || !projectRef(url) || c.ref===projectRef(url))){
      say("This key is well formed and does belong to project “"+(c.ref||projectRef(url))+"”, but the project is refusing it. Nothing is wrong with what you pasted — something changed on Supabase's side. Two things do this: legacy API keys were turned off (Project Settings → API — use the newer publishable key instead), or the JWT secret was rotated (which invalidates every old key). Server said: "+txt);
      return;
    }
    say("The URL is reachable but that anon key isn't valid for it. Project Settings → API → the key labelled anon public. Server said: "+txt);
    return;
  }
  else if(res.status===404) say("Reached that address but there's no Supabase API there. It should look like https://abcdefgh.supabase.co");
  else say("The project answered "+res.status+": "+txt);
}
/* Errors go to whichever slot is on screen: the sign-in form has one, and the project-settings
   block carries its own so "Test connection" always has somewhere to report — signed in included. */
function acctErr(msg){
  const e=document.getElementById("acctErr")||document.getElementById("cfgErr");
  if(!e) return;
  if(!msg){ e.innerHTML=""; e.style.display="none"; return; }
  /* Never tell someone to go to Settings from a screen with no way to reach Settings. If the
     failure is about the project or the key, the fix travels with the message. */
  const cfgish=/\b401\b|\b404\b|anon key|api key|project url|workspace|supabase|not authoris/i.test(msg);
  const ref=suggestedRef();
  e.innerHTML=esc(msg)
    +(ref?`<button class="ag-fix" data-act="auth-fix-url">Use ${esc(ref)} — the project this key belongs to</button>`:"")
    +((cfgish&&authGateUp()&&!ref)?`<button class="ag-fix" data-act="auth-view-setup">Check workspace settings</button>`:"");
  e.style.display="block";
}
function acctFields(){

function acctBusy(on,label){
  const root=authGateUp()?document.getElementById("authGate"):editorEl;
  const b=root&&root.querySelector('[data-act="acct-signin"],[data-act="acct-signup"]');
  if(b){ b.disabled=on; if(on) b.textContent=label||"Working…"; }
}
function acctReset(label){
  const root=authGateUp()?document.getElementById("authGate"):editorEl;
  const b=root&&root.querySelector('[data-act="acct-signin"],[data-act="acct-signup"]');
  if(b){ b.disabled=false; b.textContent=label; }

async function doSignIn(){
  if(!saveProjectCfg()) return;
  const {email,pass}=acctFields();
  if(!email||!pass){ acctErr("Email and password, please."); return; }
  acctErr(""); acctBusy(true,"Signing in…");
  try{
    const r=await authSignIn(email,pass);
    if(r.factor){ openMFAChallenge(r.factor); return; }   // two-factor still to satisfy
    await finishSignIn();
  }catch(e){ acctErr(e.message); acctReset(authGateUp()?"Sign in":"✓ Sign in"); }
}
async function doSignUp(){
  if(!saveProjectCfg()) return;
  const {email,pass}=acctFields();
  if(!email||!pass){ acctErr("Email and password, please."); return; }
  if(pass.length<8){ acctErr("Use at least 8 characters — this is the key to everything you write here."); return; }
  acctErr(""); acctBusy(true,"Creating…");
  try{
    session.email=email; saveSession();     // so the "check your email" screen can name it
    const r=await authSignUp(email,pass);

      acctReset("Create account");

      openEditor(`<div style="text-align:center;padding:10px 4px">

        <button class="btn primary" style="width:100%" data-act="settings">Back to sign in</button></div>`);
      return;
    }

async function finishSignIn(){
  try{
    const r=await afterSignIn();
    if(r==="locked"){ closeAuthGate(); return; }   // the unlock screen is up; it takes it from here
    if(r==="cancelled"){                            // they backed out of the two-datasets choice
      acctBusy(false); acctReset("Sign in");
      if(authGateUp()) authSet("signin"); else { render(); openSettings(); }
      toast("Signed out again — nothing was changed on either side");
      return;
    }
    if(authGateUp()){ closeAuthGate(); render(); toast("Signed in as "+(session.email||"you")); return; }
    render(); openSettings();
    toast("Signed in as "+(session.email||"you"));
  }catch(e){ acctErr(e.message); acctBusy(false); }
}

      if(lastStatus===401) throw new Error("That Groq key looks invalid — re-copy it from console.groq.com/keys.");
      if(imgs.length && [404,400].includes(lastStatus)) throw new Error(groqDiscoverFailed
        ? "Couldn't reach Groq to see which models your key can run. Check the connection and try again."
        : "No model on this Groq key would read the picture. Gemini's free tier does — switch the engine in AI settings, or save the note without it.");
      if([404,400].includes(lastStatus)) throw new Error("Groq has no model this key can run right now. Open AI settings and pick one from the list — it reads them straight from your account.");
      throw new Error("Groq "+lastStatus+(said?" — "+said:""));
    }
    // remember what worked, so the next call goes straight there
    const won=tried[tried.length-1];
    if(won && aiCfg.model!==won){ aiCfg.model=won; saveAICfg(); }
    const j=await res.json(); return (((j.choices||[])[0]||{}).message||{}).content||"";
  }
  if(eng==="google"){
    const parts = docs.map(d=>({inline_data:{mime_type:d.mime||"application/pdf",data:d.data}})).concat([{text:prompt}]);
    const genCfg = wantJson ? {responseMimeType:"application/json",maxOutputTokens:maxTok} : {maxOutputTokens:maxTok};
    const body=JSON.stringify({contents:[{parts}],generationConfig:genCfg});
    // The model list comes from the key, never from a constant in here — Google retires names on
    // its own schedule and a hard-coded chain dies naming a model the user never picked. Each
    // free-tier model also has its OWN quota, so a 429 is still worth trying the next one for.
    let res,lastStatus=0,lastErr="",tried=[],lastRetry=0;
    const attempt=async model=>fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(aiKey())}`,
      {method:"POST",headers:{"Content-Type":"application/json"},body});
    const run=async list=>{
      for(const model of list){
        if(!model||tried.includes(model)) continue;
        tried.push(model);
        res=await attempt(model);
        if(res.ok) return true;
        lastStatus=res.status; lastErr=await res.text(); lastRetry=retryAfterMs(res);
        // 404/400 = a dead model name; 429/5xx = that model is busy or out of quota. Both are
        // reasons to try the NEXT model, because each one has its own quota and its own load.
        if(![404,400,...AI_BUSY].includes(res.status)) return false;
      }
      return false;
    };
    gemDiscoverFailed=false;      // a stale flag from an earlier call must not describe this one
    let cands=[aiCfg.model, ...gemCached()].filter(Boolean);
    if(!cands.length) cands=await gemDiscover(false);
    let done=cands.length ? await run(cands) : false;
    // everything we knew about is gone (or we never knew anything) — re-read the catalogue once
    if(!done && (!tried.length || [404,400].includes(lastStatus))){
      const fresh=await gemDiscover(true);
      if(fresh.length) done=await run(fresh);
    }
    /* Every model was busy. "High demand" really is usually temporary, so back off briefly and
       try the best two again before telling the user anything — one wasted second beats a red
       error over a request that would have worked. */
    if(!done && AI_BUSY.includes(lastStatus)){
      for(const wait of [lastRetry||700, 1800]){
        await sleepMs(wait);
        tried=[]; done=await run([aiCfg.model, ...gemCached()].filter(Boolean).slice(0,2));
        if(done) break;
      }
    }
    if(!done){
      const said=apiErrText(lastErr);
      if([500,502,503,504,529].includes(lastStatus)) throw aiErr("Gemini is under heavy load — usually temporary. Add a free Groq key in AI settings and Meanwhile switches over automatically when this happens.",true);
      if(lastStatus===429) throw aiErr("Gemini's free rate limit was hit — it resets within a minute. Add a free Groq key in AI settings and Meanwhile switches over automatically.",true);
      if((lastStatus===400||lastStatus===403) && /API key|API_KEY|permission/i.test(said)) throw new Error("That Gemini key looks invalid — re-copy it from aistudio.google.com/apikey.");
      // never tried anything means we never got a model name — that is a catalogue problem, not a
      // request problem, and blaming the key for a dropped connection is the wrong sentence.
      if(gemDiscoverFailed) throw new Error("Couldn't reach Google to see which models your key can run. Check the connection and try again.");
      if(!tried.length) throw new Error("This Gemini key can't run any chat models right now — re-copy it from aistudio.google.com/apikey, or switch the engine in AI settings.");
      if([404,400].includes(lastStatus)) throw new Error("None of the Gemini models on this key would take that request. Open AI settings and pick one — the list is read straight from your key.");
      throw new Error("Gemini "+lastStatus+(said?" — "+said:""));
    }
    if(tried.length){ const won=tried[tried.length-1]; if(won&&aiCfg.model!==won){ aiCfg.model=won; saveAICfg(); } }
    const j=await res.json(); return ((((j.candidates||[])[0]||{}).content||{}).parts||[{}])[0].text||"";
  }

}
/* You have keys for both free providers, and they fail at different moments — Groq rate-limits
   hard on its free tier, Gemini goes "high demand" under load. Sitting on one while the other is
   idle is the wrong answer, so a BUSY failure (never a bad key, never a bad request) borrows the
   other one for that single call and says so afterwards.

   Deliberately only between the two FREE providers. Falling over to a paid key would spend money
   the user never agreed to spend on a request they didn't know had failed. */
function altFreeEngine(){
  const cur=aiCfg.engine||"google";
  const alt = cur==="google" ? "groq" : cur==="groq" ? "google" : "";
  return (alt && keyFor(alt)) ? alt : "";
}
// one at a time: the swap is global, so two overlapping calls must not trade engines under each other
let aiFailingOver=false;
async function aiCall(prompt, doc, opts){
  opts=opts||{};
  try{ return await aiCallOne(prompt, doc, opts); }
  catch(e){
    const alt = (e&&e.busy&&!opts.noFailover&&!aiFailingOver) ? altFreeEngine() : "";
    if(!alt) throw e;
    aiFailingOver=true;
    const from=aiCfg.engine, was={key:aiCfg.key, model:aiCfg.model};
    try{
      aiCfg.engine=alt; aiCfg.key=keyFor(alt);
      aiCfg.model=(aiCfg.models&&aiCfg.models[alt])||"";
      const out=await aiCallOne(prompt, doc, Object.assign({},opts,{noFailover:true}));
      // whatever model answered is worth remembering for that provider, not for the one we left
      aiCfg.models=Object.assign({},aiCfg.models||{});
      if(aiCfg.model) aiCfg.models[alt]=aiCfg.model;
      toast(`${ENG_LABEL[from]||"That provider"} was busy — used ${ENG_LABEL[alt]||alt} instead`);
      return out;
    }catch(e2){
      throw aiErr(`${ENG_LABEL[from]||from} and ${ENG_LABEL[alt]||alt} are both busy right now. Give it a minute and try again.`,true);
    }finally{
      aiCfg.engine=from; aiCfg.key=was.key; aiCfg.model=was.model; saveAICfg();
      aiFailingOver=false;
    }
  }
}

/* ---- Reading a job posting from a URL ----
   A browser can't just fetch another site: without CORS headers the request dies before we see
   it. So we go through public readers that do send them. Any one of them can be rate-limited,
   key-walled or blocked by the target site on any given day, so we try several and, if they all
   fail, say WHICH thing failed instead of one shrug of an error message.
   NB: only CORS-safelisted request headers here (Accept is fine). Adding something like
   x-return-format triggers a preflight most of these hosts don't answer, breaking every fetch. */
const URL_READERS = [
  { name:"Jina Reader", to:u=>"https://r.jina.ai/"+u,                                        parse:t=>t },
  { name:"AllOrigins",  to:u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),    parse:htmlToText },
  { name:"CodeTabs",    to:u=>"https://api.codetabs.com/v1/proxy/?quest="+encodeURIComponent(u), parse:htmlToText },
  { name:"direct",      to:u=>u,                                                             parse:htmlToText },
];
// strip a page down to the words, and lift the structured job data most boards embed
function htmlToText(html){
  if(!html) return "";
  if(!/<[a-z!]/i.test(html)) return html;                       // already plain text
  let doc; try{ doc=new DOMParser().parseFromString(html,"text/html"); }catch(e){ return html; }
  const head=[];
  const title=(doc.querySelector("title")||{}).textContent; if(title) head.push(title.trim());
  const md=doc.querySelector('meta[name="description"],meta[property="og:description"]');
  if(md&&md.content) head.push(md.content.trim());
  head.push(...jsonLdJobs(doc));
  doc.querySelectorAll("script,style,noscript,svg,iframe,nav,footer,header,form").forEach(n=>n.remove());
  const main=doc.querySelector("main,article,[role=main]")||doc.body;
  const body=((main&&main.textContent)||"").replace(/[ \t ]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
  return (head.filter(Boolean).join("\n")+"\n\n"+body).trim();
}
// schema.org JobPosting — title, company, salary and description, already structured
function jsonLdJobs(doc){
  const out=[];
  doc.querySelectorAll('script[type="application/ld+json"]').forEach(s=>{
    let data; try{ data=JSON.parse(s.textContent); }catch(e){ return; }
    const walk=n=>{
      if(!n||typeof n!=="object") return;
      if(Array.isArray(n)) return n.forEach(walk);
      if(n["@graph"]) walk(n["@graph"]);
      if(String(n["@type"]||"").includes("JobPosting")){
        const org=n.hiringOrganization&&(n.hiringOrganization.name||n.hiringOrganization);
        const loc=n.jobLocation&&JSON.stringify(n.jobLocation).match(/"addressLocality":"([^"]+)"/);
        const pay=n.baseSalary&&JSON.stringify(n.baseSalary).match(/"(?:minValue|value)":\s*"?([\d.]+)/);
        out.push(["JOB POSTING",
          n.title&&("Title: "+n.title), org&&("Company: "+org),
          loc&&("Location: "+loc[1]), n.employmentType&&("Type: "+n.employmentType),
          pay&&("Pay: "+pay[1]), n.datePosted&&("Posted: "+n.datePosted),
          n.description&&("Description: "+String(n.description).replace(/<[^>]+>/g," ").replace(/\s+/g," ").slice(0,6000))
        ].filter(Boolean).join("\n"));
      }
      Object.values(n).forEach(v=>{ if(v&&typeof v==="object") walk(v); });
    };
    walk(data);
  });
  return out;
}
// try each reader in turn; resolves {text, via} or throws with .tried for a useful message
async function readUrlText(url, onStep){
  const tried=[];
  for(const r of URL_READERS){
    if(onStep) onStep(r.name);
    const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),15000);
    try{
      const res=await fetch(r.to(url),{headers:{Accept:"text/plain, text/html;q=0.9, */*;q=0.8"},signal:ctl.signal});
      clearTimeout(timer);
      if(!res.ok){ tried.push({name:r.name,status:res.status}); continue; }
      const raw=await res.text();
      const text=(r.parse(raw)||"").trim();
      if(text.length<120){ tried.push({name:r.name,status:"empty"}); continue; }
      return {text, via:r.name};
    }catch(e){
      clearTimeout(timer);
      tried.push({name:r.name,status:e.name==="AbortError"?"timeout":"blocked"});
    }
  }
  const err=new Error("no reader could fetch that page"); err.tried=tried; throw err;
}
// job sites that simply won't be read by anything but a logged-in browser
const WALLED=/(^|\.)(linkedin|indeed|glassdoor|ziprecruiter|dice|monster)\.(com|co\.[a-z]{2}|[a-z]{2})$/i;
// turn the pile of attempts into one sentence a person can act on
function readFailMessage(tried,url){
  const s=tried.map(x=>x.status);
  const n=v=>s.filter(x=>x===v).length;
  let host=""; try{ host=new URL(url||"").hostname.replace(/^www\./,""); }catch(e){}
  if(host&&WALLED.test(host)) return `${host.split(".")[0].replace(/^./,c=>c.toUpperCase())} only shows job posts to a signed-in browser, so nothing can read that link from here.`;
  if(s.length&&s.every(x=>x==="blocked"||x==="timeout")) return "Your browser couldn't reach any of the page readers — check your connection, or a network/extension may be blocking them.";
  if(s.length&&s.every(x=>x==="empty")) return "That page loaded but had no readable text — it's probably drawn by JavaScript after a login.";
  const walls=n(403)+n(451), limits=n(429), keys=n(401)+n(402);
  if(walls&&walls>=limits&&walls>=keys) return "That site turns away automated readers — job boards behind a login usually do.";
  if(limits&&limits>=keys) return "The free page readers are rate-limited right now. Waiting a minute usually clears it.";
  if(keys) return "The page readers are asking for an API key today.";
  return "None of the page readers could open that link.";
}

/* Free-tier keys ride along with the vault so a second device just works. Paid keys never do.
   The bug this replaces: selecting a paid engine ran the `else` branch and DELETED the synced
   free key, so switching to ChatGPT on one device silently removed your Groq key from every
   other one. Turning sharing off is the only thing that should clear it. */
function syncAIKey(){
  if(!aiSyncOn()){ if(state.ai){ delete state.ai; save(); } return; }
  // a key set outside the settings form still counts — otherwise sharing silently stops
  if(aiCfg.key && aiCfg.engine && engineIsFree(aiCfg.engine) && !aiKeys()[aiCfg.engine]) aiKeys()[aiCfg.engine]=aiCfg.key;
  const keep={};
  Object.keys(aiKeys()).forEach(e=>{ if(engineIsFree(e)&&aiKeys()[e]) keep[e]=aiKeys()[e]; });
  if(!Object.keys(keep).length){ if(state.ai){ delete state.ai; save(); } return; }
  // the top-level fields stay for older builds; `keys` is what a current one reads
  const active=engineIsFree(aiCfg.engine)?aiCfg.engine:Object.keys(keep)[0];
  const next={engine:active,key:keep[active]||"",model:(aiCfg.models&&aiCfg.models[active])||"",keys:keep,at:Date.now()};
  const cur=state.ai||{};
  if(JSON.stringify({e:cur.engine,k:cur.key,m:cur.model,ks:cur.keys})!==JSON.stringify({e:next.engine,k:next.key,m:next.model,ks:next.keys})){
    state.ai=next; save();
  }
}

/* ============================ COMPANY ENRICH (logo + pre-call brief) ============================ */
// When you're juggling 3-5 live processes, instant visual ID matters. We pull a real company
// logo + canonical domain (Clearbit autocomplete — free, no key) and an AI pre-call brief
// (tagline + ~120-word snapshot). Results cache on the opportunity (o.logo/o.domain/o.tagline/
// o.research) so they sync and never re-fetch. Logo works with zero config; brief uses aiEngine().
async function resolveCompany(name){
  if(!name) return null;
  try{
    const r=await fetch("https://autocomplete.clearbit.com/v1/companies/suggest?query="+encodeURIComponent(name));
    if(!r.ok) return null;
    const arr=await r.json();
    if(Array.isArray(arr)&&arr.length){ const m=arr[0]; return {domain:m.domain||"", logo:m.logo||(m.domain?"https://logo.clearbit.com/"+m.domain:"")}; }
  }catch(e){}
  return null;
}
async function enrichLogo(o){
  if(!o||!o.company) return false;
  if(o.domain && o.logo) return false;        // already resolved
  const m=await resolveCompany(o.company);
  if(m && m.domain){ o.domain=o.domain||m.domain; o.logo=o.logo||m.logo; o.updatedAt=Date.now(); return true; }
  return false;
}
// fire-and-forget after creating/editing a role: grab the logo, then quietly persist + refresh
function enrichLater(o){
  if(!o||!o.company||(o.domain&&o.logo)) return;
  enrichLogo(o).then(ok=>{ if(ok){ save(); render(); if(openId===o.id && $("#drawer").classList.contains("show")) renderDrawer(); } }).catch(()=>{});
}
function briefPrompt(o){
  return `Give a concise pre-interview brief for the company "${o.company}"${o.domain?` (${o.domain})`:""}${o.role?`, for a ${o.role} role`:""}.
Return ONLY a JSON object (no markdown): { "tagline": "", "brief": "" }
- "tagline": one short sentence, max ~9 words, capturing what the company does — for at-a-glance identification.
- "brief": 90-140 words, plain text, covering what they do / product, rough size & stage, who they serve, anything notable recently, and 2-3 talking points or smart questions for the call. If unsure of a fact, hedge rather than invent.`;
}

/* ============================ NATIVE (Capacitor iOS) ============================ */
// Everything here is guarded by isNative() so the web/PWA build is unaffected. Plugins are
// reached through the Capacitor bridge global (window.Capacitor.Plugins.*) — no bundler needed.
// Setup + the iOS Share Extension live in NATIVE.md. Calls are defensive: a missing/renamed
// plugin surfaces a toast, never a crash.
const APP_GROUP="group.com.scheidelholdings.callback";
function cap(){ return (typeof window!=="undefined") && window.Capacitor; }
function isNative(){ const c=cap(); return !!(c && c.isNativePlatform && c.isNativePlatform()); }
function plugin(){ const c=cap(); if(!c||!c.Plugins) return null; for(const n of arguments){ if(c.Plugins[n]) return c.Plugins[n]; } return null; }

function initNative(){
  if(!isNative()) return;
  try{ initShareIntake(); }catch(e){}
  scheduleRemindersSoon();
}

/* ---- Share-into-app: a recruiter email / LinkedIn profile shared into Meanwhile ---- */
function handleSharedText(text){ if(!text||!String(text).trim()) return; spText=String(text); openSmartPaste(true); }
async function initShareIntake(){
  const App=plugin("App");
  if(App && App.addListener){
    App.addListener("appUrlOpen", (d)=>{ try{ const u=new URL(d.url); const t=u.searchParams.get("text")||u.searchParams.get("url")||""; if(t) handleSharedText(decodeURIComponent(t)); }catch(e){} });
    App.addListener("resume", ()=>{ checkSharedInbox(); });
  }
  const Prefs=plugin("Preferences");
  if(Prefs && Prefs.configure){ try{ await Prefs.configure({group:APP_GROUP}); }catch(e){} }
  checkSharedInbox();
}
async function checkSharedInbox(){
  const Prefs=plugin("Preferences"); if(!Prefs) return;
  try{ const {value}=await Prefs.get({key:"shared_intake"}); if(value){ await Prefs.remove({key:"shared_intake"}); handleSharedText(value); } }catch(e){}
}

/* ---- Local-notification reminders for rounds / next steps / offer deadlines ---- */
function remAt(d,t,offMin){ const [y,m,dd]=String(d).split("-").map(Number); let [hh,mm]=String(t||"09:00").split(":").map(Number); const dt=new Date(y,(m||1)-1,dd||1,hh||9,mm||0); return dt.getTime()+(offMin||0)*60000; }
let remTimer=null;
function scheduleRemindersSoon(){ if(!isNative()||!aiCfg.reminders) return; clearTimeout(remTimer); remTimer=setTimeout(syncReminders,1500); }
async function syncReminders(){
  if(!isNative()||!aiCfg.reminders) return;
  const LN=plugin("LocalNotifications"); if(!LN) return;
  try{
    const perm = LN.checkPermissions? await LN.checkPermissions() : {display:"granted"};
    if(perm.display!=="granted") return;
    try{ const pend=await LN.getPending(); if(pend&&pend.notifications&&pend.notifications.length) await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))}); }catch(e){}
    const notes=[]; let id=1; const now=Date.now();
    state.opportunities.forEach(o=>{
      (o.rounds||[]).forEach(r=>{ if(r.date && r.status!=="done" && r.status!=="cancelled"){ const at=remAt(r.date,r.time,r.time?-60:0); if(at>now) notes.push({id:id++,title:`${o.company} — ${r.name||r.type||"interview"}`,body:r.time?`Starts at ${r.time}`:"Today",schedule:{at:new Date(at)}}); } });
      if(o.nextActionDate){ const at=remAt(o.nextActionDate,"09:00",0); if(at>now) notes.push({id:id++,title:`${o.company}: ${o.nextActionLabel||"Next step"}`,body:"Due today",schedule:{at:new Date(at)}}); }
      if(o.offer&&o.offer.deadline){ const at=remAt(o.offer.deadline,"09:00",0); if(at>now) notes.push({id:id++,title:`${o.company}: offer decision`,body:"Decision deadline today",schedule:{at:new Date(at)}}); }
    });
    if(notes.length) await LN.schedule({notifications:notes.slice(0,60)});
  }catch(e){}
}
async function enableReminders(){
  if(!isNative()){ toast("Reminders are available in the iOS app"); return; }
  const LN=plugin("LocalNotifications"); if(!LN){ toast("Install @capacitor/local-notifications"); return; }
  try{ const p=await LN.requestPermissions(); if(p.display!=="granted"){ toast("Notifications not allowed"); return; }
    aiCfg.reminders=true; saveAICfg(); await syncReminders(); toast("Reminders on ✓"); }catch(e){ toast("⚠ "+e.message); }
}

/* ---- On-device calendar scan → Smart add ---- */
function looksLikeInterview(e){ const s=((e.title||"")+" "+(e.notes||"")).toLowerCase(); return /interview|screen(ing)?|onsite|on-site|recruiter|phone screen|hiring|hr call|technical|panel|final round/.test(s); }
async function scanCalendar(){
  if(!isNative()){ toast("Calendar scan is available in the iOS app"); return; }
  const Cal=plugin("CapacitorCalendar","Calendar"); if(!Cal){ toast("Install @ebarooni/capacitor-calendar"); return; }
  try{
    try{ if(Cal.requestFullCalendarAccess) await Cal.requestFullCalendarAccess(); else if(Cal.requestPermissions) await Cal.requestPermissions(); }catch(e){}
    const from=Date.now(), to=from+1000*60*60*24*30; let res;
    if(Cal.listEventsInRange) res=await Cal.listEventsInRange({from,to});
    else if(Cal.getEvents) res=await Cal.getEvents({startDate:from,endDate:to});
    else throw new Error("calendar API not recognized");
    const list=(res.result||res.events||res.data||[]).map(e=>({title:e.title||e.summary||"",notes:e.notes||e.description||"",location:e.location||"",start:e.startDate||e.start||e.eventStartDate}));
    const hits=list.filter(looksLikeInterview);
    if(!hits.length){ toast("No interview-like events in the next 30 days"); return; }
    spText=hits.map(e=>`${e.title}\n${e.notes}\n${e.location}\n${e.start?new Date(e.start).toString():""}`).join("\n--- next event ---\n");
    openSmartPaste(true);
  }catch(e){ toast("⚠ Calendar: "+e.message); }
}

/* ---- Pull a contact's details + photo into the open person form ---- */
async function pullContactInto(){
  if(!isNative()){ toast("Contacts is available in the iOS app"); return; }
  const C=plugin("Contacts","CapacitorContacts"); if(!C){ toast("Install @capacitor-community/contacts"); return; }
  const nameInp=document.querySelector('#personForm [name="name"]'); const q=(nameInp?nameInp.value:"").trim();
  if(!q){ toast("Type a name first"); return; }
  try{
    if(C.requestPermissions) await C.requestPermissions();
    const res=await C.getContacts({projection:{name:true,emails:true,urls:true,image:true,organization:true}});
    const list=res.contacts||res.result||[];
    const disp=c=>(c.name&&(c.name.display||c.displayName))||c.displayName||"";
    const hit=list.find(c=>disp(c).toLowerCase().includes(q.toLowerCase()));
    if(!hit){ toast("No matching contact"); return; }
    const set=(n,v)=>{ const el=document.querySelector(`#personForm [name="${n}"]`); if(el&&v&&!el.value) el.value=v; };
    set("name",disp(hit));
    set("email",(hit.emails&&hit.emails[0]&&(hit.emails[0].address||hit.emails[0].value))||"");
    set("title",(hit.organization&&(hit.organization.company||hit.organization.jobTitle))||"");
    set("linkedin",(hit.urls&&hit.urls[0]&&(hit.urls[0].url||hit.urls[0].value))||"");
    const img=(hit.image&&(hit.image.base64String||hit.image.base64))||hit.photoThumbnail||"";
    // photos render inline all over the app, so they stay in state — as a thumbnail, not a 3MB original
    if(img){ const ph=document.querySelector('#personForm [name="photo"]');
      if(ph) ph.value=await shrinkImage(img.startsWith("data:")?img:("data:image/jpeg;base64,"+img),128); }
    toast("Pulled from Contacts ✓");
  }catch(e){ toast("⚠ Contacts: "+e.message); }
}

$("#overlay").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{
  // ⌘Z / Ctrl+Z, but never while you are typing — the browser's own undo owns the caret there
  if((e.metaKey||e.ctrlKey) && !e.shiftKey && (e.key==="z"||e.key==="Z")){
    const el=document.activeElement, tag=el?(el.tagName||"").toLowerCase():"";
    if(tag==="input"||tag==="textarea"||tag==="select"||(el&&el.isContentEditable)) return;
    if(!canUndo()) return;
    e.preventDefault(); undoLast(); return;
  }
  if(e.key!=="Escape") return;
  if(editorEl) tryCloseEditor();
  else if($("#drawer").classList.contains("show")) closeDrawer();
});

function fd(form){ const d={}; new FormData(form).forEach((v,k)=>d[k]=typeof v==="string"?v.trim():v); return d; }
function saveOpForm(form){
  const d=fd(form);
  if(!d.company){ toast("Company name is required"); return; }
  d.tags=d.tags?d.tags.split(",").map(s=>s.trim()).filter(Boolean):[];
  d.excitement=+d.excitement||0;
  if(d.jdFile){ try{ d.jdFile=JSON.parse(d.jdFile); }catch(e){ delete d.jdFile; } } else { d.jdFile=null; }
  // a manually-entered company website drives the logo (and stops the auto-guess overriding it)
  d.domain=(d.domain||"").trim().replace(/^https?:\/\//,"").replace(/^www\./,"").replace(/\/.*$/,"");
  d.logo = d.domain ? "https://logo.clearbit.com/"+d.domain : "";
  const editId=editorEl&&editorEl.dataset.editId;
  const existing=editId?state.opportunities.find(o=>o.id===editId):null;
  if(existing){ Object.assign(existing,d,{updatedAt:Date.now()}); openId=existing.id; }
  else { const o={id:uid(),createdAt:Date.now(),updatedAt:Date.now(),rounds:[],people:[],offer:{},...d}; state.opportunities.push(o); openId=o.id; }
  save(); closeEditor(); render();
  if(getOp()){ if(!$("#drawer").classList.contains("show")) openDetail(openId); else renderDrawer(); }
  enrichLater(getOp());
  toast("Saved");
}
// Spin a round's free-text interviewers into People records (dedup by name); returns count added
function linkInterviewers(o, str){
  if(!str) return 0; o.people=o.people||[]; let added=0;
  String(str).split(/,|;|&|\band\b/i).forEach(part=>{
    let s=part.trim(); if(s.length<2) return;
    let title=""; const m=s.match(/^(.*?)\s*\(([^)]+)\)\s*$/); if(m){ s=m[1].trim(); title=m[2].trim(); }
    if(!s || s.length<2) return;
    if(o.people.some(p=>(p.name||"").trim().toLowerCase()===s.toLowerCase())) return;
    o.people.push({id:uid(),name:s,title,linkedin:"",email:"",notes:""}); added++;
  });
  return added;
}
function saveRoundForm(form){
  const d=fd(form); const o=getOp(); o.rounds=o.rounds||[];
  d.rating=+d.rating||0;
  const editId=editorEl&&editorEl.dataset.editId;
  if(editId){ Object.assign(o.rounds.find(r=>r.id===editId),d); }
  else { o.rounds.push({id:uid(),...d}); }
  const added=linkInterviewers(o, d.interviewers);
  o.updatedAt=Date.now(); save(); closeEditor(); renderDrawer(); render(); toast(added?`Round saved · +${added} to People`:"Round saved");
}
function savePersonForm(form){
  const d=fd(form); if(!d.name){ toast("Name required"); return; }
  const o=getOp(); o.people=o.people||[];
  const editId=editorEl&&editorEl.dataset.editId;
  if(editId){ Object.assign(o.people.find(p=>p.id===editId),d); }
  else { o.people.push({id:uid(),...d}); }
  o.updatedAt=Date.now(); save(); closeEditor(); renderDrawer(); toast("Saved");

/* ============================ IMPORT / EXPORT ============================ */
// A backup has to be the whole thing, so attachments are re-inlined into the file on the way out
async function exportData(){
  const snap=JSON.parse(JSON.stringify(state));
  // a backup has to be a whole backup, so the bytes come back out of IndexedDB and inline
  const copies=fileRecordsIn(snap), origs=fileRecordsIn(state);
  for(let i=0;i<copies.length;i++){
    const copy=copies[i], orig=origs[i];
    if(!copy||!orig||copy.data) continue;
    const bytes=await fileBytes(orig);
    if(bytes){ copy.data=bytes; delete copy.ref; }
  }
  const blob=new Blob([JSON.stringify(snap,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  const d=new Date(); a.download=`meanwhile-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
  a.click();
  devPrefs.lastExport=Date.now(); saveDev();
  if(view==="dashboard"||view==="work") render();
  toast("Backup downloaded");
}
function importFile(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=async()=>{ try{ const data=JSON.parse(r.result);
    if(!data.opportunities) throw 0;
    if(state.opportunities.length && !confirm("Replace your current data with this backup? (Export first if unsure.)")) return;
    snapshotUndo("that import");
    state=migrate(data); persist();
    await migrateFilesToIDB();   // put any inlined attachments back in the file vault
    save(); render(); toast("Imported "+data.opportunities.length+" roles");
  }catch(e){ toast("⚠ That file didn't look like a Meanwhile backup"); } };
  r.readAsText(file);
}

/* ============================ COPY / TOAST ============================ */
function copy(text,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>toast(msg||"Copied"),()=>fallbackCopy(text,msg)); }
  else fallbackCopy(text,msg);
}
function fallbackCopy(text,msg){ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); toast(msg||"Copied");}catch(e){toast("Press ⌘/Ctrl+C to copy");} ta.remove(); }
let toastT;
/* A leading ⚠ is how every error site in here has always marked itself, so that is the signal:
   it becomes a red toast with a warning icon rather than a green tick over a stack trace. The
   text is trimmed to something a person can read at a glance — the full message is still thrown,
   and anything longer belongs on the page, not floating over it. */
function toast(msg,kind,action){
  const t=$("#toast"); if(!t) return;
  let s=String(msg==null?"":msg).replace(/\s+/g," ").trim();
  const bad = kind==="bad" || /^⚠/.test(s);
  s=s.replace(/^⚠\s*/,"");
  if(s.length>190) s=s.slice(0,187).replace(/[\s,;:{("']+$/,"")+"…";
  t.className="toast"+(bad?" bad":"")+(action?" act":"");
  t.innerHTML=`${bad?I.problem:I.check}<span>${esc(s)}</span>`+
    (action?`<button type="button" class="toast-act" data-toast-act="1">${esc(action)}</button>`:"");
  t.classList.add("show");
  clearTimeout(toastT);
  // an error needs time to read; an offer to undo needs time to take
  toastT=setTimeout(()=>t.classList.remove("show"), action?7000:bad?5200:2400);
}

/* ============================ FILES (JD / résumé attachments) ============================
   Attachments used to be base64 inside the one localStorage key, where a single 2MB PDF ate
   more than half the 5MB budget and got pushed to the cloud on every keystroke-triggered save.
   The bytes now live in IndexedDB (hundreds of MB, same origin, same device) and `state` keeps
   only {name,type,size,ref}. Records with a legacy inline `data` still work and are migrated on
   boot. Exports re-inline the bytes so a backup file is still a complete backup. */
const IDB_NAME="meanwhile_files", IDB_STORE="files";
let idbPromise=null;
function idb(){
  if(idbPromise) return idbPromise;
  idbPromise=new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error("no IndexedDB"));
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error||new Error("IndexedDB blocked"));
  });
  return idbPromise;
}
function idbTx(mode,fn){ return idb().then(db=>new Promise((res,rej)=>{
  const t=db.transaction(IDB_STORE,mode), q=fn(t.objectStore(IDB_STORE));
  t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
})); }
const idbPut=(k,v)=>idbTx("readwrite",s=>s.put(v,k));
const idbGet=k=>idbTx("readonly",s=>s.get(k));
const idbDel=k=>idbTx("readwrite",s=>s.delete(k));
const idbKeys=()=>idbTx("readonly",s=>s.getAllKeys());

function readAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
// → {name,type,size,ref} with the bytes in IndexedDB; falls back to inline if IDB is unavailable
async function fileToData(file){
  const dataURL=await readAsDataURL(file);
  const meta={name:file.name,type:file.type||"application/octet-stream",size:file.size};
  try{ const ref="f_"+uid(); await idbPut(ref,dataURL); return Object.assign(meta,{ref}); }
  catch(e){ return Object.assign(meta,{data:dataURL}); }
}
// the actual bytes for a file record, wherever they live
async function fileBytes(f){
  if(!f) return "";
  if(f.data) return f.data;
  if(f.ref){ try{ return (await idbGet(f.ref))||""; }catch(e){ return ""; } }
  return "";
}
async function downloadData(f){
  const data=await fileBytes(f);
  if(!data){ toast("That file was attached on another device"); return; }
  const a=document.createElement("a"); a.href=data; a.download=(f&&f.name)||"file"; document.body.appendChild(a); a.click(); a.remove();
}
function fileSizeStr(n){ if(!n) return ""; return n<1024?n+" B":n<1048576?(n/1024).toFixed(0)+" KB":(n/1048576).toFixed(1)+" MB"; }
/* Every file record in a given document, in a stable order. exportData relies on that order to
   zip a deep copy against the live one, and sweepOrphanFiles relies on it being COMPLETE — a
   file record missing from here gets its bytes binned as an orphan. Add new attachments here. */
function fileRecordsIn(doc){
  const out=[];
  if(doc.resume&&doc.resume.file) out.push(doc.resume.file);
  (doc.opportunities||[]).forEach(o=>{ if(o&&o.jdFile) out.push(o.jdFile); });
  (((doc.work||{}).captures)||[]).forEach(c=>(c&&c.shots||[]).forEach(s=>{ if(s) out.push(s); }));
  return out.filter(Boolean);
}
// every file record currently referenced anywhere in state
function allFileRecords(){ return fileRecordsIn(state); }
// one-time move of legacy inline attachments into IndexedDB, then drop the fat from state
async function migrateFilesToIDB(){
  const legacy=allFileRecords().filter(f=>f.data&&!f.ref);
  if(!legacy.length) return;
  let moved=0;
  for(const f of legacy){
    try{ const ref="f_"+uid(); await idbPut(ref,f.data); f.ref=ref; delete f.data; moved++; }catch(e){ break; }
  }
  if(moved){ persist(); schedulePush(); }
}
// blobs whose record is gone (a cancelled form, a deleted role) don't get to squat forever
async function sweepOrphanFiles(){
  try{
    const keys=await idbKeys(); if(!keys||!keys.length) return;
    const live=new Set(allFileRecords().map(f=>f.ref).filter(Boolean));
    for(const k of keys){ if(!live.has(k)) await idbDel(k); }
  }catch(e){}
}
// generic file picker: bytes go to IndexedDB, the hidden form input carries only the metadata
async function pickFileInto(field, accept){
  const inp=document.createElement("input"); inp.type="file"; if(accept) inp.accept=accept;
  inp.onchange=async()=>{ const file=inp.files[0]; if(!file) return;
    if(file.size>12*1024*1024){ toast("⚠ File too big (max 12MB)"); return; }
    const f=await fileToData(file);
    const hidden=document.querySelector(`[name="${field}"]`); if(hidden) hidden.value=JSON.stringify(f);
    const lbl=document.querySelector(`[data-filename="${field}"]`); if(lbl) lbl.innerHTML=`📎 ${esc(f.name)} <span style="color:var(--faint)">${fileSizeStr(f.size)}</span> · <span data-clearfile="${field}" style="color:var(--bad);cursor:pointer">remove</span>`;
  };
  inp.click();
}
// contact photos stay inline (they're rendered in a dozen places) so they get shrunk to a thumbnail
function shrinkImage(dataURL, max, q){
  max=max||128;
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const s=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s));
        const ctx=c.getContext("2d");
        ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);   // JPEG has no alpha; a PNG screenshot would go black
        ctx.drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",q||0.72));
      }catch(e){ res(dataURL); }
    };
    img.onerror=()=>res(dataURL);
    img.src=dataURL;
  });
}

/* ---------------- PHOTOS ATTACHED TO A NOTE ("shots") ----------------
   A picture of a whiteboard, a page of handwriting, a printed org chart, a screenshot of a
   directory. It goes to the model to be read, and it stays on the note so you can look at the
   original later. 1500px on the long edge is comfortably enough for the model to read text off
   and keeps a phone photo from turning a 5MB budget into a 4MB prompt. */
const SHOT_MAX=1500, SHOT_LIMIT=4;
function isImageFile(f){ return !!f && (/^image\//i.test(f.type||"") || /\.(png|jpe?g|gif|webp|heic|heif|bmp)$/i.test(f.name||"")); }
// File → {name,type,size,ref,w,h} with the downscaled bytes in IndexedDB
async function imgToShot(file){
  const raw=await readAsDataURL(file);
  const small=await shrinkImage(raw,SHOT_MAX,0.82);
  const dim=await new Promise(res=>{ const i=new Image(); i.onload=()=>res({w:i.width,h:i.height}); i.onerror=()=>res({w:0,h:0}); i.src=small; });
  const meta={name:file.name||"photo.jpg",type:"image/jpeg",size:Math.round((small.length-small.indexOf(",")-1)*0.75),w:dim.w,h:dim.h};
  try{ const ref="f_"+uid(); await idbPut(ref,small); return Object.assign(meta,{ref}); }

/* ---------------- CROPPING A SHOT ----------------
   Photographing a whiteboard gets you the whiteboard plus half the room, and the room is noise the
   model has to read past. Cropping to the part that matters measurably sharpens what comes back.
   Hand-rolled: a crop rectangle over the image, pointer events so touch and mouse share one path,
   and canvas to re-encode. Rotation re-encodes immediately rather than being carried as state —
   one orientation to reason about is worth a re-encode nobody can see. */
let crop=null;   // {shots, idx, img, box:{x,y,w,h}, mode, start, after}
const CROP_MIN=44;
function cropRect(){ return crop.img.getBoundingClientRect(); }
function cropClamp(){
  const r=cropRect(), b=crop.box;
  b.w=Math.max(CROP_MIN,Math.min(b.w,r.width));
  b.h=Math.max(CROP_MIN,Math.min(b.h,r.height));
  b.x=Math.max(0,Math.min(b.x,r.width-b.w));
  b.y=Math.max(0,Math.min(b.y,r.height-b.h));
}
function cropPaint(){
  const b=crop.box, el=document.getElementById("crBox");
  if(!el) return;
  el.style.left=b.x+"px"; el.style.top=b.y+"px"; el.style.width=b.w+"px"; el.style.height=b.h+"px";
}
function cropReset(){
  const r=cropRect();
  crop.box={x:0,y:0,w:r.width,h:r.height};
  cropPaint();
}
async function openCropper(shots, idx, after){
  const s=shots[idx]; if(!s) return;

  const w=el(`<div id="cropper">
    <div class="cr-head">Drag the corners to keep just the part that matters</div>
    <div class="cr-stage"><img id="crImg" alt=""/><div id="crBox" class="cr-box">
      <i data-crh="nw"></i><i data-crh="ne"></i><i data-crh="sw"></i><i data-crh="se"></i></div></div>
    <div class="cr-bar">
      <button class="btn ghost sm" data-act="cr-cancel">Cancel</button>
      <button class="btn ghost sm" data-act="cr-rot">↻ Rotate</button>
      <button class="btn ghost sm" data-act="cr-reset">Reset</button>
      <button class="btn primary sm" data-act="cr-done">${I.check} Done</button>
    </div></div>`);
  document.body.appendChild(w);
  const img=document.getElementById("crImg");
  crop={shots,idx,img,box:{x:0,y:0,w:0,h:0},mode:"",start:null,after};
  img.onload=()=>{ cropReset(); armCropper(); };
  img.src=url;
}
function closeCropper(){ const w=document.getElementById("cropper"); if(w) w.remove(); crop=null; }
function armCropper(){
  const stage=document.querySelector("#cropper .cr-stage");
  if(!stage||stage.dataset.bound) return;
  stage.dataset.bound="1";
  const pt=e=>{ const r=cropRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  stage.addEventListener("pointerdown",e=>{
    if(!crop) return;
    const h=e.target.closest("[data-crh]");
    const p=pt(e), b=crop.box;
    if(h) crop.mode=h.dataset.crh;
    else if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h) crop.mode="move";
    else return;                                  // a tap outside the box does nothing
    crop.start={p,box:Object.assign({},b)};
    stage.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  stage.addEventListener("pointermove",e=>{
    if(!crop||!crop.mode) return;
    const p=pt(e), s=crop.start, dx=p.x-s.p.x, dy=p.y-s.p.y, b=crop.box, o=s.box;
    if(crop.mode==="move"){ b.x=o.x+dx; b.y=o.y+dy; }
    else{
      // each corner moves two edges; the opposite corner stays put
      if(crop.mode.includes("w")){ b.x=o.x+dx; b.w=o.w-dx; }
      if(crop.mode.includes("e")){ b.w=o.w+dx; }
      if(crop.mode.includes("n")){ b.y=o.y+dy; b.h=o.h-dy; }
      if(crop.mode.includes("s")){ b.h=o.h+dy; }
      // dragging a corner past its opposite would invert the box; stop it at the minimum
      if(b.w<CROP_MIN){ if(crop.mode.includes("w")) b.x=o.x+o.w-CROP_MIN; b.w=CROP_MIN; }
      if(b.h<CROP_MIN){ if(crop.mode.includes("n")) b.y=o.y+o.h-CROP_MIN; b.h=CROP_MIN; }
    }
    cropClamp(); cropPaint(); e.preventDefault();
  });
  const end=()=>{ if(crop) crop.mode=""; };
  stage.addEventListener("pointerup",end);
  stage.addEventListener("pointercancel",end);
  window.addEventListener("resize",()=>{ if(crop) { cropClamp(); cropPaint(); } });
}
// draw the chosen region (or the whole thing, rotated) back out as a fresh JPEG
async function cropExport(rotate){
  if(!crop) return null;
  const img=crop.img, r=cropRect();
  const scale=img.naturalWidth/r.width;
  let sx=0, sy=0, sw=img.naturalWidth, sh=img.naturalHeight;
  if(!rotate){
    sx=Math.round(crop.box.x*scale); sy=Math.round(crop.box.y*scale);
    sw=Math.round(crop.box.w*scale); sh=Math.round(crop.box.h*scale);
  }
  const turned=!!rotate;
  const outW=turned?sh:sw, outH=turned?sw:sh;
  const k=Math.min(1,SHOT_MAX/Math.max(outW,outH));
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(outW*k)); c.height=Math.max(1,Math.round(outH*k));
  const x=c.getContext("2d");
  x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height);      // JPEG has no alpha
  if(turned){ x.translate(c.width,0); x.rotate(Math.PI/2); x.drawImage(img,0,0,sw,sh,0,0,c.height,c.width); }
  else x.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
  return {data:c.toDataURL("image/jpeg",rotate?0.92:0.85), w:c.width, h:c.height};
}
async function cropApply(rotate){
  const out=await cropExport(rotate);
  if(!out) return;
  const s=crop.shots[crop.idx];
  if(rotate){
    // rotation stays in the editor: re-point the image and start the crop over in the new shape
    crop.img.onload=()=>{ cropReset(); };
    crop.img.src=out.data;
    return;
  }
  const ref=s.ref||("f_"+uid());
  try{ await idbPut(ref,out.data); Object.assign(s,{ref,w:out.w,h:out.h,size:Math.round(out.data.length*0.75)}); delete s.data; }
  catch(e){ Object.assign(s,{data:out.data,w:out.w,h:out.h}); }
  const fn=crop.after;
  closeCropper();
  if(fn) fn();
  toast("Cropped");
}

function resumeDerivedText(d){

    else { toast("Stored the file. For DOCX, paste the text or export to PDF to auto-structure."); if(editorEl) spSetBody(resumeStudioBody()); }
  };
  inp.click();
}

function rsHTML(d){

  }).join("");
  const edu=(d.education||[]).map(x=>{

  return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(d.name||"Résumé")}</title><style>${rsCSS(tpl)}</style></head>

    <header><h1>${esc(d.name||"")}</h1>${d.title?`<div class="title">${esc(d.title)}</div>`:""}${contact?`<div class="contact">${contact}</div>`:""}</header>
    ${d.summary?`<div class="sec"><h2>Summary</h2><p class="summary">${esc(d.summary)}</p></div>`:""}
    ${exp?`<div class="sec"><h2>Experience</h2>${exp}</div>`:""}
    ${edu?`<div class="sec"><h2>Education</h2>${edu}</div>`:""}
    ${skills}
  </div></body></html>`;
